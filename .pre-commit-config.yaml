default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # deploy/otel-collector/otel-collector.yaml is a string.Template
        # SOURCE, not YAML: $DATA_PLANE_RECEIVERS stands where a whole receiver
        # block is spliced in, which no YAML parser can accept. The rendered
        # output is what must parse, and cli/commands/observability/tests/test_converge_otel_collector.py
        # parses it for every role combination — a stricter gate than this hook.
        exclude: ^deploy/otel-collector/otel-collector\.yaml$
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  # Gitleaks supersedes detect-private-key and shares its policy with CI, so
  # fixture exceptions cannot drift between local commits and pull requests.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: [--config=.gitleaks.toml]

  - repo: local
    hooks:
      - id: check-git-hooks-install
        name: check Git hooks installation (warn-only)
        entry: python3 scripts/provision/check_git_hooks.py
        language: system
        stages: [pre-commit]
        always_run: true
        pass_filenames: false
        verbose: true

      - id: lint-python-lock
        name: lint Python lock (canonical PyPI sources)
        entry: .venv/bin/python scripts/lint/python_lock.py
        language: system
        files: ^(uv\.lock|scripts/lint/python_lock\.py|scripts/lint/tests/test_lint_python_lock\.py)$
        pass_filenames: false

      - id: pyright
        name: pyright (strict mode, branch-changed files only)
        # Use the pyright from the uv venv — deps are complete, no need to
        # reinstall langgraph / psycopg / redis etc. in an isolated hook env.
        # Local runs check only the branch's own changed .py files (user
        # ruling 2026-09-22: no full-repo/full-suite runs locally) — the
        # wrapper computes merge-base(origin/main, HEAD)..HEAD itself and
        # passes just those paths to pyright; a full-repo strict pyright
        # stays CI-only (`uv run pyright` in backend-static). always_run
        # because the scoping is internal to the script, not pre-commit's
        # own (differently-computed) push-time file selection.
        entry: bash scripts/prepush-pyright-files.sh
        stages: [pre-push]
        verbose: true  # Successful skips must stay visible.
        language: system
        always_run: true
        pass_filenames: false

      # `--only FILE...` on the lints below: the commit judges the changed files under the lint's own
      # scope, and a change to the lint tooling or to an input its rule reads widens it to the full
      # scan (scripts/lint/docs/changed-files-mode.ava.okf.md). CI's `--all-files` is the full scan.
      #
      # No sync blocking calls in async bodies (gateway + ops event-loop surfaces).
      # One sync psycopg / subprocess call in an async handler freezes the
      # whole gateway (2026-08-03 incident); a justified bounded read opts out with
      # `# async-blocking-ok: <reason>`; see the script header for the full rules.
      - id: lint-async-no-sync-blocking
        name: lint async bodies (no sync blocking calls)
        entry: .venv/bin/python scripts/lint/async_no_sync_blocking.py --only
        language: system
        # A package's own tests/ directory is not scanned by the lint, so it does not trigger it.
        files: ^((gateway|ops)/(?!(?:.*/)?tests/).*|scripts/lint/async_no_sync_blocking)\.py$

      # Ban raw os.environ / os.getenv — runtime config must go through base.config.settings.
      # Legitimate exceptions (3rd-party secret / IPC handoff / container entrypoints)
      # use an inline `# env-ok: <reason>` exemption, see scripts/lint/no_os_environ.py header.
      - id: lint-no-os-environ
        name: lint os.environ (force settings)
        entry: .venv/bin/python scripts/lint/no_os_environ.py --only
        language: system
        types: [python]

      # PYTHONSAFEPATH=1 (2026-08-22 hardening) keeps a script's own directory
      # off sys.path, so a script-mode file importing a same-dir sibling without
      # restoring its directory first breaks (daily_scan.py 2026-08-23 crash).
      # The lint enforces the restore-before-import guard; see the script header.
      - id: lint-no-script-sibling-imports
        name: lint script sibling imports (PYTHONSAFEPATH guard)
        entry: .venv/bin/python scripts/lint/no_script_sibling_imports.py --only
        language: system
        types: [python]

      # per_agent config fields read through the bare settings singleton in
      # turn-scoped code silently ignore the agent's overlay in hosted-runner
      # mode — force the per-turn view (base/config/turn_view.py).
      - id: lint-turn-scoped-config
        name: lint per-agent config reads (force turn_settings)
        entry: .venv/bin/python scripts/lint/turn_scoped_config.py --only
        language: system
        types: [python]

      # A fixture whose scope outlives the blast radius of the process global it
      # mutates. A session-scoped fixture in a SUBDIRECTORY conftest restores env in
      # a teardown that fires at end-of-session, so every test collected after that
      # directory keeps running with the mutated value — which is how tests/e2e/'s
      # env layering disarmed tests/test_home_isolation.py on main while CI stayed
      # green. Also catches `scope="package"` in a directory with no __init__.py,
      # where pytest silently resolves the scope to the session node. Session scope
      # is exempt only in tests/fixtures/provisioning.py; see the script header.
      - id: lint-fixture-scope
        name: lint fixture scope (no session-scoped mutation of a process global)
        entry: .venv/bin/python scripts/lint/fixture_scope.py --only
        language: system
        # Every tests/ directory: the top-level one and each package's own <pkg>/**/tests/.
        files: (^|/)tests/.*\.py$

      # A test may not patch a private name of a package it does not belong to
      # (structure Rule 8): every such reach-in is a missing injection seam, and
      # Rule 4's exemption of test files left string targets such as
      # monkeypatch.setattr("base.db.connections._pool", ...) unchecked. The
      # package a test belongs to comes from its own imports (placement rule),
      # not its directory, so the verdict survives the move into <pkg>/tests/.
      # Today's sites are frozen in the `patch_targets` baseline section.
      # This hook checks per file: pre-commit passes the changed test files and
      # only those are checked; a changed lint, placement module or baseline
      # shard triggers a full scan (~6s). A test's home follows what its
      # subject's package imports, so a production import change can move the
      # home of a test that did not change: the full scan below runs at every
      # push, and CI's structure job (--all-files) scans everything too. See
      # scripts/lint/patch_targets.py header.
      - id: lint-patch-targets
        name: lint patch targets (tests may not patch another package's private names)
        entry: .venv/bin/python scripts/lint/patch_targets.py
        language: system
        require_serial: true
        files: ^((tests|(agent|ava|ava_builtins|base|cli|gateway|ops|services|shared|scripts)(/.*)?/tests)/.*\.py|scripts/lint/patch_targets\.py|scripts/structure/(placement|import_cache|patch_points|patch_targets|patch_report|locality|baseline_shards)\.py|scripts/structure/baseline/.*\.json)$

      # The full scan of the hook above, at every push that touches Python, whatever the
      # diff (pre-commit's own file selection would never pass it the untouched tests whose
      # home a production import change moves, and never a deleted path). A push with no
      # Python on the branch cannot move a test's home, so it skips the scan.
      - id: lint-patch-targets-full
        name: lint patch targets, full scan (a production import change moves other tests' homes)
        entry: bash scripts/prepush-if-changed.sh '\.py$' -- .venv/bin/python scripts/lint/patch_targets.py
        language: system
        stages: [pre-push]
        verbose: true  # A skip must stay visible.
        always_run: true
        pass_filenames: false
        require_serial: true

      # Ban building a psycopg pool without TCP keepalives where the structure
      # gate's `postgres-dial` rule cannot see it: scripts/ and the modules that
      # decision allows. See scripts/lint_pool_keepalives.py header.
      - id: lint-pool-keepalives
        name: lint pool keepalives (no pool without PG_KEEPALIVE_KWARGS outside Rule 5)
        entry: .venv/bin/python scripts/lint_pool_keepalives.py --only
        language: system
        types: [python]

      # Ban a logger.add(...) sink that does not explicitly pass diagnose=False.
      # loguru's diagnose defaults to True, so logger.exception(...) on an
      # unmarked sink renders every local variable of the failing frames (DSNs,
      # tokens, passwords) into the sink's output — file, journal, and the
      # telemetry pipeline that mirrors into Loki. No inline exemption; see
      # scripts/lint/logger_add_diagnose.py header.
      - id: lint-logger-add-diagnose
        name: lint logger.add diagnose (no sink without diagnose=False)
        entry: .venv/bin/python scripts/lint/logger_add_diagnose.py --only
        language: system
        types: [python]

      # Each logger keeps its own message format. loguru formats with
      # str.format, so `logger.warning("x %s", v)` logs the literal `%s` and
      # silently drops every argument; stdlib `logging` formats with `%`, so
      # `_log.info("x {}", v)` (a `logging.getLogger(...)` logger) raises
      # TypeError at emit and the line is lost. The two are told apart by where
      # each name comes from, not by file. Deliberate literals opt out with
      # `# log-format-ok: <reason>`; see scripts/lint/loguru_format.py header.
      - id: lint-loguru-format
        name: lint log format (loguru takes {}, stdlib logging takes %s)
        entry: .venv/bin/python scripts/lint/loguru_format.py --only
        language: system
        types: [python]

      # Ban raw CJK characters anywhere in the repo — English-only source
      # (user ruling 2026-08-27, tightening English-primary). Exemption: i18n /
      # locale copy only (<dir>/messages/*.json, */locales/*, *.po, and
      # base/telemetry/alerts_copy.py — the IM alert-copy locale module). Skill bodies,
      # code comments, docs, tests, fixtures, demos all fail on raw CJK;
      # functional CJK data is written as \uXXXX escapes (runtime-identical).
      # Scope: every tracked file; a commit judges the changed ones (--only), `--all-files` all of
      # them. See scripts/content_lint/lint_no_cjk.py header.
      - id: lint-no-cjk
        name: lint no CJK (repo-wide, English-only source)
        entry: .venv/bin/python scripts/content_lint/lint_no_cjk.py --only
        language: system

      # Ban tailnet IP literals (100.64.0.0/10 host addresses) repo-wide — the
      # cluster's user-visible URL derives from AVA_GATEWAY_URL / reachable_host(),
      # never from a literal. CIDR range notation (100.64.0.0/10) stays allowed;
      # a test that exercises the range boundary opts out inline with
      # `# tailnet-ip-ok: <reason>`. See scripts/content_lint/lint_no_tailnet.py header.
      - id: lint-no-tailnet
        name: lint no tailnet IP literals (repo-wide)
        entry: .venv/bin/python scripts/content_lint/lint_no_tailnet.py --only
        language: system

      # The root supervisor's own code (services/ava_root/) must stay free of
      # permission-domain and macOS-specific symbols — the privileged helper
      # program is a separate codebase by design (ruling 2026-09-12), and this
      # lint is the machine-checkable half of that constraint. A line that
      # genuinely must carry a name opts out inline with
      # `# ava-root-scope-ok: <reason>`; see scripts/lint/ava_root_scope.py header.
      - id: lint-ava-root-scope
        name: lint ava-root scope (no permission-domain symbols)
        entry: .venv/bin/python scripts/lint/ava_root_scope.py
        language: system
        files: ^(services/ava_root/(?!(?:.*/)?tests/)|scripts/lint/ava_root_scope\.py$|scripts/lint/tests/test_lint_ava_root_scope\.py$)
        pass_filenames: false

      # Ban decorative emoji in core Python (agent + backend layers). UX surfaces
      # (cli/, ui/) and prose/content (skills/, docs/, ui/web/) are exempt and
      # not scanned. A line that genuinely needs the character uses an inline
      # `# emoji-ok: <reason>`; see scripts/lint/no_emoji.py header for scope.
      - id: lint-no-emoji
        name: lint no emoji (core code stays glyph-free)
        entry: .venv/bin/python scripts/lint/no_emoji.py --only
        language: system
        types: [python]

      # Ban bare `ava.x.y = ...` / setattr monkey-patching in plugins — SDK wraps
      # go through `ava.extend.wrap` so the stack stays introspectable + reversible.
      # Deliberate exceptions use an inline `# wrap-ok: <reason>`; see
      # scripts/lint/no_plugin_wrap.py header.
      - id: lint-no-plugin-wrap
        name: lint no plugin wrap (force ava.extend.wrap)
        entry: .venv/bin/python scripts/lint/no_plugin_wrap.py --only
        language: system
        types: [python]

      # Agent-visible docstring lint — docstrings in ava/*.py + plugin namespace
      # modules + plugin.py wrap targets are spliced into the LLM system prompt
      # and must be all English with no framework impl-details. Rules and the
      # _KNOWN_DIRTY_FILES allowlist live in scripts/lint/agent_docstrings.py
      # header and the "SDK docstring discipline" section of AGENTS.md.
      - id: lint-agent-docstrings
        name: lint agent-visible docstrings (no CJK, no impl-detail leak)
        entry: .venv/bin/python scripts/lint/agent_docstrings.py
        language: system
        # Judges only the agent-visible docstrings of ava/ and plugin modules (plus AGENTS.md).
        files: ^(ava/|ava_builtins/plugins/|AGENTS\.md$|scripts/lint/agent_docstrings\.py$)
        pass_filenames: false

      # Structural lints for agent legibility — bans `if TYPE_CHECKING:` import
      # folding; budgets are 800 lines/file, 20 direct entries/directory,
      # CC <15 (10-14 warn), and nesting <=5 over packages + tests/scripts,
      # with a frozen shrink-only baseline checked against the base revision.
      # Also locality: no `_`-private import from outside its owning package
      # (package doors), and single decision owners (scripts/structure/
      # locality.py DECISIONS, e.g. postgres-dial -> base/db/connections.py) —
      # both frozen in the baseline shards as exact site counts. Rules + the
      # _TYPE_CHECKING_ALLOWED list live in scripts/lint/code_structure.py
      # header. (print() bans are enforced by ruff T20, not here.)
      - id: lint-code-structure
        name: lint code structure (AST rules, file/directory budgets, package doors, single owners)
        entry: .venv/bin/python scripts/lint/code_structure.py --only
        language: system
        # The baseline JSON is an input: editing it (like any lint tooling file) widens the run
        # to the full scan. One process, so a `--all-files` run is that single full scan.
        files: ^(.*\.py|scripts/structure/baseline/.*\.json)$
        require_serial: true

      # AGENTS.md line-count ceiling (constants in the script; hard + a
      # transitional note zone below it). Prevents progressive bloat —
      # specialized rules go in conventions/.
      - id: lint-agents-md-size
        name: lint AGENTS.md size (100-line ceiling)
        entry: .venv/bin/python scripts/lint/agents_md_size.py
        language: system
        files: AGENTS.md
        pass_filenames: false

      # SKILL.md frontmatter gate: (1) must load with the runtime parser +
      # carry name/description — a malformed repo skill would crash every agent
      # at system-prompt build, so it is caught at merge here (the runtime loader
      # only skip-warns the externally-installed ones it cannot gate); (2)
      # description hard ceiling 80 units (one CJK char or one non-CJK word = 1
      # unit) — the index line the agent reads, in every system prompt for
      # injected skills. Soft target (50) is the sweeper's skill-desc class.
      - id: lint-skill-descriptions
        name: lint SKILL.md frontmatter (parse + required fields + description length)
        entry: .venv/bin/python scripts/content_lint/lint_skill_descriptions.py
        language: system
        files: '((\.ava/)?skills|plugins)/.*/SKILL\.md$'
        pass_filenames: false

      # Core-content manifest gate (content channel, tasks #2915/#3267):
      # every `ava-plugin.json` under ava_builtins/ must validate and its
      # declared gates (engines.ava range / requires_commit ancestry) must hold
      # against the repo's DERIVED host version (HEAD's commit date). The
      # non-core manifests in the tree are audited (report-only) so a legacy
      # range the derived-version switch would refuse is visible here too.
      - id: lint-core-content-manifests
        name: lint core-content manifests (ranges + requires_commit vs derived host version)
        entry: .venv/bin/python scripts/content_lint/lint_core_content_manifests.py
        language: system
        files: '(ava-plugin\.json$|^scripts/content_lint/lint_core_content_manifests\.py$|^base/packages/plugins/manifest\.py$|^base/deploy/git/host_version\.py$)'
        pass_filenames: false

      # SKILL.md line-count ceiling to prevent progressive bloat.
      # Hard ceiling 300 lines; transitional zone 250-300.
      - id: lint-skill-md-size
        name: lint SKILL.md size (line-count ceiling)
        entry: .venv/bin/python scripts/content_lint/lint_skill_md_size.py
        language: system
        files: '((\.ava/)?skills|plugins)/.*/SKILL\.md$'
        pass_filenames: false

      # Runbook daemon roster <-> build_services() must agree (both directions).
      # Catches "deleted a daemon but left it documented" (#728's scheduler row)
      # and "added a daemon, forgot the roster". Parses the table under the
      # <!-- lint:roster-table --> sentinel; reads both sides itself. Also pins the
      # healthcheck roster (check-roster.ava.okf.md) to the healthcheck modules.
      - id: lint-doc-roster
        name: lint-doc-roster
        language: system
        entry: .venv/bin/python scripts/content_lint/lint_doc_roster.py
        files: ^(cli/commands/_repo\.py|conventions/runbook\.md|scripts/content_lint/lint_doc_roster\.py|services/healthchecks/docs/check-roster/check-roster\.ava\.okf\.md)$
        pass_filenames: false

      # Every `ava.<name>` reference in the procedural docs — conventions and
      # the repo's own dev skills under .agents/skills — (inside a code span) must
      # resolve to a live member of the ava namespace. Catches "deleted/renamed
      # an SDK module, forgot to scrub the doc" (the ava.monitor/ava.schedule
      # drift class). Valid set = ava.__all__ + real submodules + module attrs +
      # plugin-registered namespaces; prose mentions are excluded (zero-FP guard).
      - id: lint-doc-symbols
        name: lint-doc-symbols
        language: system
        entry: .venv/bin/python scripts/content_lint/lint_doc_symbols.py
        files: ^(conventions/.*\.md|\.agents/skills/.*\.md|ava/__init__\.py|scripts/content_lint/lint_doc_symbols\.py)$
        pass_filenames: false

      # The other half of the same guard: every `path/to/file.py:symbol` anchor
      # in those same procedural docs (inside a code span) must resolve against
      # the AST of the file it names. lint-doc-symbols validates the `ava.*` SDK
      # namespace and never sees this shape. Triggered by ANY .py change, not
      # just a doc edit — a rename is what dangles an anchor, and it happens in
      # the code, in a file the citing doc never mentions. Whole-corpus scan
      # (pass_filenames: false): 265 files, ~0.3s — only the ~20 distinct
      # anchored targets are parsed, and each is parsed once.
      - id: lint-doc-anchors
        name: lint-doc-anchors
        language: system
        entry: .venv/bin/python scripts/content_lint/lint_doc_anchors.py
        files: ^(conventions/.*|\.agents/skills/.*|ava_builtins/skills/.*|.*\.ava\.okf\.md|.*\.py)$
        pass_filenames: false

      # Every CLI flag written as a command invocation, and every relative
      # markdown link, across all tracked docs — checked against the live
      # argparse tree / scripts/*.sh case arms / the tree on disk. Runs the
      # whole doc set regardless of which files changed (pass_filenames: false):
      # a link goes stale from a move anywhere, not just an edit to the doc
      # citing it. decisions/ is exempt entirely; future/ only skips
      # flag checks (a `(planned)` marker opts a specific link out) — see
      # scripts/content_lint/check_doc_references.py's own docstring for the full rationale
      # (including issue #1045, why future/ is no longer a blanket skip).
      - id: check-doc-references
        name: check doc references (CLI flags + relative links resolve)
        language: system
        entry: .venv/bin/python scripts/content_lint/check_doc_references.py
        files: (\.md$|^cli/main\.py$|^scripts/(content_lint/check_doc_references\.py|.*\.sh)$)
        pass_filenames: false

      - id: check-narrative-facts
        name: check narrative facts (skill catalog / IM commands / IM channels match code)
        language: system
        entry: .venv/bin/python scripts/content_lint/check_narrative_facts.py
        files: (\.md$|^scripts/content_lint/check_narrative_facts\.py$|^services/im_bridge/)
        pass_filenames: false

      # The flake8-bandit typed-exception switch needed by S110 also affects
      # S112. Keep S112's pre-migration behavior without 138 unrelated findings.
      - id: lint-ruff-s112
        name: lint Ruff S112 with typed exceptions off
        language: system
        entry: .venv/bin/ruff check --select S112 --config "lint.ignore = []" --config "lint.flake8-bandit.check-typed-exception = false"
        files: \.py$

      # Every UPDATE that writes agents_meta.status='terminated' must stamp
      # termination_source in the SAME statement. A NULL source is permanently
      # unresurrectable (CrashResurrectController's claim filters on it), so a
      # write site that forgets leaves a corpse nothing can revive and silently
      # strands its queued inbound work — no error, no log. AST-based, so it
      # catches the bind-parameter form (`SET status = %s` with
      # AgentStatus.TERMINATED in the params) that a grep misses; that is exactly
      # the form the boot-gate site slipped through in. The script self-filters to
      # non-test dirs, so files: \.py$ is a coarse gate.
      - id: lint-termination-source
        name: lint termination_source stamping (every terminated-write names its source)
        language: system
        entry: .venv/bin/python scripts/lint/termination_source.py --only
        files: \.py$

      - id: lint-clock-lattice
        name: lint clock lattice (lattice-vocabulary clocks only in the family modules)
        language: system
        entry: .venv/bin/python scripts/lint/clock_lattice.py --only
        files: \.py$

      # A test that exactly asserts a value derived from a repo fixed-instant
      # constant while the derivation can reach the real clock is correct only
      # until the wall clock passes the constant's boundary — the 2026-08-30
      # pair of deterministic-red tests that each ejected the merge-queue
      # batch. Also guards the source side: a function that accepts a clock
      # parameter must thread it into fixed-instant window boundaries, and the
      # test side against fixed calendar fixtures bound to window-shaped names
      # (a pinned date rots the day the window rolls past it). See
      # scripts/lint/time_bomb.py.
      - id: lint-time-bomb
        name: lint time bombs (fixed instant x real clock)
        entry: .venv/bin/python scripts/lint/time_bomb.py --only
        language: system
        types: [python]

      # Pyright's Unknown/Missing ladder leaves ignores inert when a rule is
      # warning-only for that file. With that debt cleared, every zombie is an
      # error instead of a grandfathered exception.
      - id: lint-zombie-pyright-ignores
        name: lint zombie Pyright ignores (zero warning-tier ignores)
        entry: .venv/bin/python scripts/lint/zombie_pyright_ignores.py --check --only
        language: system
        files: ^(.*\.py|pyproject\.toml)$

      # (Config-scope ownership is now enforced at import by the config package's
      # registry builder — base/config/__init__.py:_build_registry fails fast on
      # a field with a missing/invalid scope, so the former standalone
      # lint-config-scope hook retired.)

      # Import-direction contract (config in pyproject [tool.importlinter]):
      # locks base < ava < agent < gateway < {services,cli} so no new
      # reverse edge into a lower layer can creep back in. Analyzes the whole
      # import graph, so pass_filenames: false + trigger on any .py change.
      - id: lint-imports
        name: lint import direction (layered architecture)
        # import-linter has no pyproject.toml cache-dir key (cache_dir is a CLI/API
        # arg only) — pass it explicitly so its cache lands under .cache/ like
        # every other tool (conventions/dev-setup.md "Tool caches").
        entry: .venv/bin/lint-imports --cache-dir .cache/import-linter
        language: system
        types: [python]
        pass_filenames: false


      # NoteTag <-> system_marker sync: the backend enum and frontend dispatch
      # sets must be equal. A missing frontend branch falls through to the red
      # 'Unrecognized system_marker' alarm; a stale branch hides a renamed or
      # removed backend tag. This lint catches either drift at commit time.
      - id: lint-note-tags
        name: lint NoteTag / system_marker bidirectional sync
        entry: .venv/bin/python scripts/lint/note_tags.py
        language: system
        files: ^(base/agents/messages/kwargs\.py|ui/web/src/components/timeline/markers\.tsx)$
        pass_filenames: false

      # Migration layout: timestamp-id filename format, unique names, up/down
      # pairing (every post-baseline migration must be reversible — the baseline
      # is the rollback floor), and db/schema.sql's baseline seed. CI has always
      # run this; locally it ran nowhere, so a malformed migration was only
      # caught after push — and migrations are the change class where finding
      # out late costs the most. Gated on migrations/ + db/schema.sql (the two
      # inputs the script reads), so it costs nothing on any other commit.
      #
      # Note the heavier sibling stays CI-only *deliberately*:
      # scripts/ci/migration_smoke.py boots a throwaway Postgres and shells out to
      # `psql` for the baseline apply + trigger poke. That toolchain is in the
      # CI image but not on every dev machine, so as a commit hook it would fail
      # for reasons unrelated to the commit — which is precisely the pressure
      # that produces a `--no-verify` habit (see .agents/skills/ship-a-change/SKILL.md).
      - id: lint-migrations
        name: lint migrations (timestamp-id format + up/down pairing + baseline seed)
        entry: .venv/bin/python scripts/content_lint/lint_migrations.py
        language: system
        files: ^(migrations/|db/schema\.sql$)
        pass_filenames: false

      # No pytest hook: the commit gate is lint-only. The full non-e2e suite
      # used to run here (each xdist worker provisioning its own throwaway
      # native Postgres + Redis), which saturated the dev host on
      # every commit and — with several Claude Code sessions committing in
      # parallel worktrees — made concurrent sessions squeeze
      # each other into connection-timeout false failures. Kernel-style
      # layering instead: while developing, run the tests for the scope you
      # touched; the full suite + e2e + coverage run in CI, the merge gate.

      # Frontend TypeScript typecheck — `tsc --noEmit` runs across the whole
      # project to catch type drift / missed union updates / cross-file type
      # mismatches (the root cause of plain-text silent fallback in things
      # like SystemMarker: TS doesn't report, but runtime gets a bare string).
      # Triggers on any frontend ts/tsx change; runs the whole project because
      # tsc doesn't support incremental single-file checks.
      - id: frontend-tsc
        name: frontend tsc --noEmit
        entry: bash scripts/prepush-guard.sh tsc -- bash -c 'cd ui/web && npx --no-install next typegen && npx --no-install tsc --noEmit'
        stages: [pre-push]
        verbose: true
        language: system
        files: ^ui/web/.*\.(ts|tsx)$
        pass_filenames: false

      # ESLint over the files this commit changed, through the same warning gate as CI (errors
      # and unbaselined warnings fail). An edit to the lint setup (config, local rules, warning
      # baseline, tsconfig, dependencies) lints the whole project instead. The commit stage cannot
      # see a type-aware rule react to a type that changed in another file; the whole-project
      # run below does, at push. The id stays `frontend-eslint`: CI's SKIP lists name it, and
      # CI's frontend job lints the whole project.
      - id: frontend-eslint
        name: frontend eslint (changed files)
        entry: bash scripts/precommit-eslint.sh
        language: system
        files: ^ui/web/(.*\.(ts|tsx|js|mjs)|package(-lock)?\.json|tsconfig\.json|scripts/eslint-warning-baseline\.json)$

      # The whole-project ESLint run, aligned with frontend CI.
      - id: frontend-eslint-full
        name: frontend eslint (whole project)
        entry: bash scripts/prepush-guard.sh eslint -- bash -c 'cd ui/web && npm run lint'
        stages: [pre-push]
        verbose: true
        language: system
        files: ^ui/web/.*\.(ts|tsx|js|mjs)$
        pass_filenames: false

      # Full frontend unit suite belongs at push: measured ~23s locally.
      # CI independently runs vitest with coverage; keep the full local suite.
      # Decision: decisions/2026-09-24-vitest-prepush-selection.md.
      - id: frontend-vitest
        name: frontend vitest run
        entry: bash scripts/prepush-guard.sh vitest -- bash -c 'cd ui/web && npx --no-install vitest run'
        stages: [pre-push]
        verbose: true
        language: system
        files: ^ui/web/.*\.(ts|tsx)$
        pass_filenames: false

      # types-generated.ts + openapi.json must stay in sync with the Pydantic
      # schema. check-types-fresh.sh writes to temp + diffs (does not mutate
      # actual files, otherwise pre-commit's stash/restore would see mtime
      # changes and judge "files modified" as a failure).
      #
      # History: types.ts and the Pydantic models were maintained on separate
      # tracks by hand. Whenever frontend added a new field / backend renamed
      # one, both sides had to remember to change. Drift (the lifecycle source
      # incident, where timeline.tsx referenced non-existent kinds like
      # inbound_compact_prompt) went uncaught — switched to single-source codegen,
      # and now any schema change without running codegen turns this hook red.
      - id: types-codegen-fresh
        name: "types-generated.ts in sync with Pydantic schema (drift: run ./scripts/codegen-types.sh)"
        entry: ./scripts/check-types-fresh.sh
        language: system
        # base/agents/tasks/priority.py + base/agents/tasks/status.py carry the shared enums the
        # wire schemas reference, and ops/rpc_schemas/terminate.py defines the terminate
        # hint models — all three feed the generated spec, so they trigger the
        # freshness check like the other schema sources.
        # Include defining modules behind schema re-exports. The CI closure
        # test follows route annotations/imports so moves cannot escape here.
        # A package's own tests/ directory is never a schema source: the directory
        # sources below exclude it (`(?!(?:.*/)?tests/)`).
        files: ^(gateway/(?!(?:.*/)?tests/).*\.py$|base/agents/contract\.py$|base/api_contracts/(?!(?:.*/)?tests/).*\.py$|base/agents/tasks/priority\.py$|base/agents/tasks/status\.py$|base/agents/history/timeline\.py$|base/agents/observation/snapshot\.py$|base/host/resource_sample\.py$|ops/rpc_schemas/(?!(?:.*/)?tests/).*\.py$|ui/web/src/lib/types-generated\.ts$|ui/web/openapi\.json$|base/agents/observation/roster\.py$|base/agents/observation/evidence\.py$|base/agents/history/timeline_item\.py$|ops/cluster_status/__init__\.py$|base/agents/impersonation/history\.py$|base/agents/sdk/telemetry\.py$)
        pass_filenames: false
      - id: constants-codegen-fresh
        name: "constants-generated.ts in sync with base/events/live/projection.py (drift: run ./scripts/codegen/dump_frontend_constants.py)"
        entry: ./scripts/check-constants-fresh.sh
        language: system
        files: ^(base/events/live/projection\.py$|scripts/codegen/dump_frontend_constants\.py$|ui/web/src/lib/constants-generated\.ts$)
        pass_filenames: false

      # base/events/registry.md must stay in sync with the event contract
      # registry (base/events/contract.py EVENTS + live_events SSE roles) —
      # the doc is a generated artifact (R2-C): a new/renamed event or role
      # without regenerating turns this hook red.
      - id: events-registry-fresh
        name: "base/events/registry.md in sync with EVENTS registry (drift: run .venv/bin/python scripts/codegen/gen_event_registry.py)"
        entry: ./scripts/check-events-registry-fresh.sh
        language: system
        # The EVENTS shards feed the registry too: a spec added/edited in
        # base/events/registry*.py (e.g. registry_ops.py) must re-run the
        # freshness check locally, not only in the CI --all-files pass.
        # contract.py re-exports payload and lifecycle shards; CI verifies
        # the recursive source-module closure against this pattern.
        files: ^(base/events/contract\.py$|base/events/registry\.py$|base/events/registry_ops\.py$|base/events/system\.py$|base/events/live/projection\.py$|scripts/codegen/gen_event_registry\.py$|base/events/registry\.md$|base/events/payloads\.py$|base/events/registry_lifecycle\.py$)
        pass_filenames: false

      # base/host/env/config_lite_table.json must stay in sync with the config
      # registry — the boot-path field index is a generated artifact (#3621):
      # any config field change without regenerating turns this hook red.
      - id: config-lite-table-fresh
        name: "base/host/env/config_lite_table.json in sync with the config registry (drift: run .venv/bin/python scripts/codegen/gen_config_lite_table.py)"
        entry: .venv/bin/python scripts/codegen/gen_config_lite_table.py --check
        language: system
        # base/config/tests/ is not a config source, so it does not trigger the check.
        files: ^(base/host/env/config_registry\.py$|base/config/(?!(?:.*/)?tests/).*\.py$|scripts/codegen/gen_config_lite_table\.py$|base/host/env/config_lite_table\.json$)
        pass_filenames: false

      # The `executionEnvironments` entries that hold each package's tests/ directory to the
      # tests type-checking standard (pyproject.toml, between the GENERATED markers) come from
      # the tracked tests directories: adding, moving or removing one changes the expected
      # list. Any .py under a tests/ directory can do that; a delete-only change is not
      # selected here and is caught by the pre-push freshness family and CI. Deliberately not
      # named `*-fresh`: that suffix is the codegen family CI's structure job runs selectively
      # after installing Node. This check is pure Python, so CI's unconditional
      # `pre-commit run --all-files` (segment A) runs it on every change.
      - id: lint-pyright-test-environments
        name: "lint pyright tests environments (pyproject.toml matches the tests directories; drift: run .venv/bin/python scripts/codegen/gen_pyright_test_environments.py)"
        entry: .venv/bin/python scripts/codegen/gen_pyright_test_environments.py --check
        language: system
        files: ^(pyproject\.toml$|scripts/codegen/gen_pyright_test_environments\.py$|.+/tests/.*\.py$)
        pass_filenames: false

      # `git rebase` / `cherry-pick` / `merge` never invoke the pre-commit
      # hook for the commits they create, so a conflict-resolution commit
      # can reach `git push` having never been checked by a single
      # pre-commit-stage hook -- the range pre-commit's own push-time
      # selection uses is also not "everything new on this branch". This
      # re-runs the full pre-commit stage over merge-base(origin/main,
      # HEAD)..HEAD so every hook's normal files: filter still applies, just
      # against the correct range. Companion to
      # lint-prepush-artifact-freshness below for the separate delete-only
      # gap a range fix cannot close. See scripts/prepush-branch-lint.sh.
      - id: lint-prepush-branch-diff
        name: "lint prepush branch diff (re-run pre-commit stage over merge-base..HEAD)"
        entry: bash scripts/prepush-branch-lint.sh
        stages: [pre-push]
        verbose: true  # Successful skips must stay visible.
        language: system
        always_run: true
        pass_filenames: false

      # pre-commit's own diff selection passes a files:-filtered hook only
      # Added/Copied/Modified/Renamed paths -- never a Deleted one -- so a
      # change that only deletes the last file referencing an event or config
      # hook ever firing, on any range. The branch-diff run above executes every hook the
      # branch added to or changed; this one executes, over the whole repository, the
      # artifact hooks whose inputs the branch deleted and that run cannot cover (every
      # one when the range is unknown). The underlying hooks keep their normal filtered, pre-commit-stage-only
      # behavior, so `git commit` stays light. See scripts/provision/prepush_freshness.py.
      - id: lint-prepush-artifact-freshness
        name: "lint prepush artifact freshness (hooks whose inputs the branch deleted)"
        entry: .venv/bin/python scripts/provision/prepush_freshness.py
        stages: [pre-push]
        verbose: true  # Successful skips must stay visible.
        language: system
        always_run: true
        pass_filenames: false

  - repo: local
    hooks:
      - id: lint-ava-okf
        name: Lint Ava OKF documents
        entry: .venv/bin/python scripts/content_lint/lint_ava_okf.py
        language: system
        files: \.ava\.okf\.md$
