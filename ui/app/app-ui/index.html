<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ava</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0e0e12;
        --fg: #f4f4f5;
        --muted: #a1a1aa;
        --line: #2a2a33;
        --accent: #4f46e5;
        --danger: #f87171;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { width: 100%; max-width: 26rem; }
      h1 { margin: 0 0 6px; font-size: 1.35rem; }
      p { margin: 0 0 20px; color: var(--muted); }
      label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: var(--muted); }
      input[type="text"], input[type="password"] {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #16161c;
        color: var(--fg);
        font: inherit;
      }
      input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
      input.invalid { border-color: var(--danger); }
      button {
        width: 100%;
        margin-top: 14px;
        padding: 11px 12px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
      }
      button.secondary { background: transparent; color: var(--muted); font-weight: 400; }
      button:disabled { opacity: 0.55; }
      .secret-input { display: flex; gap: 8px; }
      .secret-input input { min-width: 0; }
      .secret-toggle {
        width: auto;
        flex: 0 0 auto;
        margin: 0;
        padding-inline: 12px;
        background: #24242c;
        font-weight: 400;
      }
      .error { color: var(--danger); font-size: 0.85rem; min-height: 1.2em; margin: 14px 0 0; }
      .hint { font-size: 0.8rem; color: var(--muted); margin: 6px 0 0; }
      .optional { color: var(--muted); font-weight: 400; }
      details { margin-top: 18px; border-top: 1px solid var(--line); }
      summary { padding-top: 14px; cursor: pointer; color: var(--muted); }
      details > div { padding-top: 14px; }
      .toggle {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 14px;
        color: var(--fg);
      }
      .toggle input { width: 18px; height: 18px; accent-color: var(--accent); }
      .spinner {
        width: 26px;
        height: 26px;
        margin-bottom: 16px;
        border: 3px solid var(--line);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      .steps { margin: 0 0 14px; padding-left: 1.4rem; color: var(--muted); text-align: left; }
      .steps li.active { color: var(--fg); }
      .countdown { font-variant-numeric: tabular-nums; }
      @keyframes spin { to { transform: rotate(360deg); } }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <section id="setup" hidden>
        <h1 data-i18n="connectTitle">Connect to Ava</h1>
        <p data-i18n="connectIntro">Enter the Ava server address; the secret is optional — with it you land already signed in</p>
        <form id="setup-form">
          <label for="server"><span data-i18n="serverLabel">Server address</span></label>
          <input
            id="server"
            name="server"
            type="text"
            inputmode="url"
            autocapitalize="none"
            autocorrect="off"
            spellcheck="false"
            placeholder="host or http://host:port" data-i18n-placeholder="serverPlaceholder" autocomplete="username"
            required
          />
          <div id="secret-field" style="margin-top: 14px">
            <label for="cluster-secret"><span data-i18n="secretLabel">Cluster secret</span> <span class="optional" data-i18n="optionalTag">(optional)</span></label>
            <div class="secret-input">
              <input
                id="cluster-secret"
                name="cluster-secret"
                type="password"
                autocomplete="current-password"
                autocapitalize="none"
                autocorrect="off"
                spellcheck="false"
              />
              <button type="button" class="secret-toggle" id="secret-visibility" aria-pressed="false" data-i18n="showLabel">Show</button>
            </div>
            <p class="hint" data-i18n="secretHint">Leave empty to sign in on the web login page after connecting</p>
          </div>
          <details id="advanced-options">
            <summary data-i18n="advancedTitle">Advanced options</summary>
            <div>
              <label for="gateway"><span data-i18n="gatewayLabel">Gateway address override</span> <span class="optional" data-i18n="optionalTag">(optional)</span></label>
              <input
                id="gateway"
                name="gateway"
                type="text"
                inputmode="url"
                autocapitalize="none"
                autocorrect="off"
                spellcheck="false"
                placeholder="Derived from the server address by default" data-i18n-placeholder="gatewayPlaceholder"
              />
              <label class="toggle">
                <input id="background-service" type="checkbox" />
                <span data-i18n="backgroundLabel">Run in background</span>
              </label>
              <label class="toggle">
                <input id="notifications" type="checkbox" />
                <span data-i18n="notificationsLabel">Notifications</span>
              </label>
            </div>
          </details>
          <p class="error" id="setup-error" aria-live="polite"></p>
          <button type="submit" id="setup-submit" data-i18n="connectButton">Connect</button>
          <button type="button" class="secondary" id="setup-cancel" hidden data-i18n="cancelButton">Cancel</button>
        </form>
      </section>

      <section id="connecting" hidden style="text-align: center">
        <div class="spinner" style="margin-inline: auto"></div>
        <h1 data-i18n="connectingTitle">Connecting…</h1>
        <p id="connecting-target"></p>
        <ol class="steps" id="connecting-steps">
          <li data-i18n="stepProbe">Probe the console</li>
          <li data-i18n="stepExchange">Exchange sessions</li>
          <li data-i18n="stepLoad">Load the UI</li>
        </ol>
        <p class="countdown" id="connecting-countdown"></p>
      </section>

      <section id="unreachable" hidden style="text-align: center">
        <h1 data-i18n="unreachableTitle">Connection failed</h1>
        <p id="unreachable-target"></p>
        <p id="unreachable-reason"></p>
        <button type="button" id="retry" data-i18n="retryButton">Retry</button>
        <button type="button" class="secondary" id="change-server" data-i18n="changeServerButton">Change address</button>
      </section>
    </main>

    <script src="locales/en.js"></script>
    <script src="locales/zh.js"></script>
    <script>
      const invoke = (cmd, args) => window.__TAURI_INTERNALS__.invoke(cmd, args);
      // Locale follows the webview language (the Android system locale is what
      // Android WebView reports through navigator.language). English strings are
      // the static HTML defaults; this table swaps every copy element when the
      // device runs a Chinese system locale.
      const I18N = window.AVA_APP_I18N || {};
      const LOCALE = (navigator.language || "en").toLowerCase().startsWith("zh") ? "zh" : "en";
      const t = (key) => (I18N[LOCALE] && I18N[LOCALE][key]) ?? I18N.en?.[key] ?? key;
      function applyI18n() {
        document.documentElement.lang = LOCALE === "zh" ? "zh-CN" : "en";
        for (const el of document.querySelectorAll("[data-i18n]")) {
          el.textContent = t(el.getAttribute("data-i18n"));
        }
        for (const el of document.querySelectorAll("[data-i18n-placeholder]")) {
          el.placeholder = t(el.getAttribute("data-i18n-placeholder"));
        }
      }
      const SAVE_TIMEOUT_MS = 30_000;
      const SAVE_RESPONSE_TIMEOUT_MS = 2_500;
      const CONNECTING_DEADLINE_MS = 30_000;
      const AUTH_ERROR_PREFIX = "AUTH_FAILED:";
      const failureKeys = {
        unreachable: "failureUnreachable",
        http: "failureHttp",
        auth: "failureAuth",
        "update-window": "failureUpdateWindow",
      };
      let connectingTimer = null;

      const show = (id) => {
        for (const section of document.querySelectorAll("main > section")) {
          section.hidden = section.id !== id;
        }
        if (id !== "connecting" && connectingTimer) {
          window.clearInterval(connectingTimer);
          connectingTimer = null;
        }
      };

      /** Rust selects bundled screens by fragment; setup is the safe fallback. */
      const screenFromHash = () => {
        const hash = window.location.hash.replace("#", "");
        return ["setup", "connecting", "unreachable"].includes(hash) ? hash : "setup";
      };

      const failureReason = () => new URLSearchParams(window.location.search).get("reason") || "unreachable";

      function renderFailure() {
        const reason = failureReason();
        document.getElementById("unreachable-reason").textContent = t(failureKeys[reason] || "failureUnreachable");
      }

      function beginConnecting(target) {
        document.getElementById("connecting-target").textContent = target;
        if (window.location.hash !== "#connecting") window.location.hash = "connecting";
        show("connecting");
        if (connectingTimer) window.clearInterval(connectingTimer);
        const deadline = Date.now() + CONNECTING_DEADLINE_MS;
        const steps = [...document.querySelectorAll("#connecting-steps li")];
        const update = () => {
          const seconds = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
          const activeStep = seconds > 20 ? 0 : seconds > 10 ? 1 : 2;
          steps.forEach((step, index) => step.classList.toggle("active", index === activeStep));
          document.getElementById("connecting-countdown").textContent = t("countdown").replace("{seconds}", String(seconds));
        };
        update();
        connectingTimer = window.setInterval(update, 1_000);
      }

      // Mirrors Rust normalize_entry_address: missing and gateway port 8000
      // become console port 3000; save rejects other custom ports first.
      function normalizedEntryUrl(raw) {
        const address = raw.trim();
        const withScheme = address.includes("://") ? address : `http://${address}`;
        const url = new URL(withScheme);
        if (!url.port || url.port === "8000") url.port = "3000";
        return url.toString();
      }

      function showSetupError(message, secretError = false) {
        const secret = document.getElementById("cluster-secret");
        secret.classList.toggle("invalid", secretError);
        document.getElementById("setup-error").textContent = message;
        if (window.location.hash !== "#setup") window.location.hash = "setup";
        show("setup");
      }

      async function render() {
        const config = await invoke("app_config");
        const target = config.entryUrl || "";
        const desktop = ["macos", "windows"].includes(config.platform);
        document.getElementById("connecting-target").textContent = target;
        document.getElementById("unreachable-target").textContent = target;
        document.getElementById("server").value = target;
        document.getElementById("gateway").value = config.gatewayUrl || "";
        document.getElementById("background-service").checked = config.backgroundService;
        document.getElementById("notifications").checked = config.notifications;
        document.getElementById("secret-field").hidden = desktop;
        document.getElementById("setup-cancel").hidden = !target;

        const screen = screenFromHash();
        if (screen === "connecting") {
          beginConnecting(target);
        } else if (screen === "unreachable") {
          renderFailure();
          show(screen);
        } else {
          show(screen);
        }
      }

      document.getElementById("secret-visibility").addEventListener("click", () => {
        const secret = document.getElementById("cluster-secret");
        const visible = secret.type === "password";
        secret.type = visible ? "text" : "password";
        const button = document.getElementById("secret-visibility");
        button.textContent = visible ? t("hideLabel") : t("showLabel");
        button.setAttribute("aria-pressed", String(visible));
      });

      document.getElementById("setup-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const submit = document.getElementById("setup-submit");
        const server = document.getElementById("server").value;
        const secret = document.getElementById("cluster-secret");
        const desktop = document.getElementById("secret-field").hidden;
        const patch = {
          entryUrl: server,
          gatewayUrl: document.getElementById("gateway").value,
          backgroundService: document.getElementById("background-service").checked,
          notifications: document.getElementById("notifications").checked,
        };
        if (!desktop) patch.clusterSecret = secret.value;

        secret.classList.remove("invalid");
        document.getElementById("setup-error").textContent = "";
        submit.disabled = true;
        beginConnecting(server);
        let settled = false;
        let timedOut = false;
        const timeout = window.setTimeout(() => {
          const recover = () => {
            if (settled && window.location.hash !== "#connecting") return;
            timedOut = true;
            submit.disabled = false;
            showSetupError(t("timeoutMessage"));
          };
          if (document.visibilityState === "visible") {
            recover();
            return;
          }
          const whenVisible = () => {
            if (document.visibilityState !== "visible") return;
            document.removeEventListener("visibilitychange", whenVisible);
            recover();
          };
          document.addEventListener("visibilitychange", whenVisible);
        }, SAVE_TIMEOUT_MS);
        try {
          // A secret races the native login probe's 10-second timeout; a missing
          // response still assumes the save completed and recovers a wedged pipe.
          const raceWindowMs = secret.value.trim() ? 12_000 : SAVE_RESPONSE_TIMEOUT_MS;
          let responseTimer;
          const outcome = await Promise.race([
            invoke("app_save_settings", { patch }).then(
              () => ({ kind: "fulfilled" }),
              (error) => ({ kind: "rejected", error }),
            ),
            new Promise((resolve) => {
              responseTimer = window.setTimeout(
                () => resolve({ kind: "timed-out" }),
                raceWindowMs,
              );
            }),
          ]);
          window.clearTimeout(responseTimer);
          settled = true;
          if (outcome.kind === "rejected") {
            window.clearTimeout(timeout);
            if (timedOut) return;
            const message = String(outcome.error);
            const authFailed = message.startsWith(AUTH_ERROR_PREFIX);
            showSetupError(authFailed ? t("failureAuth") : message, authFailed);
            submit.disabled = false;
            return;
          }
          if (timedOut) return;
          if (outcome.kind === "fulfilled") window.clearTimeout(timeout);
          // Android can lose the native post-save pipe after persistence finishes.
          // This page owns navigation, so it does not depend on that pipe.
          window.location.replace(normalizedEntryUrl(server));
        } catch (err) {
          settled = true;
          window.clearTimeout(timeout);
          if (timedOut) return;
          const message = String(err);
          const authFailed = message.startsWith(AUTH_ERROR_PREFIX);
          showSetupError(authFailed ? t("failureAuth") : message, authFailed);
          submit.disabled = false;
        }
      });

      document.getElementById("retry").addEventListener("click", () => {
        beginConnecting(document.getElementById("server").value);
        invoke("app_retry_entry");
      });
      document
        .getElementById("setup-cancel")
        .addEventListener("click", () => invoke("app_retry_entry"));
      document.getElementById("change-server").addEventListener("click", () => {
        window.location.hash = "setup";
        show("setup");
      });

      window.addEventListener("hashchange", () => {
        const screen = screenFromHash();
        if (screen === "connecting") {
          beginConnecting(document.getElementById("connecting-target").textContent);
        } else if (screen === "unreachable") {
          renderFailure();
          show(screen);
        } else {
          show(screen);
        }
      });
      applyI18n();
      render();
    </script>
  </body>
</html>
