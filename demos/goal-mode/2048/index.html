<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <header class="top">
      <h1 class="title">2048</h1>
      <div class="scores">
        <div class="score-box">
          <div class="score-label">Score</div>
          <div class="score-value" id="score">0</div>
        </div>
        <div class="score-box">
          <div class="score-label">Best</div>
          <div class="score-value" id="best">0</div>
        </div>
      </div>
      <button class="btn" id="restart">Restart</button>
    </header>

    <div class="board-wrap">
      <div class="board" id="board" aria-label="2048 game board"></div>
      <div class="overlay hidden" id="overlay">
        <div class="overlay-title" id="overlay-title"></div>
        <div class="overlay-actions" id="overlay-actions"></div>
      </div>
    </div>

    <p class="hint">Arrow keys / WASD / swipe to move tiles</p>
  </main>
  <script src="game.js"></script>
</body>
</html>
