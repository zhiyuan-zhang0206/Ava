[uses]
".agents" = ["base"]
"agent" = ["ava", "base", "tests"]
"ava" = ["agent", "base", "tests"]
"ava_builtins" = ["agent", "ava", "base", "ops", "services", "tests"]
"base" = ["tests"]
"cli" = ["agent", "ava", "ava_builtins", "base", "ops", "scripts", "services", "tests"]
"conftest.py" = ["tests"]
"demos" = ["agent", "base"]
"gateway" = ["agent", "ava", "ava_builtins", "base", "cli", "ops", "services", "tests"]
"ops" = ["agent", "ava", "base", "tests"]
"schedules" = ["ava", "base", "scripts", "services", "tests"]
"scripts" = ["agent", "ava", "base", "cli", "gateway", "meizel", "ops", "services", "tests"]
"services" = ["ava", "base", "ops", "tests"]
"services/agent_runner/agent_host" = ["agent/db/__init__.py", "agent/graph/__init__.py", "agent/graph/_init_context.py", "agent/graph/claim/node.py", "agent/graph/claim/tests", "agent/graph/exec/_child_boundary.py", "agent/graph/exec/_process.py", "agent/graph/exec/_result.py", "agent/graph/exec/_subprocess.py", "agent/graph/hooks/compact.py", "agent/graph/interrupt.py", "agent/graph/llm/node.py", "agent/graph/llm_errors.py", "agent/graph/node_log.py", "agent/graph/tests/cancel_fixture.py", "agent/graph/tests/test_llm_helpers.py", "agent/hooks/compact_anchor.py", "agent/impersonation.py", "agent/impersonation_handoff.py", "agent/impersonation_process.py", "agent/llm/__init__.py", "agent/messages/guard.py", "agent/nodes.py", "agent/ownership/corpse_reap.py", "agent/ownership/hosted.py", "agent/ownership/hosted_completion.py", "agent/ownership/inbound.py", "agent/ownership/lifecycle_intent.py", "agent/ownership/native_cancel.py", "agent/ownership/tests/test_lifecycle_intent.py", "agent/process_boot.py", "agent/startup/__init__.py", "agent/state.py", "agent/tests/claim/test_inbound_ownership.py", "agent/turn/runloop.py", "agent/turn/trace_checkpoint.py"]
"tests" = [".agents", "agent", "ava", "ava_builtins", "base", "cli", "gateway", "meizel", "ops", "schedules", "scripts", "services", "ui"]
[roles]
# The shipped packages: the wheel, the framework scans.
application = ["agent", "ava", "ava_builtins", "base", "cli", "gateway", "ops", "services"]
# Version-controlled runnable templates: Python that ships as files, not as packages.
templates = ["schedules"]
# Illustrative sources that are tracked but not shipped and not governed like the application.
examples = ["demos"]
# The repository's own tooling.
tooling = ["meizel", "scripts"]
tests = ["tests"]
# The user interface; its Python is a build helper.
frontend = ["ui"]

