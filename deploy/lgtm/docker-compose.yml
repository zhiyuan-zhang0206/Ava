# deploy/lgtm/docker-compose.yml — container half of the observability backend.
# Tempo and Grafana remain containers; converge installs the pinned native
# Loki, Prometheus, and Promtail backends as launchd jobs before this compose
# project is brought up. The marker-host watchdog re-runs start.sh after a
# connection-level readiness failure; it probes native jobs first and never
# restarts an already-live backend.
#
# Role: required serving infrastructure while the gateway serves /ops and the
# inspect endpoints. The native per-machine collector on host 4318 is the OTLP
# entry and fans out to these loopback backends.
#
# Operations:
#   bash start.sh   # native launchd backends + Tempo/Grafana compose services
#   bash stop.sh    # stop all backends; volumes persist
#   rollback: stop, restore the prior compose + backend configs from git, then
#             docker compose up -d (the rollback volumes remain on disk)
#   docker compose down -v   # permanently wipe observability history
#
# Ports (host):
#   3003  Grafana UI (container; anonymous read-only viewer)
#   3100  Loki API (native launchd backend)
#   3200  Tempo query API (container)
#   14318 Tempo OTLP/HTTP intake (container)
#   9090  Prometheus API and OTLP receiver (native launchd backend)
#
# Resource posture: native limits are GOMEMLIMIT=2GiB (Loki), 1GiB
# (Prometheus), and 256MiB (Promtail). Tempo has a 1-core/768MiB container
# capsule; Grafana has a 2-core/2GiB capsule. Native backend ports are pinned
# to loopback in their templates; Grafana keeps the wider bind for remote,
# anonymous-but-read-only viewing.
services:
  tempo:
    image: grafana/tempo:3.0.2
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./config/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"
      # OTLP/HTTP intake for the native sidecar's traces pipeline + `ava trace
      # ship` replay. Non-standard host port: 4318 belongs to the sidecar.
      - "127.0.0.1:14318:4318"
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 768m
    memswap_limit: 768m

  grafana:
    image: grafana/grafana:13.1.3
    env_file:
      # Shared with the future native launcher; behavior must not live only in
      # the container transport.
      - ./config/grafana/runtime.env
    environment:
      GF_SERVER_HTTP_PORT: "3000"
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-http://localhost:3003}"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      # Grafana 13 needs serve_from_sub_path for the /grafana/* proxy
      # prefix (the ops/metrics iframes reach 3003 through it).
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_PATHS_PROVISIONING: "/etc/grafana/provisioning"
      # No phone-home in the reference deployment.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Alerting webhook token (contact.yml $__env expansion). Value comes
      # from deploy/lgtm/.env (gitignored) — never commit it.
      OPS_ALERTS_WEBHOOK_TOKEN: "${OPS_ALERTS_WEBHOOK_TOKEN:-}"
      # Read-only Postgres password for the grafana_ro datasource role
      # (datasources.yml $GRAFANA_PG_PASSWORD). From .env (gitignored).
      GRAFANA_PG_PASSWORD: "${GRAFANA_PG_PASSWORD:-}"
      GRAFANA_PROVISIONING_PATH: "/etc/grafana/provisioning/dashboards"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3003:3000"
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 2g
    memswap_limit: 2g

volumes:
  tempo-data:
  loki-data:
  prom-data:
  grafana-data:
  promtail-positions:
