# deploy/lgtm/docker-compose.yml — the cluster's observability backend
# (Tempo + Loki + Prometheus + Grafana, the LGTM stack), hosted on the
# designated LGTM host ($AVA_HOME/lgtm-host marker — see README.md).
#
# Role: REQUIRED serving infrastructure while the gateway serves /ops and the
# inspect endpoints — not a disposable viewer. Live consumers:
#   - gateway Loki/Prometheus read paths (gateway/loki_events.py,
#     gateway/prom_metrics.py — event history + telemetry aggregates)
#   - ops alerting: Grafana's embedded Alertmanager evaluates the provisioned
#     rules and fires the gateway webhook (gateway/routers/alerts.py)
#   - the events-maintenance rollup aggregates from Loki
#   - `ava cluster health` audits crash loops from the Loki event stream
#     (cli/commands/_cluster_health.py)
# Producers are untouched — nothing here writes to ~/.ava/traces, the events
# table, or any main-flow service. The OTLP entry is the NATIVE per-machine
# sidecar (ava-otel-collector session, task #1266) on host 4318 (OTLP/HTTP) —
# this stack only hosts the backends it fans out to.
#
# Lifecycle: converge (`ava start` / `ava cluster update` on the marker host)
# runs start.sh idempotently; the gateway watchdog probes the four readiness
# endpoints every 60s (services/healthchecks/lgtm.py) and re-runs start.sh on
# connection failure; `ava status` shows the stack on the marker host.
#
# Operations (manual, still available):
#   bash start.sh   # docker compose up -d, wait for health, print URL
#   bash stop.sh    # docker compose down (data volumes persist)
#   docker compose down -v   # WIPE data (traces/logs/metrics history)
#
# Ports (host):
#   3003  Grafana loopback upstream (gateway /grafana is the only UI entry)
#   3100  Loki API (+ OTLP /otlp/v1/logs, sidecar logs fan-out)
#   3200  Tempo query API (Grafana datasource target)
#   14318 Tempo OTLP/HTTP intake (sidecar traces fan-out + `ava trace ship` replay)
#   9090  Prometheus API (+ OTLP receiver /api/v1/otlp, sidecar metrics fan-out)
#
# Images are pinned to exact versions for reproducibility. restart:
# unless-stopped restores containers (crashed, OOM-killed, or daemon-restarted
# after a reboot) — the native sidecar's file-backed queue + promtail
# positions make restarts lossless — while a deliberate stop.sh still sticks
# (compose down removes the containers). On macOS the policy only fires once
# OrbStack launches at login — the watchdog healthcheck
# (services/healthchecks/lgtm.py) is the real restore mechanism; the restart
# policy is a complement.
#
# Resource budget: every service carries cpus/mem_limit (+ memswap_limit ==
# mem_limit so a capped container cannot silently take 2x in swap). Total
# ceiling ~5.5 cores / ~4GB on a 10-core/16GB box shared with the production
# cluster (Postgres, Redis, gateway, agents) — an unbounded Loki took 4+
# cores during the 2026-08-18 query-storm incident. Caps apply on container
# RECREATE: after updating, run `docker compose up -d` (a plain restart does
# not re-apply resource limits).
#
# Bind address: every backend port is unconditionally loopback-only. Remote
# sidecars and `ava trace ship` enter through the native collector's
# bearer-authenticated receiver on AVA_MACHINE_HOST:4318. Browser reads enter
# only through the authenticated gateway /grafana proxy; Grafana trusts the
# fixed Viewer identity header that gateway injects after Ava authentication.
services:
  # No otel-collector container: since task #1266 the OTLP entry is the
  # NATIVE collector sidecar (ava-otel-collector session, supervised by the
  # watchdog) on the gateway. It accepts local OTLP on loopback and authenticated
  # runner relays on AVA_MACHINE_HOST, then fans out to these loopback backends.
  tempo:
    image: grafana/tempo:3.0.2
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./config/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"
      # OTLP/HTTP intake for the native sidecar's traces pipeline + `ava trace
      # ship` replay. Non-standard host port: 4318 belongs to the sidecar.
      - "127.0.0.1:14318:4318"
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 768m
    memswap_limit: 768m

  loki:
    image: grafana/loki:3.7.6
    command: ["-config.file=/etc/loki.yaml"]
    volumes:
      - ./config/loki.yaml:/etc/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    restart: unless-stopped
    # 2g while the task #1281 archive stream (365d retention_stream) is
    # queryable; tighten to 1g when the archive-era loki.yaml settings go.
    cpus: 2.0
    mem_limit: 2g
    memswap_limit: 2g

  promtail:
    image: grafana/promtail:3.6.0
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./config/promtail.yml:/etc/promtail/config.yml:ro
      # Session stdout ($AVA_HOME/logs), read-only. Defaults to the
      # operator's ~/.ava/logs; other homes override via the environment:
      # AVA_LOGS_DIR=/path/to/logs bash start.sh
      - ${AVA_LOGS_DIR:-~/.ava/logs}:/var/log/ava:ro
      - promtail-positions:/tmp
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 256m
    memswap_limit: 256m

  prometheus:
    image: prom/prometheus:v3.13.2
    # Retention is explicit: 90d aligns with the telemetry category window
    # (Loki's 7d covers the live tail; Prometheus carries the windowed
    # series). Both bounds apply independently — blocks are dropped when
    # EITHER is exceeded, so the size cap bounds disk within the 90d.
    command:
      [
        "--config.file=/etc/prometheus/prometheus.yml",
        "--storage.tsdb.path=/prometheus",
        "--storage.tsdb.retention.time=90d",
        "--storage.tsdb.retention.size=8GB",
        "--web.enable-otlp-receiver",
      ]
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1g
    memswap_limit: 1g

  grafana:
    image: grafana/grafana:13.1.3
    environment:
      GF_SERVER_HTTP_PORT: "3000"
      # Lifecycle derives this from AVA_GATEWAY_URL + /grafana/. No :3003
      # public fallback: the loopback host port is not a browser entry point.
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:?gateway-derived GRAFANA_ROOT_URL is required}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: "X-Ava-Grafana-User"
      GF_AUTH_PROXY_HEADER_PROPERTY: "username"
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_PROXY_SYNC_TTL: "0"
      GF_AUTH_PROXY_HEADERS: "Role:X-Ava-Grafana-Role"
      # A Grafana cookie would outlive Ava's auth decision. The gateway sends
      # the fixed proxy identity on every request and strips Set-Cookie.
      GF_AUTH_PROXY_ENABLE_LOGIN_TOKEN: "false"
      GF_USERS_AUTO_ASSIGN_ORG: "true"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: "Viewer"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_BASIC_ENABLED: "false"
      # Keep Grafana's internal login service enabled: auth-proxy auto-signup
      # uses its Grafana proxy client. The browser login surfaces are still
      # closed by basic=false + disable_login_form=true below.
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_DISABLE_SIGNOUT_MENU: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      # Grafana 13 needs serve_from_sub_path for the /grafana/* proxy
      # prefix (the ops/metrics iframes reach 3003 through it).
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_PATHS_PROVISIONING: "/etc/grafana/provisioning"
      # No phone-home in the reference deployment.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Alerting webhook token (contact.yml $__env expansion). Value comes
      # from deploy/lgtm/.env (gitignored) — never commit it.
      OPS_ALERTS_WEBHOOK_TOKEN: "${OPS_ALERTS_WEBHOOK_TOKEN:-}"
      # Read-only Postgres password for the grafana_ro datasource role
      # (datasources.yml $GRAFANA_PG_PASSWORD). From .env (gitignored).
      GRAFANA_PG_PASSWORD: "${GRAFANA_PG_PASSWORD:-}"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3003:3000"
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 512m
    memswap_limit: 512m

volumes:
  tempo-data:
  loki-data:
  prom-data:
  grafana-data:
  promtail-positions:
