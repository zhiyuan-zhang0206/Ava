[server]
http_port = 3003
serve_from_sub_path = true
root_url = $__env{GRAFANA_ROOT_URL}

[paths]
data = {{AVA_HOME}}/lgtm/native/grafana/data
logs = {{AVA_HOME}}/lgtm/native/logs
provisioning = {{AVA_PROVISIONING_PATH}}

[security]
admin_user = admin
admin_password = $__env{GRAFANA_ADMIN_PASSWORD}
allow_embedding = true
disable_gravatar = true

[auth.anonymous]
enabled = true
org_role = Viewer

[users]
viewers_can_edit = true

[database]
query_retries = 5

[live]
max_connections = 0

[analytics]
reporting_enabled = false
check_for_updates = false
