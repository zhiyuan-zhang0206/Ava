[server]
http_port = {{LGTM_GRAFANA_PORT}}
# Listen host comes from the AVA_LGTM_GRAFANA_LISTEN_HOST setting; the 0.0.0.0
# default is the historical all-interfaces bind (Grafana's own default).
http_addr = {{lgtm_grafana_listen_host}}
serve_from_sub_path = true
root_url = $__env{GRAFANA_ROOT_URL}

[paths]
data = {{AVA_HOME}}/lgtm/native/grafana/data
logs = {{AVA_HOME}}/lgtm/native/logs
provisioning = {{AVA_PROVISIONING_PATH}}

[security]
admin_user = admin
admin_password = $__env{GRAFANA_ADMIN_PASSWORD}
allow_embedding = true
disable_gravatar = true

[auth.anonymous]
enabled = true
org_role = Viewer

[users]
viewers_can_edit = true

[database]
query_retries = 5

[live]
max_connections = 0

[plugins]
# The native deployment needs no preinstalled plugins: every datasource and
# dashboard panel it ships is a Grafana-core one. Grafana 13's background
# installer installs the distribution's default plugins (lokiexplore-app,
# pyroscope-app, exploretraces-app, elasticsearch, zipkin, ...) on first start
# and auto-updates them on later starts; that optional background work can
# still be in flight when SIGTERM arrives and keep the process past the unit's
# shutdown deadline — with SendSIGKILL=no, the leftover process then blocks the
# next start (2026-09-10 #2048). Disabling the preinstall feature removes that
# work entirely. If a plugin ever becomes required, provision it deliberately
# at converge time instead of re-enabling background installation.
preinstall_disabled = true

[analytics]
reporting_enabled = false
check_for_updates = false
