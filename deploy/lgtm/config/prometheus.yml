# Prometheus — scrapes only the viewer's own components (zero impact on the
# main flow). Ava's own series arrive by OTLP push
# (--web.enable-otlp-receiver in the compose command); retention is set there
# too (180h time / 8GB size).
#
# There is no node_exporter here and there will not be one: host metrics
# (issue #46) arrive on the same OTLP push, scraped by each machine's own OTel
# Collector sidecar (`host_metrics` receiver, plus `postgresql` + `redis` on a
# gateway unit). One already-pinned binary per machine instead of three more,
# and the same path for a remote runner that this Prometheus cannot scrape.
# Those series land under `job="ava-infra"` with `host` (OS hostname / physical
# identity) and `machine_name` (Ava roster identity); consumers group by the
# latter.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Companion setting for the OTLP receiver: pushed samples can arrive out of
# order when a machine's collector replays its frozen queue after a link outage
# or sleep, keeping event timestamps (oldest first). A window that is too small
# rejects those replays as "too old sample"; the OTLP write path fails the whole
# batch (HTTP 400), rolling back fresh samples batched alongside them.
# Task #4650: 43 batches / 27,154 points dropped 2026-09-20..23; worst
# observed lateness ~2h15m. 6h keeps ~2.7x margin over that case. The window
# is bounded because late samples stay in the TSDB head (memory). Episodes
# beyond it surface through `ava-ops-prom-too-old-samples`.
# Rationale and acceptance runbook: deploy/lgtm/README.md.
storage:
  tsdb:
    out_of_order_time_window: 6h

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
  - job_name: grafana
    # Grafana serves from /grafana (GF_SERVER_SERVE_FROM_SUB_PATH); scraping
    # /metrics would 301-redirect into the gateway auth wall (task #3316).
    metrics_path: /grafana/metrics
    static_configs:
      - targets: ["grafana:3000"]
