apiVersion: 1
datasources:
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    # Env-overridable: the WSL remote Tempo (100.78.137.46:3200) is the
    # cluster's trace backend (d+WSL remote-on-demand); the in-compose
    # container address remains the default until the native cutover lands.
    url: ${GRAFANA_TEMPO_URL:-http://tempo:3200}
    isDefault: true
    jsonData:
      httpMethod: GET

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    # Native Loki runs on the host loopback. The Grafana container reaches it
    # through host.docker.internal (verified with OrbStack on 2026-08-23), the
    # same transport used by the Postgres datasource. Override when needed.
    url: ${GRAFANA_LOKI_URL:-http://host.docker.internal:3100}

  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    # Native Prometheus follows the same host-loopback transport as Loki.
    url: ${GRAFANA_PROM_URL:-http://host.docker.internal:9090}

  # Read-only Postgres — the remaining SQL panels (core_live_agents reads the
  # live agents_meta table; the plugin panels query the retired events table,
  # which returns no rows). Task #1280 decision (405 2026-08-14): agents_meta
  # is the authoritative live source, so the panel stays SQL instead of an
  # event-stream approximation. The role is grafana_ro — a dedicated read-only
  # role (SELECT on agents_meta/events only, no writes), password injected via
  # the container env ($GRAFANA_PG_PASSWORD from deploy/lgtm/.env,
  # gitignored — never in this repo).
  - name: Postgres (ava read-only)
    uid: ops
    type: postgres
    access: proxy
    url: host.docker.internal:5433
    user: grafana_ro
    secureJsonData:
      password: $GRAFANA_PG_PASSWORD
    jsonData:
      database: ava_main
      sslmode: disable
      postgresVersion: 1700
