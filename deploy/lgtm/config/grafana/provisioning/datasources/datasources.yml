apiVersion: 1
# Grafana datasources. URLs use Grafana's native $__env{} expansion (the Tempo
# precedent): the process env supplies the values, so this checkout file is
# ALWAYS a valid configuration — compose (static env defaults) and native
# (converge-rendered runtime.env) load the same file with the same mechanism.
# AVA_OBSERVABILITY_URL empty (default) → loopback backends (current behavior);
# non-empty → the remote observatory station's URLs (converge bakes the derived
# values into the native runtime.env).
datasources:
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    # Query URL is rendered into native Grafana from the host-scoped setting.
    url: $__env{AVA_TELEMETRY_TEMPO_QUERY_URL}
    # Explore should open the event stream, not the trace backend.
    isDefault: false
    jsonData:
      httpMethod: GET

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: $__env{AVA_TELEMETRY_LOKI_URL}

  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: $__env{AVA_TELEMETRY_PROMETHEUS_URL}

  # Read-only Postgres — the remaining SQL panels (core_live_agents reads the
  # live agents_meta table; the plugin panels query the retired events table,
  # which returns no rows). Task #1280 decision (405 2026-08-14): agents_meta
  # is the authoritative live source, so the panel stays SQL instead of an
  # event-stream approximation. The role is grafana_ro — a dedicated read-only
  # role (SELECT on agents_meta/events only, no writes), password injected via
  # the container env ($GRAFANA_PG_PASSWORD from deploy/lgtm/.env,
  # gitignored — never in this repo).
  #
  # ⚠️ PG is the most typical bomb in observatory cutovers (#3606): it is the
  # CLUSTER's OWN database (grafana_ro/ava_main), not an observatory service.
  # When AVA_OBSERVABILITY_URL is set, this URL follows the switch and the
  # operator MUST ensure the target host's :5433 serves this cluster's
  # ava_main with the grafana_ro role — otherwise the SQL panels break.
  - name: Postgres (ava read-only)
    uid: ops
    type: postgres
    access: proxy
    url: $__env{AVA_PG_URL}
    user: grafana_ro
    secureJsonData:
      password: $GRAFANA_PG_PASSWORD
    jsonData:
      database: ava_main
      sslmode: disable
      postgresVersion: 1700
