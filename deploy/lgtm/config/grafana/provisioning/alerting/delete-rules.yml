# config file version
apiVersion: 1

# Alert rule UIDs retired from rules.yml that must be deleted from running
# instances (see README "Retired rules"). Grafana never deletes a provisioned
# rule that disappears from its files; without a tombstone it stays orphaned
# and keeps evaluating. Deletion is idempotent, so entries stay here.
deleteRules:
  - orgId: 1
    uid: meiva-ops-pitr-storage-growth
  - orgId: 1
    uid: meiva-ops-agent-restart-spike
  - orgId: 1
    uid: meiva-ops-hosted-boot-recovery-deferred

