# Ava alerts — webhook contact point (as code, Task #1224).
#
# The webhook URL uses Grafana's native $__env{} expansion (same mechanism as
# the datasources) — the value comes from the process env, which compose
# supplies as a static loopback default and native converge renders two-state
# on AVA_OBSERVABILITY_URL:
#   - empty (default) -> http://127.0.0.1:8000/api/alerts — native Grafana on
#     the same host reaches the gateway on loopback (byte-identical default).
#   - non-empty -> http://<gateway reachable host>:8000/api/alerts — a remote
#     observatory Grafana must dial the GATEWAY's own reachable address
#     (base.cluster.machine.reachable_host), NOT the observatory base URL: the
#     ingest endpoint lives on this cluster's gateway. Self-dialing a
#     tailnet IP from the gateway host itself can hit VPN hairpin filtering
#     (pgbouncer probe incident), which is why the loopback form is kept when
#     no remote observatory is configured. Topology assumption: the non-empty
#     form presumes a remote observatory Grafana consumes the rendered
#     contact.yml (delivery mechanism lands with the observatory deployment,
#     stage B); with a local Grafana consumer, keep AVA_OBSERVABILITY_URL
#     empty until that mechanism exists.
#
# Routes every fired alert to the gateway's alert ingest endpoint
# (POST /api/alerts), which stores the instance in `alerts` (Alertmanager
# webhook shape), publishes it on the SSE stream, and fans IM notifications
# out via the im_bridge daemon (Telegram / WeChat / Feishu — whichever
# channels the user has connected). Alert is fully separate from Notice —
# nothing here enters the notices queue.
#
# Auth (Grafana 13.1.3 quirks, verified 2026-08-14 by #3012):
# - The webhook token rides as `Authorization: Bearer <cluster secret>` via
#   the notifier's native authorization_scheme/authorization_credentials
#   fields — NOT a custom header.
# - DO NOT put credentials under `secureSettings:` in this file: the
#   provisioning import silently DROPS secureSettings (Grafana 13.1.3 bug —
#   the value never reaches the wire, gateway answers 401).
# - Instead put `authorization_credentials` in `settings:` with a $__env{}
#   reference: provisioning expands it, and the schema layer migrates the
#   value into encrypted secureSettings in the DB, which the notifier DOES
#   read (verified end-to-end: header on the wire, gateway 200).
# - The value comes from the container env (AVA_ALERTS_WEBHOOK_TOKEN,
#   injected via docker-compose from deploy/lgtm/.env — gitignored).
#   It must match the gateway's webhook token (AVA_ALERTS_WEBHOOK_TOKEN);
#   the gateway accepts it both as X-Alerts-Token and as a Bearer
#   credential (the only form the Grafana-13 notifier can send without
#   plaintext storage).
#
# A second, direct contact point exists for the one outage the webhook cannot
# report: the gateway itself being down. Grafana's native Telegram notifier posts
# to the Bot API with the bot token and owner chat id converge renders from the
# telegram settings (AVA_ALERTS_TELEGRAM_BOT_TOKEN / AVA_ALERTS_TELEGRAM_CHAT_ID;
# inert placeholders when the home has no bot). Only `attributes_check="gateway_liveness"`
# alerts and the health probe's dead-man rule (`metric="health_probe_silent"`) are
# routed to it, in addition to the webhook.
#
# disableResolveMessage: false — resolution webhooks ARE wanted: the ingest
# flips the row to resolved and sends the recovery IM line.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: ava-alerts-webhook
    receivers:
      - uid: ava-alerts-webhook
        type: webhook
        disableResolveMessage: false
        settings:
          url: $__env{AVA_ALERTS_WEBHOOK_URL}
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: $__env{AVA_ALERTS_WEBHOOK_TOKEN}
  - orgId: 1
    name: ava-alerts-telegram
    receivers:
      - uid: ava-alerts-telegram
        type: telegram
        disableResolveMessage: false
        settings:
          bottoken: $__env{AVA_ALERTS_TELEGRAM_BOT_TOKEN}
          chatid: $__env{AVA_ALERTS_TELEGRAM_CHAT_ID}

# The notification policy is the one place alert merging and repetition are
# decided — no code in Ava dedups, throttles or grades a notification.
#
# - group_by [alertname]: every instance of one rule (one per machine / vendor /
#   drill ...) rides one webhook POST, so a burst across a fleet is one batch to
#   the ingest instead of one POST per instance. The ingest still stores one row
#   per (fingerprint, starts_at) and sends one IM per instance; grouping bounds
#   the POST rate, the rule's `for:` bounds how soon a condition counts.
# - group_wait 30s: the first firing of a group waits half a minute so
#   instances of the same burst join it. group_interval 5m: instances that join
#   an already-notified group, and the resolution of a group, are announced at
#   most every five minutes. repeat_interval 4h: an unchanged firing group is
#   re-sent every four hours, which only refreshes the stored rows — the ingest
#   sends no second IM for an instance it already announced.
# - critical alerts are time-critical (out-of-credit key, a disk at the WAL hard
#   stop): they skip the batching wait and refresh hourly.
# - Deploy windows are not a policy concern: `python -m cli.fleet_update` creates
#   one Grafana silence over every rule when `down` starts and expires it when
#   `up` completes (cli/commands/observability/alert_silence.py).
policies:
  - orgId: 1
    receiver: ava-alerts-webhook
    group_by: [alertname]
    matchers: []
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: ava-alerts-telegram
        object_matchers:
          - [attributes_check, "=", gateway_liveness]
        continue: true
        group_by: [alertname]
        group_wait: 0s
        group_interval: 5m
        repeat_interval: 4h
      # The probe going silent usually travels with a gateway problem, so its dead-man
      # rule gets the same direct route.
      - receiver: ava-alerts-telegram
        object_matchers:
          - [metric, "=", health_probe_silent]
        continue: true
        group_by: [alertname]
        group_wait: 0s
        group_interval: 5m
        repeat_interval: 4h
      - receiver: ava-alerts-webhook
        object_matchers:
          - [severity, "=", critical]
        group_by: [alertname]
        group_wait: 0s
        group_interval: 1m
        repeat_interval: 1h
      # The root receiver only serves alerts no child route matched, and the
      # Telegram route above continues, so every other alert needs its own
      # explicit route to the webhook.
      - receiver: ava-alerts-webhook
        object_matchers:
          - [alertname, "=~", ".+"]
        group_by: [alertname]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
