# Ava ops alert rules — Grafana Alerting, provisioned as code.
#
# Source of truth: this file. Native Grafana (port 3003, launchd label
# `com.ava.grafana.<home-slug>` rendered by converge; 3002 is retired) reads
# it directly from this checkout's provisioning directory — no copy step.
# Alert-rule provisioning does NOT hot-reload file changes (verified
# 2026-08-04): restart with `launchctl kickstart -k
# gui/$(id -u)/com.ava.grafana.<home-slug>` (first `launchctl bootstrap
# gui/$(id -u) <plist>` when the job is not loaded).
#
# Evaluation engine: Grafana Unified Alerting over the LGTM read side
# (Task #1224): rules R1-R3, R5-R7 and R13 query Loki (the events stream — every
# event is one OTLP log line under {service_name="unknown_service"} with
# event_name/agent_id promoted to stream labels since 2026-08-23; body =
# the full event JSON, so `| json` flattens it to labels), and R4 plus the
# infrastructure/delivery rules R8-R12 and R14-R16 query Prometheus. Datasources are provisioned
# beside this file in datasources.yml (uids `loki` / `prometheus`). The
# retired Postgres events read path (#1197) is gone — nothing queries `ops`
# from these rules.
#
# Two Prometheus families, two label conventions:
# - APPLICATION metrics (R4 and the gateway-heartbeat silence rule) come from
#   the event emitter's OTLP mirror and carry `machine` / `agent_id` datapoint
#   attributes.
# - INFRASTRUCTURE metrics (R8-R12, R14-R16, issue #46) come from each
#   machine's OTel Collector sidecar (host/data-plane receivers plus its own
#   queue/drop/uptime scrape) and live under `job="ava-infra"` with both
#   `host` = the OS hostname (physical identity) and `machine_name` = the Ava
#   roster identity baked from the unit at converge. Per the 2026-08-24 user
#   ruling, rules group by `machine_name`, so win and wsl remain separate
#   series; each label keeps one meaning. Names below were read off a live
#   Prometheus 3.13.2, not inferred from the OTLP names.
#
# R8-R11 wrap their ratio in PromQL `round(..., 0.001)`: the value is
# interpolated into the summary line that reaches IM, and "0.927" is a number a
# human reads where "0.927223987411" is not. It cannot change a verdict — the
# thresholds are two decimals wide.
#
# The infrastructure thresholds are DEPLOYMENT FACTS, not framework constants: what
# counts as "too much CPU" depends on box specs and co-tenancy (a PyTorch job
# legitimately saturates a machine). They live here, as rule config an
# operator edits, and the response to a firing instance is the
# cluster-operator agent's judgment — see conventions/runbook.md, "The
# operator's SRE loop".
#
# Index-label selectors (task #1467): since the 2026-08-23 cutover
# (shared/loki_index_labels.py, INDEX_LABEL_CUTOVER_AT) the collector promotes
# event_name/agent_id to stream labels, so event-scoped rules match them
# inside the stream selector (`{service_name="unknown_service", event_name=...}`)
# and keep `| json` only for the level/category/attributes filters (those
# fields are NOT stream labels). Legacy chunks without the index labels
# expired at LEGACY_READ_EXPIRES_AT (2026-08-30T11:10Z); promoting the filters
# before that expiry would have silently dropped seven days of history.
# Selector matchers are full-string regexes, unlike pipeline label filters
# (substring), so multi-alternative event_name regexes match exact names.
# - Prod events carry cluster=".ava"; co-located cluster events must not
#   participate in prod alert evaluation.
# - Read side is strict: legacy records without a cluster dimension are excluded for up to the 7-day Loki retention, so aggregate counts may read low during rollout.
#   This is deliberate: allowing absent-cluster rows would keep the co-located preview leak visible in prod reads for the full retention window.
# - `| json` flattens nested objects with underscore joins:
#   attributes.n -> attributes_n, attributes.age_s -> attributes_age_s,
#   attributes.action -> attributes_action. Numbers parse as numbers, so
#   `| attributes_age_s < 600` is a numeric comparison.
# - Every count wraps in sum(...) — the unknown_service family has >500
#   streams over a day, and an unaggregated count_over_time hits Loki's
#   per-query series cap.
#
# Threshold calibration (unchanged from the Postgres rules — the data is the
# same stream):
#   WARNING+ERROR+CRITICAL      ~5-19 / 5m normally, one 54/5m spike in 2h
#   sse_drop+event_log_drop     SUM(payload.n) — real dropped events, not
#                               report rows (2026-08-08: the rules + rollup
#                               counted report rows, understating the backlog
#                               by the 5s aggregation factor). 7d live data:
#                               p95 ~13 / 10m chronic drip; real degradations
#                               160-342 / 10m. Threshold 100 sits in the gap.
#   agent_restarted             bursts of ~15 / 15m, worst 54 / 15m
#   llm_usage.latency_ms p95    ~13s / 10m typical, worst bucket 158s
#   gateway_latency heartbeat   60s cadence; 5m = 5x headroom. It requires
#                               request traffic: health probes + UI polling make
#                               it continuous here, while zero-traffic
#                               deployments may false-fire.
#   delivery_stalled fresh      (age_s < 600) 0 / 10m in the last 24h — any
#                               sustained fresh-stall burst means the delivery
#                               pipeline is newly stuck (the old-age backlog is
#                               chronic and not alert-worthy)
#   trace_degraded              any occurrence of
#                               recording_disabled_disk_watermark in 24h — a
#                               chronic-condition alert (disk over watermark),
#                               not a rate rule; fires once per episode,
#                               resolves 24h after the last event.
#   llm billing/quota           any occurrence of llm_provider_error with
#                               attributes.billing=true in 15m — not calibrated
#                               against a baseline because there is no healthy
#                               rate: one rejection means the key is dry.
#
# The `for` field keeps short evaluation windows from flapping: the condition
# must hold for the whole `for` duration before the alert fires. R13 sets it to
# 0m on purpose — see its own comment.
#
# Severity follows the alert-system vocabulary (Task #1224): critical /
# warning / error — all three push to IM, no gate. R4's Prometheus query
# returns no data during quiet periods (no llm_usage samples), so
# noDataState/execErrState stay pinned to OK — a datasource outage during
# maintenance must not fire every rule at once.
#
# The ruleUID label pins parse_rule_uid to the stable rule uid so synthetic
# DatasourceNoData/DatasourceError instances never collide on the
# alertname-derived dedup key.
apiVersion: 1
groups:
  - orgId: 1
    name: ava-ops
    folder: Ava
    interval: 1m
    rules:
      # ── R1: WARNING+ERROR spike (current 5m count > 3x the prior-15m rate, and ≥ 30) ──
      - uid: ava-ops-warning-error-spike
        title: "Event health: WARNING+ERROR+CRITICAL spike"
        condition: F
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: error
          ruleUID: ava-ops-warning-error-spike
          metric: warn_error_rate
          team: ava-ops
        annotations:
          summary: "WARNING+ERROR+CRITICAL event spike (current 5m count {{ $values.C }}, prior-15m expectation ≤ {{ $values.D }})"
          description: >-
            Events with level ∈ warning/error/critical reached {{ $values.C }} in
            the last 5 minutes, over 3x the prior-15m average rate ({{ $values.D }}
            per 5m). Likely a service failure or error loop. See the Grafana panel
            /grafana/d/ava-ops-main to locate the source.
        data:
          - refId: A
            datasourceUid: loki
            queryType: ""
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: >-
                sum(count_over_time({service_name="unknown_service"} | json | cluster=".ava" |
                category=~"telemetry|log" | level=~"warning|error|critical" [5m]))
              instant: true
              queryType: instant
            relativeTimeRange:
              from: 300
              to: 0
          - refId: B
            datasourceUid: loki
            queryType: ""
            model:
              refId: B
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: >-
                sum(count_over_time({service_name="unknown_service"} | json | cluster=".ava" |
                category=~"telemetry|log" | level=~"warning|error|critical" [15m] offset 5m))
              instant: true
              queryType: instant
            relativeTimeRange:
              from: 1200
              to: 300
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: B
              reducer: mean
          - refId: E
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: E
              datasource:
                type: __expr__
                uid: __expr__
              type: math
              expression: "$C > $D && $C >= 30"
          - refId: F
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: F
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: E
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [E]

      # ── R2: SSE / event-log drop backlog (real drops in 10m > 100; p95≈13, degraded 160-342) ──
      - uid: ava-ops-sse-drop-backlog
        title: "Event-pipeline drop backlog (sse_drop / event_log_drop)"
        condition: D
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: ava-ops-sse-drop-backlog
          metric: event_drop_rate
          team: ava-ops
        annotations:
          summary: "{{ $values.C }} real SSE/event-log drops in 10 minutes (threshold 100)"
          description: >-
            Events with event_name ∈ sse_drop / event_log_drop summed payload.n to
            {{ $values.C }} in the last 10 minutes (real drops; each report row
            carries the real drop count n since the previous report). SSE drops =
            degraded live view; event_log_drop = lost DB write-queue rows. Check
            the affected agent's event publisher / log-sink queue.
        data:
          - refId: A
            datasourceUid: loki
            queryType: ""
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: >-
                sum(sum_over_time({service_name="unknown_service", event_name=~"sse_drop|event_log_drop"} | json | cluster=".ava" |
                category="telemetry" |
                unwrap attributes_n [10m]))
              instant: true
              queryType: instant
            relativeTimeRange:
              from: 600
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [100]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R3: agent_restarted spike (>30 restarts in 15m, above the 7-day observed p95≈20) ──
      - uid: ava-ops-agent-restart-spike
        title: "Agent restart spike (agent_restarted)"
        condition: D
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: ava-ops-agent-restart-spike
          metric: agent_restart_rate
          team: ava-ops
        annotations:
          summary: "{{ $values.C }} agent restarts in 15 minutes (threshold 30)"
          description: >-
            Events with event_name=agent_restarted reached {{ $values.C }} in the
            last 15 minutes. A restart loop leaves agents unable to serve; check
            the restart cause (OOM / crash / manual restart).
        data:
          - refId: A
            datasourceUid: loki
            queryType: ""
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: >-
                sum(count_over_time({service_name="unknown_service", event_name="agent_restarted"} | json | cluster=".ava" |
                category="telemetry" [15m]))
              instant: true
              queryType: instant
            relativeTimeRange:
              from: 900
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [30]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R4: LLM latency p95 above threshold (10m window p95 > 60s; typical observed 13s, worst bucket 158s) ──
      # The p95 now comes from the OTLP metric mirror (Prometheus histogram),
      # not a SQL percentile — histogram_quantile over the latency buckets is
      # the same read the Insights Ops panel uses. The histogram only exists
      # while processes export OTLP metrics; absent data means NoData -> OK.
      - uid: ava-ops-llm-latency-p95
        title: "LLM latency p95 above threshold"
        condition: D
        for: 10m
        noDataState: OK
        execErrState: OK
        labels:
          severity: error
          ruleUID: ava-ops-llm-latency-p95
          metric: llm_latency_p95
          team: ava-ops
        annotations:
          summary: "LLM call latency p95 at {{ $values.C }} ms — value at last evaluation (threshold 60000 ms)"
          description: >-
            The latest p95 of llm_usage latency over the last 10 minutes is
            {{ $values.C }} ms. The alert fires after this value remains above
            60s for 10 minutes (histogram_quantile over the
            ava_llm_usage_latency histogram — an approximation of the exact
            SQL percentile, same as the Ops panel). Usually a provider-side
            failure or slow request pile-up. No alert fires when the metric is
            absent.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: >-
                histogram_quantile(0.95, sum by (le)
                (rate(ava_llm_usage_latency_milliseconds_bucket[10m])))
              instant: true
              range: false
            relativeTimeRange:
              from: 600
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [60000]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R5: delivery_stalled fresh backlog (>50 fresh stalls in 10m; current baseline 0) ──
      - uid: ava-ops-delivery-stalled-backlog
        title: "Delivery fresh backlog (delivery_stalled fresh)"
        condition: D
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: ava-ops-delivery-stalled-backlog
          metric: delivery_stall_rate
          team: ava-ops
        annotations:
          summary: "{{ $values.C }} fresh delivery stalls in 10 minutes (age_s < 600, threshold 50)"
          description: >-
            Events with event_name=delivery_stalled and age_s < 600 (fresh, not
            historical) reached {{ $values.C }} in the last 10 minutes. Old stalls
            (age_s in days) do not indicate a new failure; fresh stalls mean the
            delivery pipeline just got blocked.
        data:
          - refId: A
            datasourceUid: loki
            queryType: ""
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: >-
                sum(count_over_time({service_name="unknown_service", event_name="delivery_stalled"} | json | cluster=".ava" |
                category="telemetry" |
                attributes_age_s < 600 [10m]))
              instant: true
              queryType: instant
            relativeTimeRange:
              from: 600
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [50]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R6: event stream stalled (no events at all in 5m; meta-observability) ──
      # Semantics change with the LGTM cutover (Task #1224): the Postgres rule
      # measured the events TABLE's write freshness; that table is retired
      # (#1197), so the rule now probes the live stream in Loki with
      # absent_over_time — fires when NO event of any kind reached Loki in 5m.
      # That covers the emitter stall AND a broken OTLP export path (the
      # 2026-08-12 incident class), at the cost of no longer distinguishing
      # them. When the stream flows, the query returns no data (NoData -> OK).
      - uid: ava-ops-events-freshness
        title: "Event stream stalled (no events in Loki)"
        condition: D
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: error
          ruleUID: ava-ops-events-freshness
          metric: events_freshness
          team: ava-ops
        annotations:
          summary: "No events reached Loki in the last 5 minutes"
          description: >-
            absent_over_time reports the events stream
            ({service_name="unknown_service"}) produced no log lines in the
            last 5 minutes. The largest measured silent gap over 7d was 60s
            (the events_maintenance fast loop + agent activity are structural
            periodic writers), so 5m has 5x headroom. A stalled stream means
            the emitter/export path is down — the exact outage that made Loki
            go dark on 2026-08-12 (OTLP preflight bug). When the stream flows
            the query returns no data (NoData -> OK). If Loki itself is down,
            the rule errors (execErrState OK is silent) and the health-probe
            chain covers it.
        data:
          - refId: A
            datasourceUid: loki
            queryType: ""
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: >-
                absent_over_time({service_name="unknown_service"} | json | cluster=".ava" [5m])
              instant: true
              queryType: instant
            relativeTimeRange:
              from: 300
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R6b: event stream below its measured low-water mark ──
      # Complements R6: absent_over_time catches a total stop (zero flow),
      # while this rule catches partial write loss when a few batches still
      # reach Loki. The rules intentionally run in parallel and may overlap.
      # Calibration at 2026-09-06 03:11 Beijing over the preceding 24h:
      # whole-cluster 5m counts min=295 (~59/min, two windows), p05=349,
      # median=1071, max=3167. The 150/5m threshold (~30/min) is about half
      # the measured trough; it must remain breached for 10m before firing.
      - uid: ava-ops-events-low-water
        title: "Event stream below low-water mark"
        condition: D
        for: 10m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: ava-ops-events-low-water
          metric: events_freshness
          team: ava-ops
        annotations:
          summary: "Only {{ $values.C }} events reached Loki in 5 minutes (low-water 150)"
          description: >-
            Whole-cluster event volume stayed below 150 lines per 5 minutes
            for 10 minutes. This catches partial Loki write loss that the
            parallel absent-over-time freshness rule cannot see while even
            one batch still arrives. The calibrated floor is about half the
            lowest measured 5-minute volume, leaving substantial night-time
            headroom while detecting a degraded write path.
        data:
          - refId: A
            datasourceUid: loki
            queryType: ""
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: >-
                sum(count_over_time({service_name="unknown_service"} | json | cluster=".ava" [5m])) or vector(0)
              instant: true
              queryType: instant
            relativeTimeRange:
              from: 300
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: lt
                    params: [150]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R8: host CPU saturated (issue #46) ──
      # 1 - idle, averaged over the machine's cores. 0.90 sustained for 15m is
      # the shipped default: short bursts are normal work (a build, an eval
      # sweep), a quarter-hour pinned is the box having no headroom left for
      # anything else. Tune per deployment — this is a machine-spec fact.
      - uid: ava-ops-host-cpu-saturated
        title: "Host CPU saturated"
        condition: D
        for: 15m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: ava-ops-host-cpu-saturated
          metric: host_cpu
          team: ava-ops
        annotations:
          summary: "{{ $labels.machine_name }} CPU at {{ $values.C }} (threshold 0.90) for 15m"
          description: >-
            Non-idle CPU on {{ $labels.machine_name }} has averaged
            {{ $values.C }} (fraction of all cores) for 15 minutes. This is
            not a limit the kernel enforces — a training or eval job may
            legitimately own the box. The operator decides: identify the
            consumer (Grafana /grafana/d/ava-ops-main, "Host & data plane" section), then
            investigate, terminate idle agents, or leave it alone.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: >-
                round(1 - avg by (machine_name)
                (system_cpu_utilization_ratio{state="idle"}), 0.001)
              instant: true
              range: false
            relativeTimeRange:
              from: 900
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0.9]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R9: host memory pressure (issue #46) ──
      # state="used" is the OTel host_metrics equivalent of the status page's
      # pressure figure (total - available): reclaimable cache is NOT counted
      # as used, so 0.90 here means real pressure, not a warm page cache.
      - uid: ava-ops-host-memory-pressure
        title: "Host memory pressure"
        condition: D
        for: 15m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: ava-ops-host-memory-pressure
          metric: host_memory
          team: ava-ops
        annotations:
          summary: "{{ $labels.machine_name }} memory at {{ $values.C }} used (threshold 0.90) for 15m"
          description: >-
            Used memory on {{ $labels.machine_name }} has held at {{ $values.C }} of
            RAM for 15 minutes (reclaimable cache excluded). Sustained
            pressure precedes swapping and the OOM killer, whose visible form
            is an agent restart spike (R3). Check the per-agent footprint and
            consider terminating idle agents.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: >-
                round(avg by (machine_name)
                (system_memory_utilization_ratio{state="used"}), 0.001)
              instant: true
              range: false
            relativeTimeRange:
              from: 900
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0.9]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R10: per-volume disk watermark (issue #46) ──
      # The realistic killer: the trace-v2 incident wrote 31 GB/h of mirror
      # before content stripping landed, and the only signal was agents
      # silently disabling span recording (R7 — a CONSEQUENCE alert). This
      # rule fires on the cause, per mountpoint, so the pg data dir, the
      # traces mirror and the LGTM host's Loki volumes are all covered by
      # whichever filesystem carries them. One instance per
      # (machine_name, mountpoint):
      # on macOS the volumes of one APFS container all report the container's
      # fullness, so a single full disk legitimately fires twice.
      # Excluded: the wsl machine's docker-desktop VM image is mounted
      # read-only under /mnt/wsl/docker-desktop/* on a loop device and
      # reports a constant 1.0 utilization — a by-design non-Ava asset,
      # not disk growth (task #2024). The mountpoint prefix is WSL-specific,
      # so no other machine is affected by the matcher.
      - uid: ava-ops-host-disk-watermark
        title: "Filesystem over watermark"
        condition: D
        for: 15m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: ava-ops-host-disk-watermark
          metric: host_disk
          team: ava-ops
        annotations:
          summary: "{{ $labels.machine_name }} {{ $labels.mountpoint }} at {{ $values.C }} full (threshold 0.90)"
          description: >-
            Filesystem {{ $labels.mountpoint }} on {{ $labels.machine_name }} is
            {{ $values.C }} full. 0.90 is also AVA_TRACE_DISK_WATERMARK's
            default, so crossing it silently degrades trace recording on that
            machine (R7 reports that consequence). Triage: find the growth —
            the traces mirror ($AVA_HOME/traces), the Postgres data dir, or
            the LGTM host's Loki/Prometheus volumes — then prune or raise the
            volume.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: >-
                round(max by (machine_name, mountpoint)
                (system_filesystem_utilization_ratio{mountpoint!~"/mnt/wsl/docker-desktop.*"}), 0.001)
              instant: true
              range: false
            relativeTimeRange:
              from: 900
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0.9]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R10b: disk escalation before Loki's WAL hard stop ──
      # 0.93 is the escalation warning between the retained 0.90 watermark
      # and Loki's 0.95 WAL disk_full_threshold. The shorter critical hold at
      # 0.95 reflects the 2026-09-05 incident: WAL write throttling killed the
      # event stream while /ready continued to answer 200.
      - uid: ava-ops-host-disk-watermark-93
        title: "Filesystem approaching Loki WAL hard stop"
        condition: D
        for: 15m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: ava-ops-host-disk-watermark-93
          metric: host_disk
          team: ava-ops
        annotations:
          summary: "{{ $labels.machine_name }} {{ $labels.mountpoint }} at {{ $values.C }} full (threshold 0.93)"
          description: >-
            Filesystem {{ $labels.mountpoint }} on {{ $labels.machine_name }} is
            {{ $values.C }} full. This escalation warning sits between the
            0.90 capacity watermark and Loki's 0.95 WAL disk-full hard stop.
            Free space before write throttling can interrupt the event stream.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: >-
                round(max by (machine_name, mountpoint)
                (system_filesystem_utilization_ratio{mountpoint!~"/mnt/wsl/docker-desktop.*"}), 0.001)
              instant: true
              range: false
            relativeTimeRange:
              from: 900
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0.93]
                  operator:
                    type: and
                  query:
                    params: [C]

      - uid: ava-ops-host-disk-watermark-95
        title: "Filesystem at Loki WAL hard stop"
        condition: D
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
          ruleUID: ava-ops-host-disk-watermark-95
          metric: host_disk
          team: ava-ops
        annotations:
          summary: "{{ $labels.machine_name }} {{ $labels.mountpoint }} at {{ $values.C }} full (critical threshold 0.95)"
          description: >-
            Filesystem {{ $labels.mountpoint }} on {{ $labels.machine_name }} is
            {{ $values.C }} full. 0.95 is Loki WAL's disk_full_threshold: the
            2026-09-05 incident crossed this line, throttled WAL writes, and
            killed the event stream while Loki /ready stayed green. Free disk
            immediately and verify the write path recovers.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: >-
                round(max by (machine_name, mountpoint)
                (system_filesystem_utilization_ratio{mountpoint!~"/mnt/wsl/docker-desktop.*"}), 0.001)
              instant: true
              range: false
            relativeTimeRange:
              from: 900
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0.95]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── checkpoint_blobs physical high-water (Task #1545a) ──
      # Plain VACUUM reclaims dead tuples but does not compact fragmented
      # files. These rules surface the persistent physical size while there is
      # still room to make an operator-led repack and disk-capacity decision.
      - uid: ava-ops-checkpoint-blobs-warning
        title: "checkpoint_blobs physical size above 2.5 GiB"
        condition: D
        for: 2h
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: ava-ops-checkpoint-blobs-warning
          metric: checkpoint_blobs_physical_bytes
          team: ava-ops
        annotations:
          summary: "checkpoint_blobs physical size {{ $values.C }} B is above 2.5 GiB"
          description: >-
            checkpoint_blobs is retaining more than 2.5 GiB of physical
            storage after its plain vacuum pass. Decide whether a repack is
            warranted and free disk before the statvfs emergency watermark.
            This metric refreshes only during the 05:00-08:00 vacuum window
            and on force runs.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: max(ava_checkpoint_table_sizes_blobs_bytes) > 2684354560
              instant: true
              range: false
            relativeTimeRange:
              from: 900
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [2684354560]
                  operator:
                    type: and
                  query:
                    params: [C]

      - uid: ava-ops-checkpoint-blobs-error
        title: "checkpoint_blobs physical size above 4 GiB"
        condition: D
        for: 2h
        noDataState: OK
        execErrState: OK
        labels:
          severity: error
          ruleUID: ava-ops-checkpoint-blobs-error
          metric: checkpoint_blobs_physical_bytes
          team: ava-ops
        annotations:
          summary: "checkpoint_blobs physical size {{ $values.C }} B is above 4 GiB"
          description: >-
            checkpoint_blobs is retaining more than 4 GiB of physical storage
            after its plain vacuum pass. Make the repack decision and free
            disk before the statvfs emergency watermark. This metric refreshes
            only during the 05:00-08:00 vacuum window and on force runs.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: max(ava_checkpoint_table_sizes_blobs_bytes) > 4294967296
              instant: true
              range: false
            relativeTimeRange:
              from: 900
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [4294967296]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R11: Postgres connection saturation (issue #46) ──
      # Backends against the server's own max_connections, both read from the
      # postgresql receiver. This is where pool saturation surfaces: PgBouncer
      # itself has no OTel contrib receiver (its SHOW STATS admin protocol is
      # not the Postgres wire protocol), and adding a postgres_exporter /
      # pgbouncer_exporter binary per machine is the footprint the sidecar
      # architecture exists to avoid. Backends piling up means either the
      # pooler is passing through more than it should or the pooler is gone
      # and every process is dialing Postgres directly.
      - uid: ava-ops-pg-connection-saturation
        title: "Postgres connection saturation"
        condition: D
        for: 10m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: ava-ops-pg-connection-saturation
          metric: pg_connections
          team: ava-ops
        annotations:
          summary: "{{ $labels.machine_name }} Postgres backends at {{ $values.C }} of max_connections (threshold 0.80)"
          description: >-
            Open Postgres backends on {{ $labels.machine_name }} are at
            {{ $values.C }} of the server's max_connections. Past 1.0 new
            connections are refused and every process that needs the database
            fails at once. Check the PgBouncer pooler is up and pooling
            (AVA_PGBOUNCER_ENABLED), and look for a process leaking sessions.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: >-
                round(max by (machine_name) (postgresql_backends)
                / max by (machine_name) (postgresql_connection_max), 0.001)
              instant: true
              range: false
            relativeTimeRange:
              from: 600
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0.8]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R12: Redis memory (issue #46) ──
      # The redis receiver reports used memory but not maxmemory, so this is
      # an absolute byte threshold — 2 GiB, a deployment fact about the box's
      # RAM, tuned here. Ava's Redis carries the events pub/sub channel and
      # short-lived caches; a steadily climbing footprint is a leak, and once
      # maxmemory is reached the eviction of live keys (redis_keys_evicted_total,
      # on the dashboard) starts dropping cluster state.
      - uid: ava-ops-redis-memory
        title: "Redis memory above threshold"
        condition: D
        for: 15m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: ava-ops-redis-memory
          metric: redis_memory
          team: ava-ops
        annotations:
          summary: "{{ $labels.machine_name }} Redis using {{ $values.C }} bytes (threshold 2 GiB)"
          description: >-
            Redis on {{ $labels.machine_name }} is holding {{ $values.C }} bytes for
            15 minutes, above the 2 GiB deployment threshold. Inspect the
            keyspace for an unbounded producer; the events channel is a
            stream, not a store, so a growing resident set is normally a
            cache that never expires.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: >-
                max by (machine_name) (redis_memory_used_bytes)
              instant: true
              range: false
            relativeTimeRange:
              from: 900
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [2147483648]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R14: collector exporter queue pressure (current ratio > 0.80) ──
      # The queue gauges are current state. This deliberately does NOT use the
      # process-lifetime enqueue-failure counter: one old outage must resolve
      # after the route recovers. One instance per
      # machine_name/exporter/data_type says which machine and signal path is
      # blocked.
      - uid: ava-ops-otelcol-queue-pressure
        title: "OTel Collector exporter queue pressure"
        condition: D
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: error
          ruleUID: ava-ops-otelcol-queue-pressure
          metric: otelcol_queue
          team: ava-ops
        annotations:
          summary: "{{ $labels.machine_name }} collector {{ $labels.exporter }} {{ $labels.data_type }} queue at {{ $values.C }} (threshold 0.80)"
          description: >-
            The OTel Collector exporter queue on {{ $labels.machine_name }} for
            {{ $labels.exporter }} ({{ $labels.data_type }}) has stayed above
            80% capacity for 5 minutes. The destination or runner-to-gateway
            relay is not keeping up. Check gateway reachability, the collector
            receiver, and the LGTM backend before the queue fills and rejects
            new telemetry.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: >-
                round(max by (machine_name, exporter, data_type)
                (otelcol_exporter_queue_size)
                / clamp_min(max by (machine_name, exporter, data_type)
                (otelcol_exporter_queue_capacity), 1), 0.001)
              instant: true
              range: false
            relativeTimeRange:
              from: 300
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0.8]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R15: newly rejected telemetry (enqueue-failure delta > 0 in 5m) ──
      # These are monotonic counters. `increase` is load-bearing: comparing an
      # absolute value would create a permanent alert after the first failure
      # until the collector restarted.
      - uid: ava-ops-otelcol-enqueue-failures
        title: "OTel Collector rejected telemetry"
        condition: D
        for: 0m
        noDataState: OK
        execErrState: OK
        labels:
          severity: error
          ruleUID: ava-ops-otelcol-enqueue-failures
          metric: otelcol_enqueue_failed
          team: ava-ops
        annotations:
          summary: "{{ $labels.machine_name }} collector {{ $labels.exporter }} rejected {{ $values.C }} telemetry items in 5m"
          description: >-
            The OTel Collector on {{ $labels.machine_name }} could not enqueue
            {{ $values.C }} log records, metric points, or spans for exporter
            {{ $labels.exporter }} in the last 5 minutes. This is active data
            loss, not historical backlog. Restore the runner-to-gateway relay
            or the gateway-local backend and verify the queue drains.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: >-
                sum by (machine_name, exporter)
                (increase({__name__=~"otelcol_exporter_enqueue_failed_(log_records|metric_points|spans)_total"}[5m]))
              instant: true
              range: false
            relativeTimeRange:
              from: 300
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R16: recently-seen collector stopped reporting ──
      # noDataState=OK cannot name one missing machine. This set subtraction
      # keeps the per-machine identity: machines observed in 24h but absent for
      # 5m. The instance naturally retires after 24h; machine-heartbeat
      # alerting owns permanent fleet membership, while this rule owns the
      # collector path.
      - uid: ava-ops-otelcol-host-silent
        title: "OTel Collector stopped reporting"
        condition: D
        # The query's 5m absence window is already the debounce. A second 5m
        # `for` would turn the documented 5m detection into ~10m.
        for: 0m
        noDataState: OK
        execErrState: OK
        labels:
          severity: error
          ruleUID: ava-ops-otelcol-host-silent
          metric: otelcol_silence
          team: ava-ops
        annotations:
          summary: "{{ $labels.machine_name }} collector has not reported for 5 minutes"
          description: >-
            Machine {{ $labels.machine_name }} reported OTel Collector uptime within the
            last 24 hours but no sample arrived in the last 5 minutes. The
            collector may be down or its runner-to-gateway metrics relay may
            be broken. Check the local ava-otel-collector session and the
            authenticated gateway OTLP receiver.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: >-
                max by (machine_name) (max_over_time(otelcol_process_uptime_total[24h]))
                unless on(machine_name)
                max by (machine_name) (max_over_time(otelcol_process_uptime_total[5m]))
              instant: true
              range: false
            relativeTimeRange:
              from: 86400
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── Watchdog tick stale (per capability, current or recently seen) ──
      # A watchdog process can stay alive while a controller or healthcheck
      # never finishes. Its healthz listener is driven by the same completed
      # tick timestamp, and this metric observes that timestamp independently
      # through the OTLP metrics path. The first branch catches a recent but
      # stale timestamp after 3m. The second carries the alert through Prometheus
      # staleness: a capability seen within 24h that has emitted no sample in 3m.
      # ``machine`` and ``process`` distinguish the gateway and agent-runner
      # watchdogs on one host without paging for a retired machine forever.
      - uid: ava-ops-watchdog-tick-stale
        title: "Watchdog stopped completing ticks"
        condition: D
        # The 3m freshness/absence windows are the debounce. A second `for`
        # delay would add another round after a watchdog has already failed its
        # 90s deadline and missed its 60s cadence. The remaining 30s is an
        # intentional alert margin; re-derive this window if that deadline or
        # cadence changes.
        for: 0m
        noDataState: OK
        execErrState: OK
        labels:
          severity: error
          ruleUID: ava-ops-watchdog-tick-stale
          metric: watchdog_tick_stale
          team: ava-ops
        annotations:
          summary: "{{ $labels.machine }} {{ $labels.process }} watchdog has not completed a tick for 3 minutes"
          description: >-
            This watchdog recorded a completed tick within the previous 24 hours,
            but its latest tick timestamp is more than three minutes old or it
            has emitted no tick sample for three minutes. The watchdog process
            can still be alive while a controller or healthcheck is wedged.
            Check its role-specific healthz endpoint and log, then inspect the
            controller or healthcheck named before the timeout. If the sibling
            ava-ops-gateway-metrics-silent alert also fires, triage the OTLP or
            Prometheus metrics pipeline before treating this as a watchdog wedge.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: >-
                max by (machine, process) (
                  time() - max_over_time(ava_watchdog_tick_last_tick_timestamp_seconds[3m])
                ) > 180
                or
                (
                  max by (machine, process) (
                    max_over_time(ava_watchdog_tick_last_tick_timestamp_seconds[24h])
                  )
                  unless on(machine, process)
                  max by (machine, process) (
                    max_over_time(ava_watchdog_tick_last_tick_timestamp_seconds[3m])
                  )
                )
              instant: true
              range: false
            relativeTimeRange:
              from: 86400
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── Gateway application metrics silent (gateway_latency heartbeat absent 5m) ──
      # This Prometheus-native watchdog does not depend on the gateway's events
      # reaching Loki: that exporter is the component whose blindness it detects.
      - uid: ava-ops-gateway-metrics-silent
        title: "Gateway metrics stream silent (gateway_latency heartbeat)"
        condition: D
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: error
          ruleUID: ava-ops-gateway-metrics-silent
          metric: gateway_metrics_silence
          team: ava-ops
        annotations:
          summary: "The gateway's 60s latency heartbeat stopped reaching Prometheus"
          description: >-
            The gateway's own 60-second gateway_latency heartbeat has stopped
            reaching Prometheus. Either AVA_TELEMETRY_OTLP_ENABLED=off disabled
            the whole OTLP surface (the R6 events rule also fires), the gateway's
            OTLP exporter is blind after an init-time collector blip (the
            five-minute retry and otlp_backend_recovered event close that
            episode), or the collector/Prometheus path broke. Triage
            ~/.ava/logs/events-*.jsonl, [otlp-exporter] log lines, and
            ava_gateway_latency_count_total in Prometheus.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: >-
                absent_over_time(ava_gateway_latency_count_total[5m])
              instant: true
              range: false
            relativeTimeRange:
              from: 300
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R20: Memory search rows soft warning (task #2088/#2090) ──
      # The memory-search store's absolute row count, sampled every 60s into
      # the ava_memory_search_stats_rows_ratio gauge (OTLP mirror, job
      # ava/ava-memory_search, contract metric name — task #1107). The count
      # only grows between npz rebuilds, so a 2h hold means real growth:
      # 30k soft warning, 50k backend-switch evaluation, 100k hard cap.
      - uid: ava-ops-memory-search-rows-warning
        title: "Memory search rows above soft threshold"
        condition: D
        for: 2h
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: ava-ops-memory-search-rows-warning
          metric: memory_search_rows
          team: ava-ops
        annotations:
          summary: "Memory search store at {{ $values.C }} rows (soft threshold 30000)"
          description: >-
            The memory-search store holds {{ $values.C }} chunk rows for 2 hours,
            above the 30k soft threshold. Baseline growth is ~1160 rows/month;
            50k is the backend-switch evaluation point and 100k the hard cap (R21).
            Triage the npz rebuild and the task #2089 upsert plan before the count
            compounds.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: max(ava_memory_search_stats_rows_ratio) > 30000
              instant: true
              range: false
            relativeTimeRange:
              from: 900
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [30000]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R21: Memory search rows hard cap (task #2088/#2090) ──
      - uid: ava-ops-memory-search-rows-critical
        title: "Memory search rows above hard cap"
        condition: D
        for: 2h
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
          ruleUID: ava-ops-memory-search-rows-critical
          metric: memory_search_rows
          team: ava-ops
        annotations:
          summary: "Memory search store at {{ $values.C }} rows (hard cap 100000)"
          description: >-
            The memory-search store holds {{ $values.C }} chunk rows for 2 hours,
            past the 100k hard cap where rebuild and upsert costs stop being
            acceptable (task #2089). Act on the backend switch / rebuild plan
            immediately.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: max(ava_memory_search_stats_rows_ratio) > 100000
              instant: true
              range: false
            relativeTimeRange:
              from: 900
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [100000]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R22: scheduled recovery proof failure (any occurrence in 1h) ──
      # One failed isolated restore means the recovery path cannot presently
      # be trusted. The event is emitted by both the weekly logical-dump
      # scheduler and the monthly PITR candidate proof; group by the named
      # drill so one broken path does not hide the other.
      - uid: ava-ops-recovery-drill-failed
        title: "Scheduled recovery drill failed"
        condition: D
        for: 0m
        noDataState: OK
        execErrState: OK
        labels:
          severity: error
          ruleUID: ava-ops-recovery-drill-failed
          metric: recovery_drill_failure
          team: ava-ops
        annotations:
          summary: "Recovery drill {{ $labels.attributes_drill }} failed ({{ $values.C }} failure events in 1h)"
          description: >-
            The scheduled {{ $labels.attributes_drill }} recovery proof failed
            at least once in the last hour. The failed proof does not mark a
            successful drill and does not change the backup schedule. Inspect
            the matching recovery_drill_failed event, repair the isolated
            restore path, then confirm a later scheduled proof succeeds.
        data:
          - refId: A
            datasourceUid: loki
            queryType: ""
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: >-
                sum by (attributes_drill) (count_over_time({service_name="unknown_service", event_name="recovery_drill_failed"}
                | json | cluster=".ava" | category="telemetry" | level="error" [1h]))
              instant: true
              queryType: instant
            relativeTimeRange:
              from: 3600
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]

  # Low-cost tier (R7, R13, R17's two rules, R18, R19's two rules, R23) at 5m
  # evaluation. R7 is a chronic 24h condition, R13 counts any rejection in
  # 15m, and the route gateway-latency queries are the most expensive rules
  # (fleet-graph degradation wave, 2026-08-23, #3224). Their `for` windows
  # remain unchanged, so semantics hold at 1/5 the evaluation cost.
  - orgId: 1
    name: ava-ops-slow
    folder: Ava
    interval: 5m
    rules:
      # R7 evaluates at 5m without semantic loss: it is chronic and resolves
      # 24h after the last event.
      # ── R7: trace recording auto-degraded (disk over watermark; ANY occurrence in 24h) ──
      # The 2026-08-07..10 incident class: 207 recording_disabled_disk_watermark
      # events over 3 days, nobody noticed — the drip sat under R1's spike
      # threshold forever. This rule is a chronic-condition alert, not a rate
      # rule: any occurrence in the trailing 24h means the observability
      # pipeline is degraded RIGHT NOW (every event = one agent start that
      # skipped span recording). The 24h window keeps it firing across the
      # event drip (observed 1-3h gaps while a machine is over watermark) and
      # resolves 24h after the last event — one onset + one recovery IM per
      # episode instead of one per event. error severity: silently-off
      # observability is the incident class this alert exists to end.
      - uid: ava-ops-trace-disk-watermark
        title: "Trace recording disabled (data disk over watermark)"
        condition: D
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: error
          ruleUID: ava-ops-trace-disk-watermark
          metric: trace_degraded
          team: ava-ops
        annotations:
          summary: "Trace recording auto-disabled — data disk over watermark ({{ $values.C }} degradation events in 24h)"
          description: >-
            Events with attributes.action=recording_disabled_disk_watermark
            (event_name=trace, category=telemetry) reached {{ $values.C }} in
            the last 24 hours. Each event = one agent start that skipped span
            recording because its data disk is over AVA_TRACE_DISK_WATERMARK
            (default 0.9): the mirror can never fill the disk, but spans are
            not recorded — an observability blind spot (2026-08-07..10: 207
            events over 3 days, unnoticed). Triage: `df -h` on the affected
            machine (the event carries usage_fraction/free_gb), free space,
            then confirm the events stop. Resolves automatically 24h after the
            last degradation event. If the export path fails, new events stop
            landing and this rule goes quiet with them — that outage class is
            covered by R6 (event stream stalled) + the health-probe chain.
        data:
          - refId: A
            datasourceUid: loki
            queryType: ""
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: >-
                sum(count_over_time({service_name="unknown_service", event_name="trace"} | json | cluster=".ava" |
                category="telemetry" |
                attributes_action="recording_disabled_disk_watermark" [24h]))
              instant: true
              queryType: instant
            relativeTimeRange:
              from: 1440
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── Provider-specific 429 rate-limit burst (> 5 in 5m) ──
      # A single 429 is recoverable by the retry policy. Six in the trailing
      # five minutes means retries are sustaining a provider-level pressure
      # incident. Group by vendor so the notification names the account that
      # needs concurrency reduction or a quota check, without paging once per
      # affected model.
      - uid: ava-ops-llm-rate-limit
        title: "LLM provider rate-limit burst"
        condition: D
        for: 0m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: ava-ops-llm-rate-limit
          metric: llm_rate_limit_burst
          team: ava-ops
        annotations:
          summary: "LLM {{ $labels.attributes_vendor }} rate-limit burst ({{ $values.C }} HTTP 429s in 5m)"
          description: >-
            The {{ $labels.attributes_vendor }} provider emitted {{ $values.C }}
            HTTP 429 responses in the last five minutes. The client limiter and
            retry policy are absorbing them, but sustained pressure can delay or
            exhaust turns. Triage: reduce outbound concurrency, then inspect the
            provider's account concurrency and rate limits.
        data:
          - refId: A
            datasourceUid: loki
            queryType: ""
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: >-
                sum by (attributes_vendor)
                (count_over_time({service_name="unknown_service", event_name="llm_provider_error"} | json | cluster=".ava" |
                category="telemetry" |
                attributes_status="429" [5m]))
              instant: true
              queryType: instant
            relativeTimeRange:
              from: 300
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [5]
                  operator:
                    type: and
                  query:
                    params: [C]

      # R13 evaluates at 5m without semantic loss: any rejection in its
      # trailing 15m window still fires; detection grows from <=1m to <=5m.
      # ── R13: LLM provider billing / quota failure (any occurrence in 15m) ──
      # The one alert in this file that is deliberately NOT threshold-gated: an
      # out-of-credit key fails EVERY turn on it, the operator action (top up /
      # raise the quota) is the same whether it happened once or a thousand
      # times, and nothing else in the fleet can proceed meanwhile — so the
      # first occurrence is already the whole incident. Before this rule the
      # only signal was R1's WARNING+ERROR spike, which needs 30 events in 5m
      # before it says anything, and says "event spike", not "the key is dry".
      #
      # `for: 0m` (every sibling waits 5-15m) follows from the same reasoning:
      # there is no flap to damp — the condition is a count over a 15m window,
      # so it stays true for 15m after the last failure and then resolves. One
      # episode = one firing IM + one resolved IM, the same dedup semantics the
      # siblings get from their `for` window (alerts are deduped on
      # fingerprint x starts_at by shared/alerts.py, not on `for`).
      #
      # `billing` is emitted by shared/lm/errors.py from its cross-provider
      # predicate (HTTP 402, plus a
      # per-vendor vocabulary matched against the response body's error.type AND
      # error.code — DashScope reports the specific reason only in the latter) —
      # the rule never enumerates statuses itself, so a provider added there is
      # covered here for free. Grouping by vendor+model makes one dead key one
      # alert instance that names itself; both labels come off the
      # json-flattened event body.
      #
      # critical, not error: this is the only rule whose condition means the
      # agents cannot run at all until a human spends money.
      - uid: ava-ops-llm-billing-quota
        title: "LLM provider billing/quota failure"
        condition: D
        for: 0m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
          ruleUID: ava-ops-llm-billing-quota
          metric: llm_billing_failure
          team: ava-ops
        annotations:
          summary: "LLM API billing/quota failure — the {{ $labels.attributes_vendor }} key for {{ $labels.attributes_model }} is out of credit or quota-throttled ({{ $values.C }} rejections in 15m)"
          description: >-
            Events with event_name=llm_provider_error and attributes.billing=true
            reached {{ $values.C }} in the last 15 minutes for model
            {{ $labels.attributes_model }} (vendor
            {{ $labels.attributes_vendor }}). The provider refused with HTTP 402
            or its own insufficient-balance / quota code — no retry can
            clear it, so every turn on this key fails until the account is
            topped up or the quota raised. Fires on the FIRST occurrence by
            design (no spike threshold): one rejection already means the fleet
            is stalled on this model. Triage: top up the vendor account, or
            point AVA_LLM_MODEL at a model whose key still has credit; the rule
            resolves 15m after the last rejection.
        data:
          - refId: A
            datasourceUid: loki
            queryType: ""
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: >-
                sum by (attributes_vendor, attributes_model)
                (count_over_time({service_name="unknown_service", event_name="llm_provider_error"} | json | cluster=".ava" |
                category="telemetry" |
                attributes_billing="true" [15m]))
              instant: true
              queryType: instant
            relativeTimeRange:
              from: 900
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R17: Gateway latency by route — fast routes only. The exclusion
      #        source is gateway/_latency.py. p95 bucket > 3s for 5m =
      #        warning; > 10s for 5m = error. Calibrated 2026-08-23 on 7d
      #        data: fast-route max p95 sits under ~5.5s with typical
      #        sub-second values; 3s/10s two-tier follows the PM slow-request
      #        spec. Warning-first: no IM push (Insights-visible only) — the
      #        user's alarm-fatigue ruling (2026-08-22). ──
      - uid: ava-ops-gateway-latency-route-warning
        title: "Gateway latency: fast route p95 above 3s"
        condition: D
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: ava-ops-gateway-latency-route-warning
          metric: gateway_latency_route_p95
          team: ava-ops
          notify_im: "false"
        annotations:
          summary: "Fast route {{ $labels.attributes_route }} p95 at {{ $values.C }} ms (threshold 3000 ms)"
          description: >-
            The route's gateway_latency bucket p95 stayed above 3s for 5
            minutes. LLM-bound and Loki-backed slow-by-design routes are
            excluded; this fires only on UI-facing quick reads.
        data:
          - refId: A
            datasourceUid: loki
            queryType: ""
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: >-
                max by (attributes_route) (max_over_time({service_name="unknown_service", event_name="gateway_latency"}
                | json | cluster=".ava" | category=~"telemetry|log"
                | attributes_route_class="fast"
                | unwrap attributes_p95_ms [5m]))
              instant: true
              range: false
            relativeTimeRange:
              from: 300
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: max
              mode: byLabels
              includeLabels:
                - attributes_route
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [3000]
                  operator:
                    type: and
                  query:
                    params: [C]

      - uid: ava-ops-gateway-latency-route-error
        title: "Gateway latency: fast route p95 above 10s"
        condition: D
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: error
          ruleUID: ava-ops-gateway-latency-route-error
          metric: gateway_latency_route_p95
          team: ava-ops
          notify_im: "false"
        annotations:
          summary: "Fast route {{ $labels.attributes_route }} p95 at {{ $values.C }} ms (threshold 10000 ms)"
          description: >-
            The route's gateway_latency bucket p95 stayed above 10s for 5
            minutes — a UI-facing quick read has degraded severely.
        data:
          - refId: A
            datasourceUid: loki
            queryType: ""
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: >-
                max by (attributes_route) (max_over_time({service_name="unknown_service", event_name="gateway_latency"}
                | json | cluster=".ava" | category=~"telemetry|log"
                | attributes_route_class="fast"
                | unwrap attributes_p95_ms [5m]))
              instant: true
              range: false
            relativeTimeRange:
              from: 300
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: max
              mode: byLabels
              includeLabels:
                - attributes_route
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [10000]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R23: remote PITR byte footprint grows more than 25% in one week ──
      # This uses the dry-run retention inventory's absolute gauge. It is
      # intentionally a non-paging early warning: a new seven-day baseline is
      # quiet, and the planner remains viewer-only with no delete capability.
      - uid: ava-ops-pitr-storage-growth
        title: "Remote PITR storage grew more than 25% in one week"
        condition: D
        for: 1h
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: ava-ops-pitr-storage-growth
          metric: pitr_remote_storage_growth
          team: ava-ops
          notify_im: "false"
        annotations:
          summary: "Remote PITR storage on {{ $labels.machine }} ({{ $labels.backend }}) is {{ $values.C }}x its week-ago footprint"
          description: >-
            The remote PITR inventory byte footprint stayed above 125% of its
            value seven days earlier for one hour. This is an observability
            warning, not retention enforcement: inspect WAL/base-candidate
            volume and the dry-run plan before changing any storage policy.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: >-
                max by (machine, backend) (ava_pitr_remote_inventory_bytes_ratio) /
                clamp_min(max by (machine, backend) (ava_pitr_remote_inventory_bytes_ratio offset 7d), 1)
              instant: true
              range: false
            relativeTimeRange:
              from: 604800
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [1.25]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R18: Turn duration p95 (agent-wide slowdown signal). Threshold =
      #        2x the 24h baseline p95 (37.6s on 2026-08-23) → 75s, sustained
      #        10m. Warning-first, no IM push. ──
      - uid: ava-ops-turn-duration-p95
        title: "Turn duration p95 above 75s"
        condition: D
        for: 10m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: ava-ops-turn-duration-p95
          metric: turn_duration_p95
          team: ava-ops
          notify_im: "false"
        annotations:
          summary: "Turn duration p95 at {{ $values.C }} s (threshold 75 s, 2x 24h baseline)"
          description: >-
            The agent-wide turn duration p95 (ava_turn_end_duration_seconds
            histogram, 10m rate) stayed above 75s — 2x the 2026-08-23 24h
            baseline of 37.6s — for 10 minutes. Signals collective slowdown
            ("runs slower and slower"), not a single long task.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: >-
                histogram_quantile(0.95, sum by (le)
                (rate(ava_turn_end_duration_seconds_bucket[10m])))
              instant: true
              range: false
            relativeTimeRange:
              from: 600
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [75]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R19: Gateway latency by route — slow routes only. Slow routes are
      #        expected to take longer, so their calibrated warning/error
      #        thresholds are 5s/10s. Warning-first: no IM push
      #        (Insights-visible only). ──
      - uid: ava-ops-gw-latency-slow-warning
        title: "Gateway latency: slow route p95 above 5000ms"
        condition: D
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: ava-ops-gw-latency-slow-warning
          metric: gateway_latency_route_slow_p95
          team: ava-ops
          notify_im: "false"
        annotations:
          summary: "Slow route {{ $labels.attributes_route }} p95 at {{ $values.C }} ms (threshold 5000 ms)"
          description: >-
            The slow route's gateway_latency bucket p95 stayed above 5000ms
            for 5 minutes. Slow-by-design routes are evaluated separately
            from UI-facing quick reads.
        data:
          - refId: A
            datasourceUid: loki
            queryType: ""
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: >-
                max by (attributes_route) (max_over_time({service_name="unknown_service", event_name="gateway_latency"}
                | json | cluster=".ava" | category=~"telemetry|log"
                | attributes_route_class="slow"
                | unwrap attributes_p95_ms [5m]))
              instant: true
              range: false
            relativeTimeRange:
              from: 300
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: max
              mode: byLabels
              includeLabels:
                - attributes_route
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [5000]
                  operator:
                    type: and
                  query:
                    params: [C]

      - uid: ava-ops-gw-latency-slow-error
        title: "Gateway latency: slow route p95 above 10000ms"
        condition: D
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: error
          ruleUID: ava-ops-gw-latency-slow-error
          metric: gateway_latency_route_slow_p95
          team: ava-ops
          notify_im: "false"
        annotations:
          summary: "Slow route {{ $labels.attributes_route }} p95 at {{ $values.C }} ms (threshold 10000 ms)"
          description: >-
            The slow route's gateway_latency bucket p95 stayed above 10000ms
            for 5 minutes — a slow-by-design route has degraded severely.
        data:
          - refId: A
            datasourceUid: loki
            queryType: ""
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: >-
                max by (attributes_route) (max_over_time({service_name="unknown_service", event_name="gateway_latency"}
                | json | cluster=".ava" | category=~"telemetry|log"
                | attributes_route_class="slow"
                | unwrap attributes_p95_ms [5m]))
              instant: true
              range: false
            relativeTimeRange:
              from: 300
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: max
              mode: byLabels
              includeLabels:
                - attributes_route
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [10000]
                  operator:
                    type: and
                  query:
                    params: [C]
