# Ava ops alert rules — Grafana Alerting, provisioned as code.
#
# Source of truth: this bind-mounted file. The deploy/lgtm Compose Grafana on
# gateway loopback 127.0.0.1:3003 loads it in place. Alert-rule provisioning
# does NOT hot-reload file changes (verified 2026-08-04), so deployment restarts
# the Docker Grafana service after a rules change.
#
# Evaluation engine: Grafana Unified Alerting over the LGTM read side
# (Task #1224): rules R1-R3, R5-R7 and R13 query Loki (the events stream — every
# event is one OTLP log line under {service_name="unknown_service"}, body =
# the full event JSON, so `| json` flattens it to labels). R4, R17, and the
# infrastructure/delivery rules R8-R12 and R14-R16 query Prometheus. Datasources are provisioned
# beside this file in datasources.yml (uids `loki` / `prometheus`). The
# retired Postgres events read path (#1197) is gone — nothing queries `ops`
# from these rules.
#
# Three Prometheus families and their label conventions:
# - APPLICATION metrics (R4) come from the event emitter's OTLP mirror and
#   carry `machine` / `agent_id` datapoint attributes.
# - GATEWAY PROCESS metrics (R17) are OTLP observable gauges/counters from Ava
#   code and carry fixed `machine` / `process` / `resource` attributes.
# - INFRASTRUCTURE metrics (R8-R12, R14-R16, issue #46) come from each
#   machine's OTel Collector sidecar (host/data-plane receivers plus its own
#   queue/drop/uptime scrape) and live
#   under `job="ava-infra"` with a `host` label = the OS hostname. `host` is
#   deliberately not `machine`: the two names can differ, and one label with
#   two meanings is worse than two labels. Names below were read off a live
#   Prometheus 3.13.2, not inferred from the OTLP names.
#
# R8-R11 wrap their ratio in PromQL `round(..., 0.001)`: the value is
# interpolated into the summary line that reaches IM, and "0.927" is a number a
# human reads where "0.927223987411" is not. It cannot change a verdict — the
# thresholds are two decimals wide.
#
# The infrastructure thresholds are DEPLOYMENT FACTS, not framework constants: what
# counts as "too much CPU" depends on box specs and co-tenancy (a PyTorch job
# legitimately saturates a machine). They live here, as rule config an
# operator edits, and the response to a firing instance is the
# cluster-operator agent's judgment — see conventions/runbook.md, "The
# operator's SRE loop".
#
# LogQL notes:
# - The OTel-detected labels (event_name, level, category, ...) are
#   structured metadata, NOT stream labels: {…} selectors cannot match them
#   (verified against the live cluster) — every rule pipelines `| json`
#   before any event-field filter.
# - `| json` flattens nested objects with underscore joins:
#   attributes.n -> attributes_n, attributes.age_s -> attributes_age_s,
#   attributes.action -> attributes_action. Numbers parse as numbers, so
#   `| attributes_age_s < 600` is a numeric comparison.
# - Every count wraps in sum(...) — the unknown_service family has >500
#   streams over a day, and an unaggregated count_over_time hits Loki's
#   per-query series cap.
#
# Threshold calibration (unchanged from the Postgres rules — the data is the
# same stream):
#   WARNING+ERROR+CRITICAL      ~5-19 / 5m normally, one 54/5m spike in 2h
#   sse_drop+event_log_drop     SUM(payload.n) — real dropped events, not
#                               report rows (2026-08-08: the rules + rollup
#                               counted report rows, understating the backlog
#                               by the 5s aggregation factor). 7d live data:
#                               p95 ~13 / 10m chronic drip; real degradations
#                               160-342 / 10m. Threshold 100 sits in the gap.
#   agent_restarted             bursts of ~15 / 15m, worst 54 / 15m
#   llm_usage.latency_ms p95    ~13s / 10m typical, worst bucket 158s
#   delivery_stalled fresh      (age_s < 600) 0 / 10m in the last 24h — any
#                               sustained fresh-stall burst means the delivery
#                               pipeline is newly stuck (the old-age backlog is
#                               chronic and not alert-worthy)
#   trace_degraded              any occurrence of
#                               recording_disabled_disk_watermark in 24h — a
#                               chronic-condition alert (disk over watermark),
#                               not a rate rule; fires once per episode,
#                               resolves 24h after the last event.
#   llm billing/quota           any occurrence of llm_provider_error with
#                               attributes.billing=true in 15m — not calibrated
#                               against a baseline because there is no healthy
#                               rate: one rejection means the key is dry.
#
# The `for` field keeps short evaluation windows from flapping: the condition
# must hold for the whole `for` duration before the alert fires. R13 sets it to
# 0m on purpose — see its own comment.
#
# Severity follows the alert-system vocabulary (Task #1224): critical /
# warning / error — all three push to IM, no gate. R4's Prometheus query
# returns no data during quiet periods (no llm_usage samples), so
# noDataState/execErrState stay pinned to OK — a datasource outage during
# maintenance must not fire every rule at once.
#
# The ruleUID label pins parse_rule_uid to the stable rule uid so synthetic
# DatasourceNoData/DatasourceError instances never collide on the
# alertname-derived dedup key.
apiVersion: 1
groups:
  - orgId: 1
    name: ava-ops
    folder: Ava
    interval: 1m
    rules:
      # ── R1: WARNING+ERROR spike (current 5m count > 3x the prior-15m rate, and ≥ 30) ──
      - uid: ava-ops-warning-error-spike
        title: "Event health: WARNING+ERROR+CRITICAL spike"
        condition: F
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: error
          ruleUID: ava-ops-warning-error-spike
          metric: warn_error_rate
          team: ava-ops
        annotations:
          summary: "WARNING+ERROR+CRITICAL event spike (current 5m count {{ $values.C }}, prior-15m expectation ≤ {{ $values.D }})"
          description: >-
            Events with level ∈ warning/error/critical reached {{ $values.C }} in
            the last 5 minutes, over 3x the prior-15m average rate ({{ $values.D }}
            per 5m). Likely a service failure or error loop. See the Grafana panel
            /grafana/d/ava-ops-main to locate the source.
        data:
          - refId: A
            datasourceUid: loki
            queryType: ""
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: >-
                sum(count_over_time({service_name="unknown_service"} | json |
                category=~"telemetry|log" | level=~"warning|error|critical" [5m]))
              instant: true
              queryType: instant
            relativeTimeRange:
              from: 300
              to: 0
          - refId: B
            datasourceUid: loki
            queryType: ""
            model:
              refId: B
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: >-
                sum(count_over_time({service_name="unknown_service"} | json |
                category=~"telemetry|log" | level=~"warning|error|critical" [15m] offset 5m))
              instant: true
              queryType: instant
            relativeTimeRange:
              from: 1200
              to: 300
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: B
              reducer: mean
          - refId: E
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: E
              datasource:
                type: __expr__
                uid: __expr__
              type: math
              expression: "$C > $D && $C >= 30"
          - refId: F
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: F
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: E
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [E]

      # ── R2: SSE / event-log drop backlog (real drops in 10m > 100; p95≈13, degraded 160-342) ──
      - uid: ava-ops-sse-drop-backlog
        title: "Event-pipeline drop backlog (sse_drop / event_log_drop)"
        condition: D
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: ava-ops-sse-drop-backlog
          metric: event_drop_rate
          team: ava-ops
        annotations:
          summary: "{{ $values.C }} real SSE/event-log drops in 10 minutes (threshold 100)"
          description: >-
            Events with event_name ∈ sse_drop / event_log_drop summed payload.n to
            {{ $values.C }} in the last 10 minutes (real drops; each report row
            carries the real drop count n since the previous report). SSE drops =
            degraded live view; event_log_drop = lost DB write-queue rows. Check
            the affected agent's event publisher / log-sink queue.
        data:
          - refId: A
            datasourceUid: loki
            queryType: ""
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: >-
                sum(sum_over_time({service_name="unknown_service"} | json |
                category="telemetry" | event_name=~"sse_drop|event_log_drop" |
                unwrap attributes_n [10m]))
              instant: true
              queryType: instant
            relativeTimeRange:
              from: 600
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [100]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R3: agent_restarted spike (>30 restarts in 15m, above the 7-day observed p95≈20) ──
      - uid: ava-ops-agent-restart-spike
        title: "Agent restart spike (agent_restarted)"
        condition: D
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: ava-ops-agent-restart-spike
          metric: agent_restart_rate
          team: ava-ops
        annotations:
          summary: "{{ $values.C }} agent restarts in 15 minutes (threshold 30)"
          description: >-
            Events with event_name=agent_restarted reached {{ $values.C }} in the
            last 15 minutes. A restart loop leaves agents unable to serve; check
            the restart cause (OOM / crash / manual restart).
        data:
          - refId: A
            datasourceUid: loki
            queryType: ""
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: >-
                sum(count_over_time({service_name="unknown_service"} | json |
                category="telemetry" | event_name="agent_restarted" [15m]))
              instant: true
              queryType: instant
            relativeTimeRange:
              from: 900
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [30]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R4: LLM latency p95 above threshold (10m window p95 > 60s; typical observed 13s, worst bucket 158s) ──
      # The p95 now comes from the OTLP metric mirror (Prometheus histogram),
      # not a SQL percentile — histogram_quantile over the latency buckets is
      # the same read the Insights Ops panel uses. The histogram only exists
      # while processes export OTLP metrics; absent data means NoData -> OK.
      - uid: ava-ops-llm-latency-p95
        title: "LLM latency p95 above threshold"
        condition: D
        for: 10m
        noDataState: OK
        execErrState: OK
        labels:
          severity: error
          ruleUID: ava-ops-llm-latency-p95
          metric: llm_latency_p95
          team: ava-ops
        annotations:
          summary: "LLM call latency p95 at {{ $values.C }} ms — value at last evaluation (threshold 60000 ms)"
          description: >-
            The latest p95 of llm_usage latency over the last 10 minutes is
            {{ $values.C }} ms. The alert fires after this value remains above
            60s for 10 minutes (histogram_quantile over the
            ava_llm_usage_latency histogram — an approximation of the exact
            SQL percentile, same as the Ops panel). Usually a provider-side
            failure or slow request pile-up. No alert fires when the metric is
            absent.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: >-
                histogram_quantile(0.95, sum by (le)
                (rate(ava_llm_usage_latency_milliseconds_bucket[10m])))
              instant: true
              range: false
            relativeTimeRange:
              from: 600
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [60000]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R5: delivery_stalled fresh backlog (>50 fresh stalls in 10m; current baseline 0) ──
      - uid: ava-ops-delivery-stalled-backlog
        title: "Delivery fresh backlog (delivery_stalled fresh)"
        condition: D
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: ava-ops-delivery-stalled-backlog
          metric: delivery_stall_rate
          team: ava-ops
        annotations:
          summary: "{{ $values.C }} fresh delivery stalls in 10 minutes (age_s < 600, threshold 50)"
          description: >-
            Events with event_name=delivery_stalled and age_s < 600 (fresh, not
            historical) reached {{ $values.C }} in the last 10 minutes. Old stalls
            (age_s in days) do not indicate a new failure; fresh stalls mean the
            delivery pipeline just got blocked.
        data:
          - refId: A
            datasourceUid: loki
            queryType: ""
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: >-
                sum(count_over_time({service_name="unknown_service"} | json |
                category="telemetry" | event_name="delivery_stalled" |
                attributes_age_s < 600 [10m]))
              instant: true
              queryType: instant
            relativeTimeRange:
              from: 600
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [50]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R6: event stream stalled (no events at all in 5m; meta-observability) ──
      # Semantics change with the LGTM cutover (Task #1224): the Postgres rule
      # measured the events TABLE's write freshness; that table is retired
      # (#1197), so the rule now probes the live stream in Loki with
      # absent_over_time — fires when NO event of any kind reached Loki in 5m.
      # That covers the emitter stall AND a broken OTLP export path (the
      # 2026-08-12 incident class), at the cost of no longer distinguishing
      # them. When the stream flows, the query returns no data (NoData -> OK).
      - uid: ava-ops-events-freshness
        title: "Event stream stalled (no events in Loki)"
        condition: D
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: error
          ruleUID: ava-ops-events-freshness
          metric: events_freshness
          team: ava-ops
        annotations:
          summary: "No events reached Loki in the last 5 minutes"
          description: >-
            absent_over_time reports the events stream
            ({service_name="unknown_service"}) produced no log lines in the
            last 5 minutes. The largest measured silent gap over 7d was 60s
            (the events_maintenance fast loop + agent activity are structural
            periodic writers), so 5m has 5x headroom. A stalled stream means
            the emitter/export path is down — the exact outage that made Loki
            go dark on 2026-08-12 (OTLP preflight bug). When the stream flows
            the query returns no data (NoData -> OK). If Loki itself is down,
            the rule errors (execErrState OK is silent) and the health-probe
            chain covers it.
        data:
          - refId: A
            datasourceUid: loki
            queryType: ""
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: >-
                absent_over_time({service_name="unknown_service"}[5m])
              instant: true
              queryType: instant
            relativeTimeRange:
              from: 300
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R7: trace recording auto-degraded (disk over watermark; ANY occurrence in 24h) ──
      # The 2026-08-07..10 incident class: 207 recording_disabled_disk_watermark
      # events over 3 days, nobody noticed — the drip sat under R1's spike
      # threshold forever. This rule is a chronic-condition alert, not a rate
      # rule: any occurrence in the trailing 24h means the observability
      # pipeline is degraded RIGHT NOW (every event = one agent start that
      # skipped span recording). The 24h window keeps it firing across the
      # event drip (observed 1-3h gaps while a machine is over watermark) and
      # resolves 24h after the last event — one onset + one recovery IM per
      # episode instead of one per event. error severity: silently-off
      # observability is the incident class this alert exists to end.
      - uid: ava-ops-trace-disk-watermark
        title: "Trace recording disabled (data disk over watermark)"
        condition: D
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: error
          ruleUID: ava-ops-trace-disk-watermark
          metric: trace_degraded
          team: ava-ops
        annotations:
          summary: "Trace recording auto-disabled — data disk over watermark ({{ $values.C }} degradation events in 24h)"
          description: >-
            Events with attributes.action=recording_disabled_disk_watermark
            (event_name=trace, category=telemetry) reached {{ $values.C }} in
            the last 24 hours. Each event = one agent start that skipped span
            recording because its data disk is over AVA_TRACE_DISK_WATERMARK
            (default 0.9): the mirror can never fill the disk, but spans are
            not recorded — an observability blind spot (2026-08-07..10: 207
            events over 3 days, unnoticed). Triage: `df -h` on the affected
            machine (the event carries usage_fraction/free_gb), free space,
            then confirm the events stop. Resolves automatically 24h after the
            last degradation event. If the export path fails, new events stop
            landing and this rule goes quiet with them — that outage class is
            covered by R6 (event stream stalled) + the health-probe chain.
        data:
          - refId: A
            datasourceUid: loki
            queryType: ""
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: >-
                sum(count_over_time({service_name="unknown_service"} | json |
                category="telemetry" | event_name="trace" |
                attributes_action="recording_disabled_disk_watermark" [24h]))
              instant: true
              queryType: instant
            relativeTimeRange:
              from: 1440
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R8: host CPU saturated (issue #46) ──
      # 1 - idle, averaged over the machine's cores. 0.90 sustained for 15m is
      # the shipped default: short bursts are normal work (a build, an eval
      # sweep), a quarter-hour pinned is the box having no headroom left for
      # anything else. Tune per deployment — this is a machine-spec fact.
      - uid: ava-ops-host-cpu-saturated
        title: "Host CPU saturated"
        condition: D
        for: 15m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: ava-ops-host-cpu-saturated
          metric: host_cpu
          team: ava-ops
        annotations:
          summary: "{{ $labels.host }} CPU at {{ $values.C }} (threshold 0.90) for 15m"
          description: >-
            Non-idle CPU on {{ $labels.host }} has averaged
            {{ $values.C }} (fraction of all cores) for 15 minutes. This is
            not a limit the kernel enforces — a training or eval job may
            legitimately own the box. The operator decides: identify the
            consumer (Grafana /grafana/d/ava-host-dataplane, host row), then
            investigate, hibernate agents, or leave it alone.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: >-
                round(1 - avg by (host)
                (system_cpu_utilization_ratio{state="idle"}), 0.001)
              instant: true
              range: false
            relativeTimeRange:
              from: 900
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0.9]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R9: host memory pressure (issue #46) ──
      # state="used" is the OTel host_metrics equivalent of the status page's
      # pressure figure (total - available): reclaimable cache is NOT counted
      # as used, so 0.90 here means real pressure, not a warm page cache.
      - uid: ava-ops-host-memory-pressure
        title: "Host memory pressure"
        condition: D
        for: 15m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: ava-ops-host-memory-pressure
          metric: host_memory
          team: ava-ops
        annotations:
          summary: "{{ $labels.host }} memory at {{ $values.C }} used (threshold 0.90) for 15m"
          description: >-
            Used memory on {{ $labels.host }} has held at {{ $values.C }} of
            RAM for 15 minutes (reclaimable cache excluded). Sustained
            pressure precedes swapping and the OOM killer, whose visible form
            is an agent restart spike (R3). Check the per-agent footprint and
            consider hibernating idle agents.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: >-
                round(avg by (host)
                (system_memory_utilization_ratio{state="used"}), 0.001)
              instant: true
              range: false
            relativeTimeRange:
              from: 900
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0.9]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R10: per-volume disk watermark (issue #46) ──
      # The realistic killer: the trace-v2 incident wrote 31 GB/h of mirror
      # before content stripping landed, and the only signal was agents
      # silently disabling span recording (R7 — a CONSEQUENCE alert). This
      # rule fires on the cause, per mountpoint, so the pg data dir, the
      # traces mirror and the LGTM host's Loki volumes are all covered by
      # whichever filesystem carries them. One instance per (host, mountpoint):
      # on macOS the volumes of one APFS container all report the container's
      # fullness, so a single full disk legitimately fires twice.
      - uid: ava-ops-host-disk-watermark
        title: "Filesystem over watermark"
        condition: D
        for: 15m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: ava-ops-host-disk-watermark
          metric: host_disk
          team: ava-ops
        annotations:
          summary: "{{ $labels.host }} {{ $labels.mountpoint }} at {{ $values.C }} full (threshold 0.90)"
          description: >-
            Filesystem {{ $labels.mountpoint }} on {{ $labels.host }} is
            {{ $values.C }} full. 0.90 is also AVA_TRACE_DISK_WATERMARK's
            default, so crossing it silently degrades trace recording on that
            machine (R7 reports that consequence). Triage: find the growth —
            the traces mirror ($AVA_HOME/traces), the Postgres data dir, or
            the LGTM host's Loki/Prometheus volumes — then prune or raise the
            volume.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: >-
                round(max by (host, mountpoint)
                (system_filesystem_utilization_ratio), 0.001)
              instant: true
              range: false
            relativeTimeRange:
              from: 900
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0.9]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R11: Postgres connection saturation (issue #46) ──
      # Backends against the server's own max_connections, both read from the
      # postgresql receiver. This is where pool saturation surfaces: PgBouncer
      # itself has no OTel contrib receiver (its SHOW STATS admin protocol is
      # not the Postgres wire protocol), and adding a postgres_exporter /
      # pgbouncer_exporter binary per machine is the footprint the sidecar
      # architecture exists to avoid. Backends piling up means either the
      # pooler is passing through more than it should or the pooler is gone
      # and every process is dialing Postgres directly.
      - uid: ava-ops-pg-connection-saturation
        title: "Postgres connection saturation"
        condition: D
        for: 10m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: ava-ops-pg-connection-saturation
          metric: pg_connections
          team: ava-ops
        annotations:
          summary: "{{ $labels.host }} Postgres backends at {{ $values.C }} of max_connections (threshold 0.80)"
          description: >-
            Open Postgres backends on {{ $labels.host }} are at
            {{ $values.C }} of the server's max_connections. Past 1.0 new
            connections are refused and every process that needs the database
            fails at once. Check the PgBouncer pooler is up and pooling
            (AVA_PGBOUNCER_ENABLED), and look for a process leaking sessions.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: >-
                round(max by (host) (postgresql_backends)
                / max by (host) (postgresql_connection_max), 0.001)
              instant: true
              range: false
            relativeTimeRange:
              from: 600
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0.8]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R12: Redis memory (issue #46) ──
      # The redis receiver reports used memory but not maxmemory, so this is
      # an absolute byte threshold — 2 GiB, a deployment fact about the box's
      # RAM, tuned here. Ava's Redis carries the events pub/sub channel and
      # short-lived caches; a steadily climbing footprint is a leak, and once
      # maxmemory is reached the eviction of live keys (redis_keys_evicted_total,
      # on the dashboard) starts dropping cluster state.
      - uid: ava-ops-redis-memory
        title: "Redis memory above threshold"
        condition: D
        for: 15m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: ava-ops-redis-memory
          metric: redis_memory
          team: ava-ops
        annotations:
          summary: "{{ $labels.host }} Redis using {{ $values.C }} bytes (threshold 2 GiB)"
          description: >-
            Redis on {{ $labels.host }} is holding {{ $values.C }} bytes for
            15 minutes, above the 2 GiB deployment threshold. Inspect the
            keyspace for an unbounded producer; the events channel is a
            stream, not a store, so a growing resident set is normally a
            cache that never expires.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: >-
                max by (host) (redis_memory_used_bytes)
              instant: true
              range: false
            relativeTimeRange:
              from: 900
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [2147483648]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R13: LLM provider billing / quota failure (any occurrence in 15m) ──
      # The one alert in this file that is deliberately NOT threshold-gated: an
      # out-of-credit key fails EVERY turn on it, the operator action (top up /
      # raise the quota) is the same whether it happened once or a thousand
      # times, and nothing else in the fleet can proceed meanwhile — so the
      # first occurrence is already the whole incident. Before this rule the
      # only signal was R1's WARNING+ERROR spike, which needs 30 events in 5m
      # before it says anything, and says "event spike", not "the key is dry".
      #
      # `for: 0m` (every sibling waits 5-15m) follows from the same reasoning:
      # there is no flap to damp — the condition is a count over a 15m window,
      # so it stays true for 15m after the last failure and then resolves. One
      # episode = one firing IM + one resolved IM, the same dedup semantics the
      # siblings get from their `for` window (alerts are deduped on
      # fingerprint x starts_at by shared/alerts.py, not on `for`).
      #
      # `billing` is emitted by agent/graph/_llm_errors.py from
      # shared/lm/errors.py's cross-provider predicate (HTTP 402, plus a
      # per-vendor vocabulary matched against the response body's error.type AND
      # error.code — DashScope reports the specific reason only in the latter) —
      # the rule never enumerates statuses itself, so a provider added there is
      # covered here for free. Grouping by vendor+model makes one dead key one
      # alert instance that names itself; both labels come off the
      # json-flattened event body.
      #
      # critical, not error: this is the only rule whose condition means the
      # agents cannot run at all until a human spends money.
      - uid: ava-ops-llm-billing-quota
        title: "LLM provider billing/quota failure"
        condition: D
        for: 0m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
          ruleUID: ava-ops-llm-billing-quota
          metric: llm_billing_failure
          team: ava-ops
        annotations:
          summary: "LLM API billing/quota failure — the {{ $labels.attributes_vendor }} key for {{ $labels.attributes_model }} is out of credit or quota-throttled ({{ $values.C }} rejections in 15m)"
          description: >-
            Events with event_name=llm_provider_error and attributes.billing=true
            reached {{ $values.C }} in the last 15 minutes for model
            {{ $labels.attributes_model }} (vendor
            {{ $labels.attributes_vendor }}). The provider refused with HTTP 402
            or its own insufficient-balance / quota code — no retry can
            clear it, so every turn on this key fails until the account is
            topped up or the quota raised. Fires on the FIRST occurrence by
            design (no spike threshold): one rejection already means the fleet
            is stalled on this model. Triage: top up the vendor account, or
            point AVA_LLM_MODEL at a model whose key still has credit; the rule
            resolves 15m after the last rejection.
        data:
          - refId: A
            datasourceUid: loki
            queryType: ""
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: >-
                sum by (attributes_vendor, attributes_model)
                (count_over_time({service_name="unknown_service"} | json |
                category="telemetry" | event_name="llm_provider_error" |
                attributes_billing="true" [15m]))
              instant: true
              queryType: instant
            relativeTimeRange:
              from: 900
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R14: collector exporter queue pressure (current ratio > 0.80) ──
      # The queue gauges are current state. This deliberately does NOT use the
      # process-lifetime enqueue-failure counter: one old outage must resolve
      # after the route recovers. One instance per host/exporter/data_type says
      # which machine and signal path is blocked.
      - uid: ava-ops-otelcol-queue-pressure
        title: "OTel Collector exporter queue pressure"
        condition: D
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: error
          ruleUID: ava-ops-otelcol-queue-pressure
          metric: otelcol_queue
          team: ava-ops
        annotations:
          summary: "{{ $labels.host }} collector {{ $labels.exporter }} {{ $labels.data_type }} queue at {{ $values.C }} (threshold 0.80)"
          description: >-
            The OTel Collector exporter queue on {{ $labels.host }} for
            {{ $labels.exporter }} ({{ $labels.data_type }}) has stayed above
            80% capacity for 5 minutes. The destination or runner-to-gateway
            relay is not keeping up. Check gateway reachability, the collector
            receiver, and the LGTM backend before the queue fills and rejects
            new telemetry.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: >-
                round(max by (host, exporter, data_type)
                (otelcol_exporter_queue_size)
                / clamp_min(max by (host, exporter, data_type)
                (otelcol_exporter_queue_capacity), 1), 0.001)
              instant: true
              range: false
            relativeTimeRange:
              from: 300
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0.8]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R15: newly rejected telemetry (enqueue-failure delta > 0 in 5m) ──
      # These are monotonic counters. `increase` is load-bearing: comparing an
      # absolute value would create a permanent alert after the first failure
      # until the collector restarted.
      - uid: ava-ops-otelcol-enqueue-failures
        title: "OTel Collector rejected telemetry"
        condition: D
        for: 0m
        noDataState: OK
        execErrState: OK
        labels:
          severity: error
          ruleUID: ava-ops-otelcol-enqueue-failures
          metric: otelcol_enqueue_failed
          team: ava-ops
        annotations:
          summary: "{{ $labels.host }} collector {{ $labels.exporter }} rejected {{ $values.C }} telemetry items in 5m"
          description: >-
            The OTel Collector on {{ $labels.host }} could not enqueue
            {{ $values.C }} log records, metric points, or spans for exporter
            {{ $labels.exporter }} in the last 5 minutes. This is active data
            loss, not historical backlog. Restore the runner-to-gateway relay
            or the gateway-local backend and verify the queue drains.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: >-
                sum by (host, exporter)
                (increase({__name__=~"otelcol_exporter_enqueue_failed_(log_records|metric_points|spans)_total"}[5m]))
              instant: true
              range: false
            relativeTimeRange:
              from: 300
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R16: recently-seen collector stopped reporting ──
      # noDataState=OK cannot name one missing host. This set subtraction keeps
      # the per-host identity: hosts observed in 24h but absent for 5m. The
      # instance naturally retires after 24h; machine-heartbeat alerting owns
      # permanent fleet membership, while this rule owns the collector path.
      - uid: ava-ops-otelcol-host-silent
        title: "OTel Collector stopped reporting"
        condition: D
        # The query's 5m absence window is already the debounce. A second 5m
        # `for` would turn the documented 5m detection into ~10m.
        for: 0m
        noDataState: OK
        execErrState: OK
        labels:
          severity: error
          ruleUID: ava-ops-otelcol-host-silent
          metric: otelcol_silence
          team: ava-ops
        annotations:
          summary: "{{ $labels.host }} collector has not reported for 5 minutes"
          description: >-
            Host {{ $labels.host }} reported OTel Collector uptime within the
            last 24 hours but no sample arrived in the last 5 minutes. The
            collector may be down or its runner-to-gateway metrics relay may
            be broken. Check the local ava-otel-collector session and the
            authenticated gateway OTLP receiver.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: >-
                max by (host) (max_over_time(otelcol_process_uptime_total[24h]))
                unless on(host)
                max by (host) (max_over_time(otelcol_process_uptime_total[5m]))
              instant: true
              range: false
            relativeTimeRange:
              from: 86400
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R17: sustained Grafana proxy capacity rejection ──
      # The source is a process-local observable counter: collection reads an
      # immutable snapshot and never emits a log/event or queries LGTM. A
      # five-minute `for` on a five-minute delta requires continuing overflow,
      # rather than paging on one transient browser burst.
      - uid: ava-ops-grafana-proxy-capacity
        title: "Grafana proxy capacity saturated"
        condition: D
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: ava-ops-grafana-proxy-capacity
          metric: grafana_proxy_capacity
          team: ava-ops
        annotations:
          summary: "{{ $labels.machine }} Grafana {{ $labels.resource }} capacity rejected {{ $values.C }} requests in 5m"
          description: >-
            The Grafana proxy on {{ $labels.machine }} has continuously
            rejected {{ $labels.resource }} reservations for 5 minutes. Check
            active/capacity gauges and browser or dashboard fan-out before
            raising the bounded process-local capacity.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: >-
                sum by (machine, resource)
                (increase(ava_grafana_proxy_capacity_rejected_total[5m]))
              instant: true
              range: false
            relativeTimeRange:
              from: 300
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [5]
                  operator:
                    type: and
                  query:
                    params: [C]
