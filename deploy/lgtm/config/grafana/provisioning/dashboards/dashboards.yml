apiVersion: 1

providers:
  - name: ava
    orgId: 1
    folder: Ava
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      # The provider resolves relative paths against the process CWD, not
      # GF_PATHS_PROVISIONING; the native launcher sets the absolute path via
      # this env var (runtime.env).
      path: $__env{GRAFANA_PROVISIONING_PATH}
