# OTel Collector sidecar — one per machine, the ONLY OTLP entry Ava agents see.
#
# Generated at converge from this template (cli/commands/_otel_collector.py):
# the dollar placeholders below are baked from this unit's settings, so the file
# is static at runtime — no env substitution dependency on the session env.
#
# Architecture (task #1266, user ruling 2026-08-14): every agent process on
# this host sends OTLP/HTTP to 127.0.0.1:4318; this collector fans out
#   traces  -> Tempo OTLP/HTTP      (TEMPO_ENDPOINT placeholder)
#   logs    -> Loki native OTLP     (LOKI_BASE placeholder, /v1/logs appended)
#   metrics -> Prometheus OTLP recv (PROM_BASE placeholder, /v1/metrics appended)
# and mirrors traces to a local JSONL ($AVA_HOME/traces/spans.jsonl, rotated)
# so agents can grep spans without any backend. file_storage backs every
# fan-out exporter's sending queue: a backend outage buffers on disk (the
# queue survives collector restarts), and only a queue overflow sheds — the
# mirror keeps everything, `ava trace ship` replays the gap straight to Tempo.
#
# The sidecar also scrapes the traditional SRE layer (issue #46) into the same
# metrics fan-out: `host_metrics` on every machine, plus `postgresql` + `redis`
# against this cluster's OWN data plane on a gateway-capable unit (a pure
# agent-runner dials the gateway's pg/redis remotely, so scraping from there
# would only duplicate the gateway's series — those two receivers are omitted
# from a runner's rendered config entirely).
receivers:
  otlp:
    # OTLP/HTTP only — every Ava producer speaks OTLP/HTTP (shared/
    # telemetry_otlp.py rejects non-http schemes); no dead gRPC receiver.
    protocols:
      http:
        endpoint: 127.0.0.1:4318

  # ── The traditional SRE layer (issue #46) ────────────────────────────────
  # Host metrics come from the collector's own receiver, not a node_exporter
  # sidecar: the contrib distribution is already pinned and supervised here, so
  # this is zero additional binaries. Prometheus is then the ONE time-series
  # store for host data — there is no second retained history anywhere (the
  # status surfaces keep a live one-shot psutil reading and nothing more).
  host_metrics:
    collection_interval: 30s
    scrapers:
      cpu:
        metrics:
          # system.cpu.time is a per-core cumulative counter in 8 states; the
          # utilization ratio is what an operator reads and what the alert
          # rules evaluate, so only that one is enabled.
          system.cpu.time:
            enabled: false
          system.cpu.utilization:
            enabled: true
      load:
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      disk:
      filesystem:
        metrics:
          system.filesystem.utilization:
            enabled: true
        # Synthetic mounts carry no operator signal and dominate the series
        # count on macOS (a dozen /System/Volumes/* entries). What survives is
        # the real root volume plus, on macOS, the data volume that actually
        # holds $AVA_HOME — the two the disk watermark alert is about.
        exclude_fs_types:
          fs_types: [autofs, devfs, nullfs, overlay, squashfs, tmpfs]
          match_type: strict
        exclude_mount_points:
          mount_points:
            - /dev
            - /private/var/vm
            - /System/Volumes/Hardware
            - /System/Volumes/iSCPreboot
            - /System/Volumes/Preboot
            - /System/Volumes/Update
            - /System/Volumes/VM
            - /System/Volumes/xarts
          match_type: strict
      network:
        # macOS carries ~30 virtual interfaces (awdl/llw/utun/bridge/anpi/…)
        # and each one multiplies four per-direction counters: unfiltered, the
        # network scraper alone was 248 of this machine's ~350 series and none
        # of them describes a link an operator can act on. Physical + tunnel
        # interfaces survive; on Linux the exclusion list simply matches
        # nothing.
        # (the doubled dollar is the string.Template escape for a literal
        # end-anchor — this file goes through Template.substitute at converge.)
        exclude:
          interfaces:
            ["^(awdl|llw|utun|bridge|gif|stf|ap|anpi|p2p|vmenet|XHC)[0-9]*$$"]
          match_type: regexp
$DATA_PLANE_RECEIVERS
processors:
  # memory_limiter runs FIRST in every pipeline: under memory pressure it
  # refuses new data (producers retry / the JSONL mirror keeps everything)
  # instead of letting the collector balloon on a 16GB shared box.
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  batch:
    send_batch_size: 512
    send_batch_max_size: 1024
    timeout: 5s

  # The infra pipeline's extra processors. host_metrics/postgresql/redis
  # carry no host identity of their own, so detection supplies host.name and
  # the transform copies it onto every datapoint: a resource attribute would
  # land in Prometheus's `target_info` instead of on the series, which no
  # alert expression can select on. The label is `host` (the OS hostname) —
  # deliberately NOT `machine` (the Ava machine name that app metrics carry),
  # because the two can differ and one label with two meanings is worse than
  # two labels.
  resource_detection/host:
    detectors: [system]
    system:
      hostname_sources: [os]
  # Prometheus's OTLP receiver derives `job` from service.name; without one the
  # infra series would land under a synthesized unknown_service job. Pinning it
  # makes `{job="ava-infra"}` the one selector for everything on this layer.
  resource/infra:
    attributes:
      - key: service.name
        value: ava-infra
        action: upsert
  transform/host_label:
    metric_statements:
      - context: datapoint
        statements:
          - set(attributes["host"], resource.attributes["host.name"])

extensions:
  file_storage:
    directory: $AVA_HOME/otel-collector/queue
    create_directory: true
    timeout: 1s
    # fsync off by default: the queue is a buffer, not the durable record —
    # the JSONL mirror is. Durability comes from the mirror + replay.

exporters:
  otlphttp/tempo:
    endpoint: $TEMPO_ENDPOINT
    tls:
      insecure: true
    sending_queue:
      enabled: true
      queue_size: 5000
      storage: file_storage
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      # Unlimited retry: never give up on a batch while the backend is down —
      # overflow is the only shed, and the mirror covers it.
      max_elapsed_time: 0s
  otlphttp/loki:
    endpoint: $LOKI_BASE
    tls:
      insecure: true
    sending_queue:
      enabled: true
      queue_size: 5000
      storage: file_storage
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 0s
  otlphttp/prometheus:
    endpoint: $PROM_BASE
    tls:
      insecure: true
    # Metrics differ from traces/logs: cumulative counters are self-healing —
    # the next export carries the full cumulative value — so buffering stale
    # datapoints on disk forever is wrong (they would land out of order and
    # add nothing). Small in-memory queue, bounded retry, no file_storage.
    sending_queue:
      enabled: true
      queue_size: 1000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 15m
  # Local JSONL mirror — the grep surface (user ruling: "agent debug 时 grep
  # 最方便"). One line per export batch, each line a standard OTLP/JSON
  # ExportTraceServiceRequest. Rotation (lumberjack) gives append semantics
  # across collector restarts: the ACTIVE file is never truncated, and
  # max_days / max_backups bound the directory. `spans.jsonl` -> rotated
  # `spans-<ISO-timestamp>.jsonl` on rotation.
  file/traces:
    path: $AVA_HOME/traces/spans.jsonl
    rotation:
      max_megabytes: 256
      max_days: $RETENTION_DAYS
      max_backups: 16

service:
  extensions: [file_storage]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/tempo, file/traces]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/prometheus]
    # Infra metrics ride their own pipeline so the host-identity processors
    # touch only them: app metrics already carry `machine`/`agent_id`
    # datapoint attributes from the emitter and must not be relabelled.
    metrics/infra:
      receivers: [host_metrics$DATA_PLANE_PIPELINE_RECEIVERS]
      processors:
        [
          memory_limiter,
          resource_detection/host,
          resource/infra,
          transform/host_label,
          batch,
        ]
      exporters: [otlphttp/prometheus]
