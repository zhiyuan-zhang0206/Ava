# OTel Collector sidecar — one per machine, the ONLY OTLP entry Ava agents see.
#
# Generated at converge from this template (cli/commands/_otel_collector.py):
# the dollar placeholders below are baked from this unit's settings, so the file
# is static at runtime — no env substitution dependency on the session env.
#
# Architecture: every agent process sends OTLP/HTTP to its local
# 127.0.0.1:4318 receiver. On a gateway/single-box collector the pipelines fan
# out to Tempo/Loki/Prometheus — loopback by default, or the remote observatory
# station's endpoints when AVA_OBSERVABILITY_URL is set (two-state render,
# task #1791). A pure runner keeps the same exporter
# component IDs and queues but points them at the gateway collector's separate,
# authenticated remote receiver; the gateway then fans those batches into its
# loopback backends. Backend ports never need an off-box bind.
# Every collector also mirrors locally produced traces to JSONL
# ($AVA_HOME/traces/spans.jsonl, rotated), so agents can grep spans without a
# backend. Trace/log exporters use bounded file_storage queues; metrics use a
# bounded in-memory queue. Every exporter rejects the newest batch immediately
# when its queue is full, bounds each send attempt to 5s, and retries for at
# most 15m before dropping with collector failure metrics. Cumulative metrics
# repair on a later successful sample. The independent file/traces exporter is
# not queued behind remote delivery and remains the local durable trace sink.
# `ava trace ship` replays a mirrored gap without re-entering the local mirror.
#
# The sidecar also scrapes the traditional SRE layer (issue #46) into the same
# metrics fan-out: `host_metrics` on every machine, plus `postgresql` + `redis`
# against this cluster's OWN data plane on a gateway-capable unit (a pure
# agent-runner dials the gateway's pg/redis remotely, so scraping from there
# would only duplicate the gateway's series — those two receivers are omitted
# from a runner's rendered config entirely).
receivers:
  otlp:
    # OTLP/HTTP only — every Ava producer speaks OTLP/HTTP (shared/
    # telemetry_otlp.py rejects non-http schemes); no dead gRPC receiver.
    # The receiver endpoint is baked from AVA_TELEMETRY_OTLP_PORT at converge
    # (default 127.0.0.1:4318 — the standard OTLP port; single source in
    # shared/config/observability.py, task #1945).
    protocols:
      http:
        endpoint: $OTLP_RECEIVER_ENDPOINT
$REMOTE_OTLP_RECEIVER

  # ── The traditional SRE layer (issue #46) ────────────────────────────────
  # Host metrics come from the collector's own receiver, not a node_exporter
  # sidecar: the contrib distribution is already pinned and supervised here, so
  # this is zero additional binaries. Prometheus is then the ONE time-series
  # store for host data — there is no second retained history anywhere (the
  # status surfaces keep a live one-shot psutil reading and nothing more).
  host_metrics:
    collection_interval: 30s
    scrapers:
      cpu:
        metrics:
          # system.cpu.time is a per-core cumulative counter in 8 states; the
          # utilization ratio is what an operator reads and what the alert
          # rules evaluate, so only that one is enabled.
          system.cpu.time:
            enabled: false
          system.cpu.utilization:
            enabled: true
      load:
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      disk:
      filesystem:
        metrics:
          system.filesystem.utilization:
            enabled: true
        # Synthetic mounts carry no operator signal and dominate the series
        # count on macOS (a dozen /System/Volumes/* entries). What survives is
        # the real root volume plus, on macOS, the data volume that actually
        # holds $AVA_HOME — the two the disk watermark alert is about.
        exclude_fs_types:
          fs_types: [autofs, devfs, nullfs, overlay, squashfs, tmpfs]
          match_type: strict
        exclude_mount_points:
          mount_points:
            - /dev
            - /private/var/vm
            - /System/Volumes/Hardware
            - /System/Volumes/iSCPreboot
            - /System/Volumes/Preboot
            - /System/Volumes/Update
            - /System/Volumes/VM
            - /System/Volumes/xarts
          match_type: strict
      network:
        # macOS carries ~30 virtual interfaces (awdl/llw/utun/bridge/anpi/…)
        # and each one multiplies four per-direction counters: unfiltered, the
        # network scraper alone was 248 of this machine's ~350 series and none
        # of them describes a link an operator can act on. Physical + tunnel
        # interfaces survive; on Linux the exclusion list simply matches
        # nothing.
        # (the doubled dollar is the string.Template escape for a literal
        # end-anchor — this file goes through Template.substitute at converge.)
        exclude:
          interfaces:
            ["^(awdl|llw|utun|bridge|gif|stf|ap|anpi|p2p|vmenet|XHC)[0-9]*$$"]
          match_type: regexp

  # Collector queue depth/capacity and enqueue/send failure counters are part
  # of the delivery contract, not debug-only internals. Scrape the pinned
  # collector's loopback Prometheus endpoint and relay the cumulative evidence
  # with the rest of this host's infra metrics. When the relay is down the next
  # successful scrape still carries monotone enqueue-failure counters.
  prometheus/otelcol:
    config:
      scrape_configs:
        - job_name: ava-otel-collector
          scrape_interval: 30s
          static_configs:
            - targets: [localhost:$SELF_METRICS_PORT]

  # ── Session-log tailing (2026-08-23 cutover; replaces promtail) ──────────
  # Agent shell transcripts and service stdout use separate, disjoint
  # receivers. Agent main logs are banner-only here and are deliberately
  # absent: their identical prefixes collide under filelog's content
  # fingerprinting, while their structured records already arrive over OTLP.
  # start_at: end = no backfill; offsets persist in file_storage/logoffsets so
  # a restart does not re-read.
  #
  # The 10s poll interval cuts discovery churn 50x. A positive archive count
  # lets EOF files reuse their metadata instead of creating a reader every
  # poll, while the concurrent-file cap bounds the discovery set.
  filelog/sessions:
    include:
      - $AVA_HOME/logs/ava-agent-*-shell-*.out.log
    start_at: end
    include_file_name: true
    include_file_path: false
    storage: file_storage/logoffsets
    poll_interval: 10s
    polls_to_archive: 50
    max_concurrent_files: 200
  filelog/services:
    include:
      - $AVA_HOME/logs/*.out.log
    # Exclude all agent output so this receiver cannot overlap the shell-only
    # receiver. The collector's own stdout is excluded to prevent exported log
    # diagnostics feeding back into the collector.
    exclude:
      - $AVA_HOME/logs/ava-agent-*.out.log
      - $AVA_HOME/logs/ava-otel-collector.out.log
    start_at: end
    include_file_name: true
    include_file_path: false
    storage: file_storage/logoffsets
    poll_interval: 10s
    polls_to_archive: 50
    max_concurrent_files: 200
  filelog/orchestration:
    include:
      - $AVA_HOME/logs/updater-*.log
      - $AVA_HOME/logs/rollout-*.log
    start_at: end
    include_file_name: true
    include_file_path: false
    storage: file_storage/logoffsets
$DATA_PLANE_RECEIVERS
processors:
  # memory_limiter runs FIRST in every pipeline: under memory pressure it
  # returns retryable backpressure and bounds shedding instead of letting the
  # collector balloon on a 16GB shared box. Because it precedes file/traces,
  # data rejected here is not promised to reach the JSONL mirror.
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  # The LGTM host accepts legacy records without a cluster dimension, but a
  # co-located home that reaches its local receiver must never pollute this
  # cluster's backends. Keep memory_limiter first; reject mismatches second.
  filter/cluster_allow:
    error_mode: ignore
    traces:
      span:
        - 'resource.attributes["cluster"] != nil and resource.attributes["cluster"] != "$CLUSTER_LABEL"'
    metrics:
      metric:
        - 'resource.attributes["cluster"] != nil and resource.attributes["cluster"] != "$CLUSTER_LABEL"'
    logs:
      log_record:
        - 'resource.attributes["cluster"] != nil and resource.attributes["cluster"] != "$CLUSTER_LABEL"'
  # Session-log labeling (filelog receivers; replaces promtail's per-file
  # service label): service.name <- the file's session name (strip .out.log /
  # the -<epoch> suffix), guarded so event logs (no log.file.name) pass
  # through untouched.
  transform/filelog_service:
    log_statements:
      - context: log
        conditions:
          - attributes["log.file.name"] != nil
        statements:
          - set(attributes["tmp_svc"], attributes["log.file.name"])
          - replace_pattern(attributes["tmp_svc"], "\\.out\\.log$$", "")
          - replace_pattern(attributes["tmp_svc"], "^(updater|rollout)-[0-9]+$$", "$$1")
          - set(resource.attributes["service.name"], attributes["tmp_svc"])
          - delete_key(attributes, "tmp_svc")
  batch:
    send_batch_size: 512
    send_batch_max_size: 1024
    timeout: 5s

  # The infra pipeline's extra processors. host_metrics/postgresql/redis carry
  # no host identity of their own, so detection supplies host.name and the
  # transform puts both identities on every datapoint: `host` is the OS
  # hostname (physical identity; the fleet's Windows box reports zzy-lenovo
  # while its Ava name is win), and `machine_name` is the Ava roster identity
  # baked from this unit at converge via $MACHINE_NAME (macmini / macbook-air /
  # win / wsl). One label per meaning; dashboards and alert rules group by
  # `machine_name`. App metrics already carry `machine` / `agent_id`, and this
  # transform cannot touch them because it sits on the infra pipeline only.
  # Datapoint attributes are required: resource attributes land in
  # Prometheus's `target_info`, where alert expressions cannot select on them.
  resource_detection/host:
    detectors: [system]
    system:
      hostname_sources: [os]
  # Prometheus's OTLP receiver derives `job` from service.name; without one the
  # infra series would land under a synthesized unknown_service job. Pinning it
  # makes `{job="ava-infra"}` the one selector for everything on this layer.
  resource/infra:
    attributes:
      - key: service.name
        value: ava-infra
        action: upsert
  transform/host_label:
    metric_statements:
      - context: datapoint
        statements:
          - set(attributes["host"], resource.attributes["host.name"])
          - set(attributes["machine_name"], $MACHINE_NAME)
          # Interim fix (2026-08-28, #1818): postgresqlreceiver keys its rows by
          # resource attributes; Prometheus 3.x's OTLP receiver keeps resource
          # attrs out of series labels (they land in target_info), so all index
          # rows collapse into one series -> "duplicate sample" 400 -> whole
          # infra batch dropped. Copy the distinguishing dims to datapoints.
          - set(attributes["postgresql.database.name"], resource.attributes["postgresql.database.name"]) where resource.attributes["postgresql.database.name"] != nil
          - set(attributes["postgresql.table.name"], resource.attributes["postgresql.table.name"]) where resource.attributes["postgresql.table.name"] != nil
          - set(attributes["postgresql.index.name"], resource.attributes["postgresql.index.name"]) where resource.attributes["postgresql.index.name"] != nil
  # Loki can promote OTLP resource attributes, not log attributes. Copy the
  # bounded event dimensions before the logs exporter; service rows keep no
  # agent_id label instead of minting an empty stream dimension.
  transform/promote_event_labels:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - set(resource.attributes["agent_id"], attributes["agent_id"]) where attributes["agent_id"] != nil
          - set(resource.attributes["event_name"], attributes["event_name"]) where attributes["event_name"] != nil

extensions:
  file_storage/logoffsets:
    directory: $AVA_HOME/otel-collector/log-offsets
    create_directory: true
  file_storage:
    directory: $AVA_HOME/otel-collector/queue
    create_directory: true
    timeout: 1s
    # fsync off: this is a retry buffer, not an fsync durability boundary.
    # The separate trace mirror covers batches that reach file/traces; upstream
    # backpressure may still reject before either exporter.
$CLUSTER_AUTH_EXTENSION

exporters:
$OTLP_EXPORTERS
  # Local JSONL mirror — the grep surface (user ruling: "grep is the most
  # convenient way to debug"). One line per export batch, each line a standard OTLP/JSON
  # ExportTraceServiceRequest. Rotation (timberjack) gives append semantics
  # across collector restarts: the ACTIVE file is never truncated, and
  # max_days / max_backups bound the directory. `spans.jsonl` -> rotated
  # `spans-<ISO-timestamp>-size.jsonl` on size rotation (timberjack 1.4.5 in
  # otelcol-contrib 0.155.0 appends the trigger reason to the backup name;
  # `shared/trace_mirror.py` parses both suffixed and unsuffixed shapes).
  #
  # Segment size is the structural bound on the ACTIVE file (the file
  # exporter exposes no time-based rotation, so size is the only trigger):
  # at 64 MiB the mirror rotates roughly every half hour at peak volume.
  # max_backups counts BOTH plain and gzipped backups (timberjack parses the
  # `.gz` name), so it is the de-facto retention at peak volume: ~24 segments
  # = the last ~12h of a 2.9 GB/day mirror. The agent-side day retention
  # (`trace_retention_days`, `shared/trace_mirror.py`'s `_prune_old_mirror` on every
  # agent start) binds at low volume, when 24 segments span more days than
  # the setting; `_gzip_old_mirror` shrinks each kept segment ~5-10x, keeping
  # the whole mirror around a few hundred MiB at peak.
  #
  # No `localtime` key below — timberjack's default (false) stamps the
  # rotated filename's timestamp in UTC. `shared/trace_mirror.py`'s `_prune_old_mirror`
  # parses that embedded timestamp and treats it as UTC explicitly
  # (`tzinfo=UTC`); setting `localtime: true` here would silently break that
  # parse (retention would prune the wrong files, or none) without either
  # side signaling the mismatch (tz audit, 2026-08, PR-6).
  file/traces:
    path: $AVA_HOME/traces/spans.jsonl
    rotation:
      max_megabytes: 64
      max_days: $RETENTION_DAYS
      max_backups: 24

service:
  telemetry:
    # Task #1978: keep exporter retry notices out of service stdout.
    logs: { level: warn }
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: localhost
                port: $SELF_METRICS_PORT
  extensions: [file_storage, file_storage/logoffsets$CLUSTER_AUTH_SERVICE_EXTENSION]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/cluster_allow, batch]
      exporters: [otlphttp/tempo, file/traces]
    logs:
      receivers: [otlp$REMOTE_OTLP_PIPELINE_RECEIVER, filelog/sessions, filelog/services, filelog/orchestration]
      processors: [memory_limiter, filter/cluster_allow, transform/promote_event_labels, transform/filelog_service, batch]
      exporters: [otlphttp/loki]
    metrics:
      receivers: [otlp$REMOTE_OTLP_PIPELINE_RECEIVER]
      processors: [memory_limiter, filter/cluster_allow, batch]
      exporters: [otlphttp/prometheus]
    # Infra metrics ride their own pipeline so the host-identity processors
    # touch only them: app metrics already carry `machine`/`agent_id`
    # datapoint attributes from the emitter and must not be relabelled.
    metrics/infra:
      receivers: [host_metrics, prometheus/otelcol$DATA_PLANE_PIPELINE_RECEIVERS]
      processors:
        [
          memory_limiter,
          resource_detection/host,
          resource/infra,
          transform/host_label,
          batch,
        ]
      exporters: [otlphttp/prometheus]
$REMOTE_TRACE_PIPELINE
