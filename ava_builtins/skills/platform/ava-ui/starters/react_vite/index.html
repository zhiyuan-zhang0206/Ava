<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ava React Page</title>
    <style>
      :root {
        --bg: #ffffff;
        --bg-secondary: #f6f8fa;
        --bg-tertiary: #fafafa;
        --text: #1a1a1a;
        --text-secondary: #555555;
        --text-muted: #888888;
        --border: #dddddd;
        --border-light: #eeeeee;
        --primary: #2563eb;
        --primary-light: #2563eb33;
        --success: #15803d;
        --error: #b91c1c;
        --disabled-bg: #99aabb;
        --code-bg: #eeeeff;
        --pre-bg: #f6f8fa;
        --hover-bg: #f0f0f0;
        --active-cue: #fff9c4;
        color-scheme: light dark;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1117;
          --bg-secondary: #161b22;
          --bg-tertiary: #21262d;
          --text: #c9d1d9;
          --text-secondary: #8b949e;
          --text-muted: #6e7681;
          --border: #30363d;
          --border-light: #21262d;
          --primary: #58a6ff;
          --primary-light: #58a6ff33;
          --success: #3fb950;
          --error: #f85149;
          --disabled-bg: #484f58;
          --code-bg: #161b22;
          --pre-bg: #161b22;
          --hover-bg: #1c2128;
          --active-cue: #3d3520;
        }
      }

      body {
        background: var(--bg);
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Served at the page server's own root `/`, so `/src/main.tsx` works;
         relative `./` is fine too. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
