<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown</title>
<!--
  Markdown widget (vanilla HTML version).

  The page body is pre-rendered server-side via markdown-it-py
  (CommonMark + GFM: tables / strikethrough / task lists) and placed into
  #md-output directly. Client-side JS then enhances:
  - LaTeX inline `$...$` and display `$$...$$` (via KaTeX auto-render;
    delimiters are `$`/`$$` only — `\(`/`\)` is NOT used because this
    auto-render build's delimiter escaping matches a bare `(`/`)`, turning
    ordinary parentheses in prose/code into math)
  - Code highlighting (highlight.js auto-detect, light/dark theme via
    prefers-color-scheme; KaTeX auto-render ignores <pre>/<code> by default,
    so code blocks never get mangled as math)

  Dependencies vendored locally in vendor/ (~750KB): KaTeX + highlight.js.
  No CDN required.  marked.js + DOMPurify are still vendored but no longer
  loaded — HTML is pre-rendered server-side.
-->

<link rel="stylesheet" href="vendor/katex.min.css">
<link rel="stylesheet" href="vendor/github.min.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="vendor/github-dark.min.css" media="(prefers-color-scheme: dark)">
<style>
  :root {
    --bg: #ffffff;
    --bg-secondary: #f6f8fa;
    --text: #1a1a1a;
    --text-secondary: #555555;
    --border: #dddddd;
    --code-bg: #eeeeff;
    --pre-bg: #f6f8fa;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --bg-secondary: #161b22;
      --text: #c9d1d9;
      --text-secondary: #8b949e;
      --border: #30363d;
      --code-bg: #161b22;
      --pre-bg: #161b22;
    }
  }

  body { background: var(--bg); color: var(--text); }
  #md-output { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; line-height: 1.6; max-width: 800px; margin: 1em auto; padding: 0 1em; }
  #md-output img { max-width: 100%; height: auto; }
  #md-output pre { background: var(--pre-bg); padding: 1em; border-radius: 6px; overflow-x: auto; }
  #md-output code:not(pre code) { background: var(--code-bg); padding: 2px 4px; border-radius: 3px; font-size: 0.9em; }
  #md-output table { border-collapse: collapse; }
  #md-output th, #md-output td { border: 1px solid var(--border); padding: 6px 12px; }
  #md-output blockquote { border-left: 4px solid var(--border); padding-left: 1em; color: var(--text-secondary); margin-left: 0; }
  /* codehilite (Pygments) output classes */
  #md-output .codehilite { background: var(--pre-bg); border-radius: 6px; overflow-x: auto; }
  #md-output .codehilite pre { background: none; padding: 0; margin: 0; }
</style>
</head>
<body>

<div id="md-output">{{RENDERED_HTML}}</div>
<script type="text/markdown" id="md-source" hidden>{{MARKDOWN_CONTENT}}</script>

<script src="vendor/katex.min.js"></script>
<script src="vendor/auto-render.min.js"></script>
<script src="vendor/highlight.min.js"></script>

<script>
  function enhanceContent() {
    const out = document.getElementById('md-output');
    if (!out) return;

    // KaTeX math rendering — scans the pre-rendered HTML for $...$ and $$...$$
    if (typeof renderMathInElement !== 'undefined') {
      renderMathInElement(out, {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '$', right: '$', display: false},
        ],
        throwOnError: false,
      });
    }

    // Code highlighting via highlight.js
    if (typeof hljs !== 'undefined') {
      out.querySelectorAll('pre code').forEach(function (el) {
        hljs.highlightElement(el);
      });
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', enhanceContent);
  } else {
    enhanceContent();
  }
</script>
</body>
</html>
