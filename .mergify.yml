# Mergify merge queue — this repo's PR merge automation.
#
# Flow: CI green → QA applies `qa-approved` → post `@mergifyio queue` as a PR
# comment → Mergify batches queued PRs (batch_size 8) into one speculative
# draft PR, re-runs CI on the combined tree, and lands every PR in the batch
# on green (rebase merges, linear history). A red batch is bisected
# automatically to evict the culprit. The speculative draft PRs ride branches
# under mergify/merge-queue/ — ci.yml's draft-skip explicitly exempts that
# prefix, so batches always verify fully.
#
# Queue tuning (2026-08-30, CTO #3230 P0-2 ruling — decisions note in the
# P0-2 sprint ledger): `max_parallel_checks: 5` + dynamic
# `batch_size {min: 1, max: 8}` + `batch_max_wait_time: 90s` +
# `max_checks_retries: 1`. Hosted CI minutes are free (public repo), so the
# lever is parallelism, not fewer runs: five overlapping batches break the
# queue's serialization bottleneck, dynamic batch sizing gives a lone PR a
# batch immediately (zero wait) while a burst still coalesces up to 8 into
# one speculative cycle, and one automatic retry absorbs batch flakes
# (measured 2026-08-30: 22% of PRs took a second queue cycle, partly flake).
# In-place checks were evaluated and rejected — rebase re-heads still force
# a second full CI run, and the serialization they require would trade
# throughput for a latency the rerun cannot remove.
#
# QA GATE: `qa-approved` is a hard merge precondition (merge_conditions). The
# label is applied by QA / maintainers only, and only on a PASS or
# PASS-with-nits conclusion; BLOCK / CONDITIONAL never carry it, and a later
# BLOCK removes it immediately. A PR without the label is never merged even
# with green CI and an enqueued position — it waits in the queue until QA
# labels it (dependabot and other automated PRs are only delayed, never
# broken). Authors never self-apply the label; any new commit after a PASS
# still requires a delta re-review before the label is (re)applied.
#
# Batching requires draft-PR checks, which are incompatible with the
# `Require branches to be up to date before merging` branch protection —
# that protection is OFF (the queue's own verification of the combined tree
# is what replaces it; every landed commit was still verified in a tree that
# includes everything landing with or before it).
#
# check-success OR check-skipped: ci.yml's change-class gating legitimately
# skips a suite whose side the diff does not touch (docs-only skips all
# three); a skipped required check satisfies branch protection and must
# satisfy the queue the same way.
#
# branch_protection_injection_mode: none — the explicit conditions below
# already carry the same gate as branch protection; injection would only
# duplicate it.

merge_queue:
  max_parallel_checks: 5

queue_rules:
  - name: default
    # Mergify merges as the repo owner (admin). Branch protection enforces
    # `enforce_admins`, so the required checks (backend, frontend, e2e) must
    # be genuinely green-or-skipped for ANY merge, admin or not.
    # Must be a GitHub user account logged into Mergify.
    merge_bot_account: zhiyuan-zhang0206
    # Batch queued PRs into one speculative verification (draft PR); a red
    # batch bisects automatically.
    batch_size:
      min: 1
      max: 8
    # Wait up to 90s for a burst to fill the batch before processing: burst
    # PRs merge into one speculative batch (one CI cycle instead of several).
    # A lone PR still pays up to 90s queue latency, but the dynamic batch
    # floor of 1 means it never waits for company.
    batch_max_wait_time: 90s
    # Without checks_timeout Mergify waits only the auto-derived 18m; on a
    # busy queue every batch re-runs CI and PRs get dequeued mid-run.
    # 3600s = comfortable headroom over the full suite.
    checks_timeout: 3600s
    queue_conditions:
      - or:
          - check-success=backend (pytest + pyright)
          - check-skipped=backend (pytest + pyright)
      - or:
          - check-success=frontend (eslint + tsc + vitest)
          - check-skipped=frontend (eslint + tsc + vitest)
      - or:
          - check-success=e2e (Playwright happy path)
          - check-skipped=e2e (Playwright happy path)
    merge_conditions:
      # QA gate: only QA / maintainers apply `qa-approved`, and only on a
      # final PASS / PASS-with-nits conclusion. Without it nothing merges.
      - label=qa-approved
      - or:
          - check-success=backend (pytest + pyright)
          - check-skipped=backend (pytest + pyright)
      - or:
          - check-success=frontend (eslint + tsc + vitest)
          - check-skipped=frontend (eslint + tsc + vitest)
      - or:
          - check-success=e2e (Playwright happy path)
          - check-skipped=e2e (Playwright happy path)
    # One automatic batch-level retry after a red speculative run (flake
    # absorption). The batch is rebuilt and re-verified; a second red still
    # bisects to evict the culprit, so correctness is not weakened.
    max_checks_retries: 1
    merge_method: rebase
    update_method: rebase
    branch_protection_injection_mode: none
