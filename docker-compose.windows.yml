# Docker Compose data plane — Postgres 17 + Redis 8.2.
#
# NOT part of the supported bring-up: no Python code reads this file, and
# `ava start` never invokes it. The supported data plane is native per-cluster
# pg/redis under $AVA_HOME (cli/commands/_cluster_instance.py).
#
# This is a hand-run convenience for ONE case: a gateway inside WSL2 on Windows
# hardware, where you would rather not apt-install pg/redis into the distro.
# Native Windows is NOT that case — a Windows unit carries `agent-runner` only
# and has no local data plane at all (conventions/windows-setup.md).
#
# Usage (the gateway-local owner/admin credentials must be set; `ava start`
# persists them after cluster birth):
#   $env:AVA_DB_ADMIN_PASSWORD = "<owner-password>"
#   $env:AVA_REDIS_ADMIN_PASSWORD = "<redis-admin-password>"
#   docker compose -f docker-compose.windows.yml up -d
#
# SINGLE CLUSTER PER BOX. The pg owner password and Redis requirepass are
# gateway-local admin credentials, so this data plane belongs to exactly one
# cluster. Co-location (a second cluster sharing the box) is unsupported on
# Windows: a second cluster's bring-up would re-key the shared Redis auth and
# drop the first cluster's ACL users.
#
# This is a CONVENIENCE for Windows users. The standard macOS/Linux path
# (native pg/redis installed via brew/apt) is unchanged; this file is only
# for the Windows (WSL2 + Docker) deployment shape.

services:
  postgres:
    image: postgres:17-alpine
    container_name: ava-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ava
      # SEEDS the superuser only at first volume-init — Postgres ignores
      # POSTGRES_PASSWORD once ava-pg-data exists. `ava start` re-keys the superuser
      # to the current DB-owner password on every bring-up (over the container's trust
      # socket; see _docker_rekey_superuser), so a rotated/pre-existing credential
      # self-heals instead of locking admin out. Fail loud if unset (no weak default).
      POSTGRES_PASSWORD: "${AVA_DB_ADMIN_PASSWORD:?AVA_DB_ADMIN_PASSWORD must be set; run ava start}"
      POSTGRES_DB: ava
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ava-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ava"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Postgres config tuned for a single-operator box:
    command: >
      -c listen_addresses=0.0.0.0
      -c max_connections=300
      -c shared_buffers=256MB

  redis:
    image: redis:8-alpine
    container_name: ava-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${AVA_REDIS_ADMIN_PASSWORD:?AVA_REDIS_ADMIN_PASSWORD must be set; run ava start}
      --save ""
      --appendonly no
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ava-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${AVA_REDIS_ADMIN_PASSWORD:?AVA_REDIS_ADMIN_PASSWORD must be set; run ava start}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ava-pg-data:
  ava-redis-data:
