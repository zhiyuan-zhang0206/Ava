# The only modules here that may build the `db` handle from the live settings; the rest takes it
# from them.
db = ["cluster/process_boot.py"]

# The only module here that may build the `bus` handle — the app lifespan builds it from this
# process's boot configuration, not the live settings; every other gateway module reads
# `request.app.state.bus`.
bus = ["app.py"]
