title = "Ava secret scanning policy"

[extend]
useDefault = true

[allowlist]
description = "Development and test fixture values that are not deployable credentials"
regexes = [
    '''\bava_dev_only\b''',
    '''\bpw123\b''',
    '''\bs3cr3t\b''',
    '''\bnew-db\b''',
    '''\bnew-runner-db\b''',
]

