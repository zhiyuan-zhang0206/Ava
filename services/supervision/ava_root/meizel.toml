exports = ["failure_state.py", "health.py", "inputs.py", "manifest.py", "probes.py", "selfcheck.py", "server.py", "singleton.py", "supervisor.py", "wiring.py"]

[uses]
"__init__.py" = ["health.py", "manifest.py", "probes.py", "selfcheck.py", "server.py", "singleton.py", "supervisor.py", "wiring.py"]
"__main__.py" = ["daemon.py"]
"daemon.py" = ["manifest.py", "server.py", "singleton.py", "supervisor.py", "wiring.py"]
"failure_state.py" = ["intent_store.py"]
"health.py" = ["failure_state.py", "manifest.py", "probes.py"]
"manifest.py" = ["inputs.py"]
"stopping.py" = ["unit_records.py"]
"supervisor.py" = ["failure_state.py", "intent_store.py", "manifest.py", "stopping.py", "unit_records.py"]
"tests" = ["daemon.py", "failure_state.py", "health.py", "inputs.py", "intent_store.py", "manifest.py", "probes.py", "selfcheck.py", "server.py", "singleton.py", "stopping.py", "supervisor.py", "unit_records.py", "wiring.py"]
"unit_records.py" = ["intent_store.py", "manifest.py"]
"wiring.py" = ["manifest.py", "supervisor.py"]

[loads]
"probes.py" = ["services/supervision/healthchecks"]
"wiring.py" = ["services/supervision/ava_root_glue"]

[external]
"probes.py" = "resolves the healthcheck module an operator-installed plugin names"
"wiring.py" = "resolves the --wiring module:attr the operator passes to the daemon"
