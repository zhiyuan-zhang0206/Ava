# Composition roots of this package (scripts/structure/ambient_state/roots.py): the only
# modules here that may read the global `settings`; the rest takes its configuration as
# constructor arguments.
settings = ["daemon.py"]
# The only modules here that may call `Database.from_settings()`; the rest takes the handle
# (or its pool) from them.
db = ["daemon.py"]

# The only modules here that may call `ServiceEndpoints.from_settings()`; the rest takes its
# daemon's `ServiceEndpoint` (or the table) from them.
endpoints = ["daemon.py"]

# The only modules here that may call `EventBus.from_settings()`; the rest takes the bus from them.
bus = ["daemon.py"]
