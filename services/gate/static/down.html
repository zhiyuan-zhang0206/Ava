  gap: 1rem;

}

  width: 2rem;
  height: 2rem;
  color: var(--muted-foreground);
}

.headline {
  gap: 0.25rem;
}

.headline h1 {
  font-size: 1.25rem;
  line-height: 1.75rem;
}

</style>
