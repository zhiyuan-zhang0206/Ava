<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ava — Sign in</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>/*__THEME_JS__*/</script>
<style>
/*__THEME_CSS__*/

/* The app's own sign-in screen (ui/web/src/app/login/page.tsx +
   components/auth/login-form.tsx), rebuilt from the same tokens. */

.card {
  width: 100%;
  max-width: 24rem;
  gap: 1.5rem;
  padding: 2rem;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--card);
  color: var(--card-foreground);
  box-shadow: 0 1px 3px 0 #0000001a, 0 1px 2px -1px #0000001a;
}

.card-head {
  gap: 0.5rem;
  text-align: center;
}

.card-head h1 {
  font-size: 1.5rem;
  line-height: 2rem;
}

form {
  gap: 1rem;
}

.field {
  gap: 0.5rem;
}

label {
  font-size: 0.875rem;
  line-height: 1.25rem;
  font-weight: 500;
}

input {
  width: 100%;
  padding: 0.5rem 0.75rem;
  border: 1px solid var(--input);
  border-radius: calc(var(--radius) * 0.8);
  background: var(--background);
  color: var(--foreground);
  font: inherit;
  font-size: 0.875rem;
  line-height: 1.25rem;
  transition: box-shadow 0.15s cubic-bezier(0.4, 0, 0.2, 1);
}

input::placeholder {
  color: var(--muted-foreground);
}

input:focus-visible {
  outline: none;
  box-shadow: 0 0 0 2px var(--ring);
}

input:disabled {
  cursor: not-allowed;
  opacity: 0.5;
}

button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0.5rem 1rem;
  border: 0;
  border-radius: calc(var(--radius) * 0.8);
  background: var(--primary);
  color: var(--primary-foreground);
  font: inherit;
  font-size: 0.875rem;
  line-height: 1.25rem;
  font-weight: 500;
  cursor: pointer;
  transition: background-color 0.15s cubic-bezier(0.4, 0, 0.2, 1);
}

button:hover {
  background: color-mix(in oklab, var(--primary) 90%, transparent);
}

button:focus-visible {
  outline: none;
  box-shadow: 0 0 0 2px var(--ring);
}

button:disabled {
  pointer-events: none;
  opacity: 0.5;
}

.error {
  font-size: 0.875rem;
  line-height: 1.25rem;
  color: var(--destructive);
}
</style>
</head>
<body>
  <div class="card stack">
    <div class="card-head stack">
      <h1>Ava</h1>
      <p class="muted" data-i18n="enterPassword">Enter the cluster password to continue</p>
    </div>
    <form class="stack" id="form">
      <div class="field stack">
        <label for="username" data-i18n="username">Username</label>
        <input type="text" id="username" name="username" placeholder="admin" autocomplete="username" autofocus>
      </div>
      <div class="field stack">
        <label for="password" data-i18n="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Cluster secret" data-i18n-placeholder="clusterSecret" autocomplete="current-password">
      </div>
      <p class="error" id="error" role="alert" hidden></p>
      <button type="submit" id="submit">Sign in</button>
    </form>
  </div>
  <script>
    // Locale copy follows the webview / system language (this page renders
    // before any user setting exists). English strings are the static HTML
    // defaults; the Chinese table is written as \uXXXX escapes because the
    // repo-wide no-CJK gate exempts only locale files, and this page must
    // stay a dependency-free single asset (see the gate daemon header).
    var AVA_I18N_ZH = {
      "enterPassword": "\u8f93\u5165\u96c6\u7fa4\u5bc6\u7801\u4ee5\u7ee7\u7eed",
      "username": "\u7528\u6237\u540d",
      "password": "\u5bc6\u7801",
      "clusterSecret": "\u96c6\u7fa4\u5bc6\u94a5",
      "signIn": "\u767b\u5f55",
      "signingIn": "\u767b\u5f55\u4e2d\u2026",
      "connectionFailed": "\u8fde\u63a5\u5931\u8d25\u2014\u2014gateway \u662f\u5426\u5728\u8fd0\u884c\uff1f",
      "invalidPassword": "\u5bc6\u7801\u9519\u8bef",
      "signInFailed": "\u767b\u5f55\u5931\u8d25\uff08"
    };
    var AVA_LOCALE = (navigator.language || "en").toLowerCase().startsWith("zh") ? "zh" : "en";
    function t(key) {
      return AVA_LOCALE === "zh" && AVA_I18N_ZH[key] ? AVA_I18N_ZH[key] : null;
    }
    function applyI18n() {
      if (AVA_LOCALE !== "zh") return;
      document.documentElement.lang = "zh-CN";
      var nodes = document.querySelectorAll("[data-i18n]");
      for (var i = 0; i < nodes.length; i++) {
        var value = t(nodes[i].getAttribute("data-i18n"));
        if (value) nodes[i].textContent = value;
      }
      var nodesP = document.querySelectorAll("[data-i18n-placeholder]");
      for (var j = 0; j < nodesP.length; j++) {
        var value2 = t(nodesP[j].getAttribute("data-i18n-placeholder"));
        if (value2) nodesP[j].placeholder = value2;
      }
    }
    applyI18n();

    // The same login call the app's form makes.
    // `username` is accepted but never
    // validated by the gateway — it is there so password managers offer to save
    // the secret — so a blank one takes the app's "admin" default.
    var form = document.getElementById("form");
    var submit = document.getElementById("submit");
    var error = document.getElementById("error");
    var passwordField = document.getElementById("password");

    // The app's button is disabled until there is a secret to send; a password
    // manager filling the field raises `input` the same as typing does.
    function idle() {
      submit.disabled = !passwordField.value.trim();
      submit.textContent = t("signIn") || "Sign in";
    }

    passwordField.addEventListener("input", idle);
    idle();

    function fail(message) {
      error.textContent = message;
      error.hidden = false;
      idle();
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      var password = passwordField.value.trim();
      if (!password) return;
      error.hidden = true;
      submit.disabled = true;
      submit.textContent = t("signingIn") || "Signing in…";
      var response;
      try {
        response = await fetch("__GATEWAY_BASE__/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({
            username: document.getElementById("username").value.trim() || "admin",
            password: password,
          }),
        });
      } catch {
        fail(t("connectionFailed") || "Connection failed — is the gateway running?");
        return;
      }
      if (response.ok) location.href = "/";
      else if (response.status === 401) fail(t("invalidPassword") || "Invalid password");
      else fail((t("signInFailed") || "Sign-in failed (") + response.status + ")");
    });
  </script>
</body>
</html>
