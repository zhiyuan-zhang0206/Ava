<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ava — Updating</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="4">
<script>/*__THEME_JS__*/</script>
<style>
/*__THEME_CSS__*/

/* The Gate-owned updating screen, built from the app's design tokens. The SPA
   only reloads through Gate and never renders or times a competing page. */

.screen {
  align-items: center;
  gap: 1rem;
  text-align: center;
}

.spinner {
  width: 2rem;
  height: 2rem;
  color: var(--muted-foreground);
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.headline {
  gap: 0.25rem;
}

.headline h1 {
  font-size: 1.25rem;
  line-height: 1.75rem;
}

.waiting {
  font-size: 0.75rem;
  line-height: 1rem;
  color: color-mix(in oklab, var(--muted-foreground) 60%, transparent);
}
</style>
</head>
<body>
  <main class="screen stack">
    <svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12a9 9 0 1 1-6.219-8.56"></path>
    </svg>
    <div class="headline stack">
      <h1>System updating</h1>
      <p class="muted">The cluster is being updated — reconnecting automatically when it&apos;s ready…</p>
    </div>
    <p class="waiting" id="waiting" hidden></p>
  </main>
  <script>
    // The gate injects the persisted generation start plus a server-computed
    // base duration. performance.now() advances it monotonically inside this
    // document. Refreshes, new tabs, blocked storage and browser clock drift all
    // reconstruct the same elapsed time from the file instead of starting a
    // browser-owned stopwatch.
    window.__AVA_DEPLOY_STARTED_AT__ = /*__AVA_DEPLOY_STARTED_AT__*/;
    window.__AVA_UPDATE_BASE_ELAPSED_MS__ = /*__AVA_UPDATE_BASE_ELAPSED_MS__*/;
    (function () {
      var line = document.getElementById("waiting");
      var monotonicStart = performance.now();
      var base = window.__AVA_UPDATE_BASE_ELAPSED_MS__;

      function tick() {
        var total = Math.floor((base + performance.now() - monotonicStart) / 1000);
        var minutes = Math.floor(total / 60);
        var seconds = total % 60;
        line.textContent = "Waiting " + (minutes > 0 ? minutes + "m " + seconds + "s" : seconds + "s");
        line.hidden = false;
      }

      tick();
      setInterval(tick, 1000);
    })();
  </script>
</body>
</html>
