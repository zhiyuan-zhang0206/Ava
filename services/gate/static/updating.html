<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ava — Updating</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="4">
<script>/*__THEME_JS__*/</script>
<style>
/*__THEME_CSS__*/

/* The app's own updating screen (ui/web/src/components/updating-page.tsx),
   rebuilt from the same tokens — same lucide Loader2 glyph, same copy, same
   elapsed line, so a rollout that swaps one for the other is invisible. */

.screen {
  align-items: center;
  gap: 1rem;
  text-align: center;
}

.spinner {
  width: 2rem;
  height: 2rem;
  color: var(--muted-foreground);
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.headline {
  gap: 0.25rem;
}

.headline h1 {
  font-size: 1.25rem;
  line-height: 1.75rem;
}

.waiting {
  font-size: 0.75rem;
  line-height: 1rem;
  color: color-mix(in oklab, var(--muted-foreground) 60%, transparent);
}
</style>
</head>
<body>
  <main class="screen stack">
    <svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12a9 9 0 1 1-6.219-8.56"></path>
    </svg>
    <div class="headline stack">
      <h1>System updating</h1>
      <p class="muted">The cluster is being updated — reconnecting automatically when it&apos;s ready…</p>
    </div>
    <p class="waiting" id="waiting" hidden></p>
  </main>
  <script>
    // Elapsed-time line, matching the app's. The meta refresh above reloads this
    // page every 4s, so the start instant lives in sessionStorage instead of a
    // variable; a gap longer than a few refresh cycles means the tab sat through
    // a different outage, so the clock restarts rather than reporting a wait
    // that never happened.
    (function () {
      var KEY = "ava-gate-waiting-since";
      var STALE_MS = 30000;
      var line = document.getElementById("waiting");
      var now = Date.now();
      var since = now;

      try {
        var saved = JSON.parse(sessionStorage.getItem(KEY) || "null");
        if (saved && now - saved.seen < STALE_MS) since = saved.since;
        sessionStorage.setItem(KEY, JSON.stringify({ since: since, seen: now }));
      } catch (e) {
        // Storage blocked — the counter still runs, just from this load.
      }

      function tick() {
        var total = Math.floor((Date.now() - since) / 1000);
        var minutes = Math.floor(total / 60);
        var seconds = total % 60;
        line.textContent = "Waiting " + (minutes > 0 ? minutes + "m " + seconds + "s" : seconds + "s");
        line.hidden = false;
      }

      tick();
      setInterval(tick, 1000);
    })();
  </script>
</body>
</html>
