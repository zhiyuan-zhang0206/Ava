# A sub-skill's script reaches its parent skill's scripts/ only through the
# runtime `__file__`-derived sys.path guard (Structure Rule 6) — pyright does
# not execute that guard, so it needs the same directory named explicitly to
# resolve the sibling import statically. Each skill's own scripts/ resolves
# its OWN same-directory siblings without help (a file's containing directory
# is always on pyright's implicit search path); only the parent-reaching case
# needs extraPaths.
[[tool.pyright.executionEnvironments]]
root = "ava_builtins/skills/integrations/web-ai"
extraPaths = ["ava_builtins/skills/integrations/web-ai/scripts"]

[[tool.pyright.executionEnvironments]]
root = "ava_builtins/skills/integrations/web-sources"
extraPaths = ["ava_builtins/skills/integrations/web-sources/scripts"]

[tool.mutmut]
# Mutation testing exploratory config (mutmut).
# Modify paths_to_mutate / tests_dir
# to switch target. mutmut runs pytest in mutants/ dir; also_copy lists all source pkgs
# in this repo so conftest imports don't ModuleNotFoundError.
paths_to_mutate = ["agent/loop.py"]
tests_dir = [
    "tests/components/agent/test_loop.py",
    "tests/components/agent/test_loop_main.py",
]
also_copy = [
    "base",
    "agent",
    "gateway",
    "ava",
    "cli",
    "services",
    "scripts",
    "ava_builtins",
    "db",
    "migrations",
]
