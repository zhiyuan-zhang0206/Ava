# These three skills' scripts/ moved out of a former reference/*.py or
# skill_support/** path (path_imports fix, Rule 6) unchanged: same relaxation
# their content had there, so the move itself does not force an unrelated
# style/complexity cleanup onto code nobody otherwise touched. Additive to the
# base scripts/*.py entry above, not a replacement.
"ava_builtins/skills/coordination/ava-dynamic-workflow/scripts/*.py" = ["DTZ005", "N806"]
"ava_builtins/skills/platform/ava-self-evolution/scripts/*.py" = ["S112", "RUF059", "PLR0915", "PLW0603"]
"ava_builtins/skills/platform/ava-guide/external-agents/scripts/*.py" = ["PLR0915"]
# A skill's references/ holds genuine reference material — mostly prose, but
# occasionally a Python snippet the agent reads and adapts rather than runs in
# place (e.g. ava-dynamic-workflow's orchestrator templates, string-patched
# and launched through an API, not executed as a file). Not the maintained
# live path, so the same broad relaxation as .agents/skills/*/reference/*.py
# above applies.
"ava_builtins/skills/*/references/*.py" = ["ERA001", "T20", "B904", "F841", "RUF059", "PLW1510", "S110", "S112", "S603", "C401", "PLR0915", "N806", "ANN201", "DTZ005", "PTH123"]
# Project skills under .agents/skills/ ship the same kind of runnable CLI
# scripts — same exemptions apply.
".agents/skills/*/scripts/*.py" = ["ERA001", "T20", "S603", "S108", "S310", "FBT", "PLW1510", "PTH", "ANN"]
# Same intent for skill reference files bundled inside a plugin's skill package
# (a plugin can ship its own skill tree under ava_builtins/plugins/<name>/skills/...).
"ava_builtins/plugins/*/skills/**/reference/*.py" = ["ERA001", "T20", "B904", "F841", "RUF059", "PLW1510", "S110", "S112", "S603", "C401", "PLR0915", "N806"]
"ava_builtins/plugins/*/skills/**/scripts/*.py" = ["ERA001", "T20", "S603", "S108", "FBT", "PLW1510", "PTH", "ANN"]
"scripts/**" = ["ANN", "T20"]
# The typed S110 findings in scripts/tests were outside the retired lint's
# production scan; preserve that boundary.
"scripts/codegen/gen_config_lite_table.py" = ["S110"]
"ava/mcps/tests/test_daemon.py" = ["S110"]
"agent/graph/claim/tests/test_core.py" = ["S110"]
