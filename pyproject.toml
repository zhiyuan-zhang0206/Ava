[project]
name = "ava"
version = "0.1.5"
description = "minimal code-as-action agent"
readme = "docs/introduction.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ava contributors" }]
keywords = ["agent", "llm", "code-as-action", "langgraph", "anthropic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "psutil>=7.1.0",
    "langchain-anthropic>=0.3",
    "langgraph>=0.3",
    "python-dotenv>=1.2.2",
    "redis>=7.4.0",
    "pydantic-settings>=2.13.1",
    "langgraph-checkpoint-postgres>=3.0.5",
    "fastapi>=0.120",
    "uvicorn[standard]>=0.40",
    "loguru>=0.7.3",
    "mcp>=2.0.0,<3",
    "langchain-google-genai>=4.2.4",
    "langchain-openai>=0.3",
    "langchain-moonshot>=0.1.0",
    "croniter>=6.2.2",
    "google-genai>=2.0",
    "watchdog>=6.0.0",
    "numpy>=2.4.4",
    "pyte>=0.8.0",  # terminal emulation screen model for PTY sessions (S6 step 2)
    "traceloop-sdk>=0.61",
    # Imported directly: base/telemetry/tracing.py (span exporter, OTLP protobuf encode)
    # and base/telemetry/otlp/telemetry_otlp.py (OTLP/HTTP logs + metrics exporters).
    # Transitively pulled by traceloop-sdk already; declared here because we
    # import them by name.
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "yt-dlp>=2026.3.17",
    "pyyaml>=6.0.3",
    "httpx[socks]>=0.28",
    "feedparser>=6.0.12",
    "trafilatura>=2.1.0",
    # --- Common libraries pre-installed for the agent runtime (task #630) ---
    # Agents routinely import these (data/image/Excel/PDF/HTTP); the user wants
    # them available out of the box even though the set is heavy. Deliberately
    # excluded: torch / tensorflow / jax / transformers / opencv / numba / dask.
    "pandas>=2.2.3",  # tabular data — DataFrame
    "scipy>=1.14.1",  # scientific computing
    "scikit-learn>=1.5.0",  # machine learning
    "statsmodels>=0.14.4",  # statistics / regression
    "matplotlib>=3.9.0",  # plotting
    "Pillow>=10.4.0",  # image processing (PIL)
    "openpyxl>=3.1.2",  # Excel .xlsx read/write
    "xlsxwriter>=3.2.0",  # Excel .xlsx writing
    "python-docx>=1.1.0",  # Word .docx
    "pypdf>=4.2.0",  # PDF text extraction
    "requests>=2.32.0",  # sync HTTP client
    "aiohttp>=3.9.0",  # async HTTP client
    "beautifulsoup4>=4.12.3",  # HTML parsing
    "lxml>=5.2.0",  # fast XML/HTML parsing
    "rich>=13.7.0",  # terminal formatting
    "tqdm>=4.66.0",  # progress bars
    "python-dateutil>=2.9.0",  # date parsing
    "tabulate>=0.9.0",  # table formatting
    "cryptography>=42.0.0",  # crypto primitives
    "lark-oapi>=1.7.1",
    "websockets>=15.0.1",
    "oss2>=2.19.1",
]

[project.scripts]
# `uv sync` installs `.venv/bin/ava` — cluster ops CLI (start/stop/status/update/...).
# Implementation in `cli/main.py` (argparse entry), settings-free domain builders
# and adapters, and `cli/commands/` (cmd_* implementations). Decoupled from the `ava/`
# SDK — the agent is unaware of docker / cron.
ava = "cli.main:main"

[project.urls]
Homepage = "https://github.com/zhiyuan-zhang0206/Ava"
Repository = "https://github.com/zhiyuan-zhang0206/Ava"
Issues = "https://github.com/zhiyuan-zhang0206/Ava/issues"

[build-system]
# hatchling is the default minimal builder for the uv / PEP 621 stack. `[tool.uv] package
# = true` makes `[project.scripts]` take effect and install the `ava` CLI entry point.
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Include the application kernel, not only its SDK and CLI. A non-editable
# installation must resolve exec children and service modules without a checkout.
# This packaging step does not activate wheel-based production deployments.
packages = ["ava", "cli", "agent", "base", "ops", "gateway", "services", "ava_builtins"]
# Tests live beside the code they prove (`<pkg>/**/tests/`); a runtime image ships none of them.
exclude = ["**/tests/**"]

[tool.hatch.build.targets.wheel.force-include]
# Existing consumers resolve these siblings of base/. Keep their relative
# layout in the installed application; no Git checkout is needed to read them.
"db/schema.sql" = "db/schema.sql"
"migrations" = "migrations"
"schedules" = "schedules"
"deploy/otel-collector/otel-collector.yaml" = "deploy/otel-collector/otel-collector.yaml"
"deploy/lgtm/config" = "deploy/lgtm/config"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "radon==6.0.1",
    "import-linter>=2.0",
    "pre-commit>=4.5.1",
    "pyright>=1.1.411",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.0",
    "pytest-playwright>=0.7.0",
    "pytest-xdist>=3.8",
    # ruff 0.16 (migration, task #3162): PLR0917 joins its PLR0913 sibling in
    # the ignore list; RUF036 fixed in-tree; markdown code-block formatting
    # stays out of the format scope for now — see [tool.ruff.format].exclude.
    "ruff>=0.16.7,<0.17",
    "pytest-cov>=7.0",
    # starlette 1.2+ TestClient prefers httpx2 over httpx; declaring it here
    # makes the in-process TestClient (FastAPI re-exports starlette's) run on
    # httpx2 and silences the deprecation warning. Prod HTTP stays on httpx
    # (the SDKs + bootstrap fetch); httpx2 is test-only.
    "httpx2>=2.3.0",
    "mutmut>=3.5.0",
    "pytest-split",
]

# Import-direction contracts: no new reverse edge can creep back in. What they
# mean, what they do not see and the ignore_imports policy:
# docs/conventions/import-layering.md. A lower layer importing a higher one fails
# CI; higher importing lower is allowed (agent imports ava; everyone imports
# base).
#
# `services` is deliberately NOT a layer: gateway imports some of its packages
# (`services.derived.memory_indexer`, `services.wake.heartbeat`), so it does not sit above
# gateway, and `services.agent_runner.agent_host` is the one daemon intentionally above the
# agent kernel. The clean spine stays in its own layers contract;
# `services.agent_runner.agent_host` has a separate submodule contract for that reason.
# `plugins` is left ungoverned (the built-in ava_compact is intentionally
# coupled to the agent kernel, so agent <-> plugins is cyclic by design).
[tool.importlinter]
root_packages = ["base", "ava", "agent", "gateway", "cli", "ops", "services", "ava_builtins"]

# Explicit component entries are definition owners, not package barrels.
# The migration audit fails on unclassified boundaries; these declarations do
# not grant access to other modules, private members, or undeclared consumers.
[[tool.ava.public_contracts.components]]
module = "ava.tests.understand"
entry_modules = ["ava.tests.understand.provider_support"]

[[tool.ava.public_contracts.components]]
module = "tests.e2e"
entry_modules = [
    "tests.e2e.fixture_environment",
    "tests.e2e.process_support",
    "tests.e2e.fakes.scripted_model",
    "tests.e2e.fakes.scenario_recording",
]

[[tool.ava.public_contracts.components]]
module = "cli.commands.probe"
entry_modules = ["cli.commands.probe"]

[[tool.ava.public_contracts.components]]
module = "scripts.lint"
entry_modules = [
    "scripts.lint.code_structure",
    "scripts.lint.diagnostics.time_bomb",
]

[[tool.ava.public_contracts.components]]
module = "scripts.content_lint"
entry_modules = [
    "scripts.content_lint.lint_no_cjk",
    "scripts.content_lint.lint_no_tailnet",
]

[[tool.ava.public_contracts.components]]
module = "scripts.structure"
entry_modules = [
    "scripts.structure.lazy_modules",
    "scripts.structure.lint_common",
    "scripts.structure.patch_points",
    "scripts.structure.placement_evidence",
    "scripts.structure.service_units",
]

[[tool.ava.public_contracts.components]]
module = "scripts.lint.public_contracts"
entry_modules = ["scripts.lint.public_contracts"]

[[tool.ava.public_contracts.components]]
module = "scripts.codegen.sdk_surface"
entry_modules = ["scripts.codegen.sdk_surface.contracts"]

[[tool.ava.public_contracts.components]]
module = "scripts.audit"
entry_modules = ["scripts.audit.module_moves", "scripts.audit.where_used"]

[[tool.ava.public_contracts.components]]
module = "base.host.proc"
entry_modules = ["base.host.proc"]

[[tool.ava.public_contracts.components]]
module = "base.sessions.posixproc"
entry_modules = ["base.sessions.posixproc"]

[[tool.ava.public_contracts.components]]
module = "scripts.structure.cochange"
entry_modules = ["scripts.structure.cochange"]

[[tool.ava.public_contracts.components]]
module = "scripts.structure.imports"
entry_modules = [
    "scripts.structure.imports",
    "scripts.structure.imports.bindings",
    "scripts.structure.imports.cache",
    "scripts.structure.imports.executed",
    "scripts.structure.imports.facts",
]

[[tool.ava.public_contracts.components]]
module = "scripts.structure.placement"
entry_modules = ["scripts.structure.placement"]

[[tool.ava.public_contracts.components]]
module = "cli"
entry_modules = ["cli.main", "cli.parsers"]

[[tool.importlinter.contracts]]
name = "Layered architecture (base < ava < agent < gateway < cli)"
type = "layers"
layers = [
    "cli",
    "gateway",
    "agent",
    "ava",
    "base",
]

# The hosted runner is a supervised service that intentionally runs agent turns
# in-process. State that exceptional direction explicitly, rather than letting
# its narrow whitelist below make the broader services package look unlayered.
[[tool.importlinter.contracts]]
name = "Hosted agent runner (base < ava < agent < services.agent_runner.agent_host)"
type = "layers"
layers = [
    "services.agent_runner.agent_host",
    "agent",
    "ava",
    "base",
]

# A supervision daemon never imports the kernel, so a daemon's crash surface
# stays its own. `services.agent_runner.agent_host` is the single deliberate exception: the
# hosted agent-runner (future/infra/lifecycle/agent-runner-as-server.md) exists precisely
# to run agents' turns INSIDE a supervised daemon, so being the kernel is its
# job description rather than a coupling that crept in. Scoped to that one
# package so the rule keeps biting everywhere else — a second service reaching
# for `agent` still fails the contract.
[[tool.importlinter.contracts]]
name = "services must not import the agent kernel"
type = "forbidden"
source_modules = ["services"]
forbidden_modules = ["agent"]
# The exemption is enumerated per target module rather than written as
# `agent.**`, so importing anything NEW from the kernel is a contract failure
# that has to be argued for rather than a line someone slips under an existing
# blanket. `unmatched_ignore_imports_alerting` defaults to "error", so an entry
# that stops matching fails the run too — the list cannot rot in either
# direction, and its diff is the review signal.
ignore_imports = [
    "services.agent_runner.agent_host.* -> agent.process_boot",
    "services.agent_runner.agent_host.* -> agent.turn.runloop",
    "services.agent_runner.agent_host.host -> agent.db",
    "services.agent_runner.agent_host.pools -> agent.db",
    "services.agent_runner.agent_host.recovery.interrupt -> agent.db",
    "services.agent_runner.agent_host.* -> agent.graph",
    # The daemon is the composition root that builds the plugin `ExtensionRegistry` once the graph
    # (and with it every agent_runtime face) is loaded, and hands it to `AgentHost`.
    "services.agent_runner.agent_host.daemon -> agent.extensions",
    # The daemon hands the agent's own tool schema (`execute_code`) to the understanding-chunk
    # consumer loop, so its generation requests bind the same tools as the agent's own calls
    # (prefix-cache parity).
    "services.agent_runner.agent_host.daemon -> agent.llm",
    # The host catches native fatal errors to persist the halted/circuit state
    # and flush its checkpoint before settling the turn. Import only the taxonomy leaf.
    "services.agent_runner.agent_host.host -> agent.graph.llm_errors",
    # Compaction exhaustion is another expected native turn abort, handled by the host.
    "services.agent_runner.agent_host.host -> agent.hooks.compact",
    # The host owns the final durable checkpoint/trace link and the node-log tail.
    # The extracted failure boundary retains the same final trace correlation.
    "services.agent_runner.agent_host.invocation -> agent.turn.trace_checkpoint",
    "services.agent_runner.agent_host.host -> agent.graph.node_log",
    # Database recovery retains and repairs the original fenced continuation.
    "services.agent_runner.agent_host.db_recovery -> agent.impersonation",
    "services.agent_runner.agent_host.db_recovery -> agent.ownership.inbound",
    # DB recovery must preserve an accepted original native halt before startup repair.
    "services.agent_runner.agent_host.db_recovery -> agent.ownership.native_cancel",
    # The settlement boundary catches the inbound-owner fence's refusal at a
    # settled abort, so a replaced runtime makes the reconcile pass a logged
    # no-op instead of a second turn failure.
    "services.agent_runner.agent_host.settlement -> agent.ownership.inbound",
    "services.agent_runner.agent_host.* -> agent.ownership.hosted",
    # Completed invocation recovery reads its original lifecycle receipt and
    # handles the typed owner refusal without retargeting a replacement.
    "services.agent_runner.agent_host.invocation -> agent.ownership.inbound",
    "services.agent_runner.agent_host.invocation -> agent.ownership.hosted_completion",
    # The corpse reaper is the other half of the hosted ownership machinery
    # (split out of agent.ownership.hosted at its 800-line budget ceiling):
    # the host's beat runs the grace reap, and the settlement boundary runs
    # the prompt reap of a corpse that re-crashed under its own mark.
    "services.agent_runner.agent_host.recovery.crash -> agent.ownership.corpse_reap",
    "services.agent_runner.agent_host.host -> agent.ownership.corpse_reap",
    "services.agent_runner.agent_host.settlement -> agent.ownership.corpse_reap",
    # The hosted invocation driver shares the native takeover boundary: it
    # gates active leases and settles external state only after graph flush.
    "services.agent_runner.agent_host.host -> agent.impersonation",
    # Failure recovery preserves the same pre-settlement takeover preparation.
    "services.agent_runner.agent_host.invocation -> agent.impersonation",
    # The original native work boundary writes and flushes an attributed halt.
    "services.agent_runner.agent_host.invocation.native_work -> agent.impersonation",
    "services.agent_runner.agent_host.invocation.native_work -> agent.ownership.native_cancel",
    "services.agent_runner.agent_host.daemon -> agent.startup",
    "services.agent_runner.agent_host.db_recovery -> agent.startup",
    "services.agent_runner.agent_host.host -> agent.startup",
    "services.agent_runner.agent_host.settlement -> agent.startup",
    "services.agent_runner.agent_host.daemon -> agent.state",
    "services.agent_runner.agent_host.host -> agent.state",
    "services.agent_runner.agent_host.invocation.native_work -> agent.state",
    "services.agent_runner.agent_host.stall_guard -> agent.state",
    "services.agent_runner.agent_host.invocation -> agent.state",
    # Guarded compact invocation reuses native summary/transition/init owners;
    # these exact dependencies do not expose the kernel to other services.
    "services.agent_runner.agent_host.invocation.compact.apply -> agent.hooks.compact",
    "services.agent_runner.agent_host.invocation.compact.apply -> agent.impersonation",
    "services.agent_runner.agent_host.invocation.compact.apply -> agent.nodes",
    "services.agent_runner.agent_host.invocation.compact.apply -> agent.state",
    "services.agent_runner.agent_host.invocation.compact.checkpoint -> agent.hooks.compact",
    "services.agent_runner.agent_host.invocation.compact.checkpoint -> agent.state",
    "services.agent_runner.agent_host.invocation.compact.execute -> agent.graph.interrupt",
    "services.agent_runner.agent_host.invocation.compact.execute -> agent.hooks.compact",
    "services.agent_runner.agent_host.invocation.compact.execute -> agent.hooks.compact_anchor",
    "services.agent_runner.agent_host.invocation.compact.execute -> agent.state",
    "services.agent_runner.agent_host.invocation.compact.recovery -> agent.impersonation",
    "services.agent_runner.agent_host.invocation.compact.source -> agent.state",
    "services.agent_runner.agent_host.invocation.compact.lifecycle -> agent.ownership.hosted",
    "services.agent_runner.agent_host.invocation.compact.lifecycle -> agent.ownership.hosted_completion",
    "services.agent_runner.agent_host.invocation.compact.lifecycle -> agent.ownership.lifecycle_intent",
]

# The one reverse edge base must never grow: `base` is the bottom layer,
# and `services` sits above it (daemons that import gateway). The alerts
# module used to import services.entrypoints.im_bridge.copy for its IM templates — moved
# down to base/telemetry/alerts/copy.py (tech audit 2026-08-24 P1); this contract
# locks the direction so no new base -> services edge can creep back in.
[[tool.importlinter.contracts]]
name = "base must not import services"
type = "forbidden"
source_modules = ["base"]
forbidden_modules = ["services"]

# `services` is not a layer, but one direction is fixed: the supervised daemons
# sit below the `cli` command surface, which starts, stops and reports on them,
# and a daemon never reaches back into it. A primitive both sides need (a
# data-plane path, a listener probe, a URL validator) lives in `base` and both
# import it. There is no `ignore_imports` list: a function-local import counts
# like a module-level one, so a lazy `from cli... import` inside a service
# fails too. Not seen by import-linter: a string-form
# `importlib.import_module("cli....")` and the test modules under
# `services/**/tests` (no `__init__.py`, so not in the graph).
[[tool.importlinter.contracts]]
name = "services must not import cli"
type = "forbidden"
source_modules = ["services"]
forbidden_modules = ["cli"]

# Ops layer: base < ops < {gateway, cli}. The ops module (Spec / Status /
# controllers) sits above base and is consumed by gateway + cli (and by the
# services daemons, which become thin mains over the controllers) — but must never
# reach up into them. A standalone layers contract (not folded into the main stack)
# because ops's relationship to ava/agent is still being untangled. The gateway
# <-> cli HTTP API contracts that BOTH speak (MachineStatus / Config*) are
# downshifted to `base.api_contracts` — below both ops and gateway — so cli
# decodes a gateway response without importing up; ops keeps only the
# gateway<->runner RPC-shared closure (ops/rpc_schemas/__init__.py). See
# ops/docs/ops-module.md.
[[tool.importlinter.contracts]]
name = "Ops layer (base < ops < {gateway, cli})"
type = "layers"
layers = [
    "gateway | cli",
    "ops",
    "base",
]

[tool.ruff]
line-length = 100
# Tool caches unify under `.cache/<tool>/` (docs/conventions/dev-setup.md "Tool caches").
cache-dir = ".cache/ruff"
# No vendored third-party Python ships in-tree today. When some does, exclude it
# here: vendored payload is kept byte-identical to upstream so a future sync can
# diff it directly, and reformatting or relinting it would turn every upstream
# comparison into pure noise. Ava-authored prose beside it is still reviewed
# normally; only the untouched upstream payload is exempt. Inventory and the
# license bar a pack must clear: ava_builtins/skills/VENDORED.md.

[tool.ruff.lint]
external = ["S112"]  # checked by a separate pre-commit Ruff invocation; keep its noqa reasons valid
select = [
    "E", "W",       # pycodestyle
    "F",            # pyflakes
    "I",            # isort
    "B",            # bugbear
    "UP",           # pyupgrade
    "N",            # pep8-naming
    "SIM",          # simplify
    "RUF",          # ruff-specific
    "ARG",          # unused arguments
    "C4",           # comprehensions
    "PTH",          # pathlib over os.path
    "PIE",          # misc
    "RET",          # return statements
    "Q",            # quotes
    "RSE",          # raise statements
    "ERA",          # commented-out code
    "DTZ",          # datetime timezone
    "S",            # bandit security
    "TID251", "TID253",  # banned imports; package-relative style has a separate owner
    "LOG",          # logging
    "PL",           # pylint
    "TRY",          # tryceratops (try/except best practices)
    "FBT",          # boolean trap
    "ANN",          # type annotations
    "T20",          # flake8-print: framework code logs via base.log.logger, not print()
]
ignore = [
    "E501",         # line too long — formatter handles
    "S102",         # exec() is core to this design
    "S112",         # checked separately with typed exceptions off; the shared
                    # flake8-bandit switch needed for S110 would flag 138
                    # existing typed `except: continue` paths outside this task
    "PLR0911",      # too many return statements — dispatch-style match/case naturally has many returns
    "PLR0912",      # too many branches — top-level orchestration functions (cmd_start etc.) naturally have many branches
    "PLR0913",      # too many arguments
    "PLR0917",      # too many positional arguments — same policy as PLR0913
    "PLR2004",      # magic value comparisons
    "PLC0415",      # import inside function
    "TRY003",       # long exception messages
    "TRY300",       # consider moving to else block
    "S607",         # partial executable path — we resolve git / npx / uvx all via PATH,
                    # don't pin absolute paths (varying across dev / docker environments is a feature, not a bug)
    "ANN401",       # allow Any — LangGraph state dict / SDK reflection / MCP dynamic
                    # tool dispatch etc. naturally can't be precisely typed
    "PLC0414",      # `from X import Y as Y` is PEP 484 explicit re-export, required under pyright
                    # strict; ruff by default treats alias-equal-to-original as a noop, conflicting
                    # with typed Python convention. Allowed across the codebase.
]

[tool.ruff.lint.flake8-bandit]
# Match the former fail-fast lint: typed handlers with lone `pass` count too.
check-typed-exception = true

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Graph-run dependencies belong to the existing Runtime[AvaContext], not a
# second implicit ContextVar context. Outside a graph run, pass the caller's
# context explicitly; get_runtime() is not a process-wide service locator.
# contextvars allowlist lock (user ruling 2026-08-27, audit #3607): contextvar
# usage is a mechanism-layer concern — LangGraph's runtime itself propagates
# contextvars (pregel copy_context / get_runtime), and the SDK / log /
# telemetry / retry-policy readers sit outside node signatures, so a blanket
# ban is not possible. New uses need a written justification in the PR
# description before joining the per-file-ignores allowlist below.
"contextvars" = { msg = "Use LangGraph Runtime[AvaContext] for graph-run dependencies and explicit parameters outside a graph run. Do not create a second implicit context. contextvars is restricted to existing mechanism owners; see docs/conventions/python-conventions.md." }

[tool.ruff.lint.per-file-ignores]
# `tests/*` is the top-level tests directory; `**/tests/*` every package's own
# `<pkg>/**/tests/` (tests live beside the code they prove).
"tests/*" = ["S101", "PLR2004", "SLF001", "ARG001", "ARG002", "ANN", "FBT", "RUF001", "RUF002", "RUF003"]
"**/tests/*" = ["S101", "PLR2004", "SLF001", "ARG001", "ARG002", "ANN", "FBT", "RUF001", "RUF002", "RUF003"]
"demos/*" = ["RUF001", "RUF002", "RUF003", "ARG001", "ERA001", "S108"]
# schedules/* are version-controlled deployment templates (runnable scripts
# referenced by the ops docs), not runtime source: exempt them from source-level
# rules (typing, ambiguous unicode, security heuristics) so they stay readable.
# DTZ is deliberately NOT exempt: these scripts decide when things fire, so a
# naive datetime here is a scheduling bug, not a style nit.
"schedules/*" = ["ANN", "RUF003", "S", "PTH", "TID", "I", "UP", "ERA", "Q", "RET", "ARG", "PLR2004", "T201"]
# FBT: a boolean positional in a test is the value-under-test (e.g.
# `validate("browser_enabled", True)`), not a real boolean-trap call site.
# .agents/skills (the kernel-contributor project skills) carry the same kind of
# runnable reference CLIs (e.g. ava-self-development's changelog generator).
".agents/skills/*/reference/*.py" = ["ERA001", "T20", "B904", "F841", "RUF059", "PLW1510", "S110", "S112", "S603", "C401", "PLR0915", "N806"]
# Skill scripts are runnable CLIs the agent invokes via bash: print() is their
# stdout contract (T20); they drive the OS through hardcoded subprocess commands
# (open / screencapture / osascript / pbcopy) writing to a /tmp scratch dir, so
# the subprocess/temp-file security lints are noise (S603, S108); boolean flags
# and best-effort subprocess.run are fine here (FBT, PLW1510, PTH, ANN).
