name: Agent observation proof
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'shared/agent_observation.py'
      - 'shared/agent_snapshot.py'
      - 'shared/agent_roster.py'
      - 'shared/live_announce.py'
      - 'services/heartbeat/**'
      - 'gateway/routers/_inspect*.py'
      - 'gateway/routers/agent_inspect.py'
      - 'gateway/routers/agents*.py'
      - 'gateway/schemas/**'
      - 'gateway/app.py'
      - 'scripts/codegen-types.sh'
      - 'scripts/dump_openapi.py'
      - 'tests/shared/test_agent_observation.py'
      - 'tests/shared/test_live_announce.py'
      - 'tests/shared/test_agent_snapshot_scope.py'
      - 'tests/services/test_heartbeat_liveness.py'
      - 'tests/gateway/test_agent_inspect.py'
      - 'tests/gateway/test_agents_endpoints.py'
      - 'ui/web/src/lib/agent-observation*'
      - 'ui/web/src/components/agent-row*'
      - 'ui/web/src/components/inspector-panel*'
      - 'ui/web/src/lib/types*.ts'
      - 'ui/web/openapi.json'
      - 'ui/web/package*.json'
      - 'ui/web/vitest*'
      - 'tests/conftest.py'
      - 'tests/_*.py'
      - 'db/schema.sql'
      - 'migrations/**'
      - '.github/actions/install-pg-redis/**'
      - '.github/actions/uv-sync/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/observation-proof.yml'
permissions:
  contents: read
jobs:
  prove-observation:
    if: github.head_ref == 'ava-5344-observation-freshness'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AVA_DB_URL: postgresql://unused@127.0.0.1:1/unused
      AVA_REDIS_URL: redis://127.0.0.1:1/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: 0.10.2
      - uses: ./.github/actions/install-pg-redis
      - uses: ./.github/actions/uv-sync
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: npm ci
        working-directory: ui/web
      - name: Generate authoritative schema types
        run: bash scripts/codegen-types.sh
      - name: Verify existing database observations and failure distinction
        run: uv run pytest tests/shared/test_agent_observation.py tests/shared/test_live_announce.py tests/services/test_heartbeat_liveness.py tests/gateway/test_agent_inspect.py tests/gateway/test_agents_endpoints.py tests/shared/test_agent_snapshot_scope.py -q
      - name: Verify rendered observation states
        if: success() || failure()
        working-directory: ui/web
        run: npx vitest run src/lib/agent-observation.test.ts src/components/agent-row.test.tsx src/components/inspector-panel.test.tsx
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: observation-types-${{ github.event.pull_request.head.sha }}
          path: |
            ui/web/src/lib/types-generated.ts
            ui/web/openapi.json
          if-no-files-found: error
