name: Agent observation proof
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  prove-observation:
    if: github.head_ref == 'ava-5344-observation-freshness'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AVA_DB_URL: postgresql://unused@127.0.0.1:1/unused
      AVA_REDIS_URL: redis://127.0.0.1:1/0
      AVA_RUNNER_MODE: process
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.10.2
      - uses: ./.github/actions/install-pg-redis
      - run: uv sync --frozen
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci
        working-directory: ui/web
      - name: Generate authoritative schema types
        run: bash scripts/codegen-types.sh
      - name: Verify existing database observations and failure distinction
        run: uv run pytest tests/shared/test_agent_observation.py tests/services/test_heartbeat_liveness.py tests/gateway/test_agent_inspect.py -q
      - name: Verify rendered observation states
        if: success() || failure()
        working-directory: ui/web
        run: npx vitest run src/lib/agent-observation.test.ts src/components/agent-row.test.tsx src/components/inspector-panel.test.tsx
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: observation-types-${{ github.event.pull_request.head.sha }}
          path: ui/web/src/lib/types-generated.ts
          if-no-files-found: error
