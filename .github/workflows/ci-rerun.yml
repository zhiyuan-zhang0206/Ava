name: CI failed-job rerun

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  rerun-failed-jobs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      RUN_EVENT: ${{ github.event.workflow_run.event }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
    steps:
      - name: Rerun failed CI jobs once
        id: rerun
        shell: bash
        run: |
          set -euo pipefail
          conclusion="${RUN_CONCLUSION,,}"
          case "$conclusion" in
            failure|timed_out|action_required|startup_failure) ;;
            *) echo "CI conclusion $conclusion does not need a rerun"; exit 0 ;;
          esac
          case "$RUN_EVENT" in
            push|pull_request) ;;
            *) echo "CI event $RUN_EVENT is not eligible for automatic reruns"; exit 0 ;;
          esac
          # GitHub's workflow-run REST schema increments run_attempt on reruns:
          # https://docs.github.com/rest/actions/workflow-runs#get-a-workflow-run
          # Acting only on attempt 1 prevents a failed rerun from looping.
          if [ "$RUN_ATTEMPT" -gt 1 ]; then
            echo "CI run attempt $RUN_ATTEMPT has already been rerun"
            exit 0
          fi
          # Check current authority, not merely the newest run of an obsolete SHA.
          # This GET cannot fence a later synchronize event; ci.yml therefore
          # isolates concurrency by immutable SHA as the race-safety boundary.
          if [ "$RUN_EVENT" = pull_request ]; then
            if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
              echo "Cannot confirm a unique PR for this run; refusing automatic retry"
              exit 0
            fi
            observed="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
              --jq '[.state, .head.sha, .base.repo.full_name, .head.repo.full_name] | @tsv')"
            IFS=$'\t' read -r state current_sha base_repo head_repo <<< "$observed"
            if [ "$state" != open ] || [ "$current_sha" != "$HEAD_SHA" ] || \
               [ "$base_repo" != "$GITHUB_REPOSITORY" ] || [ "$head_repo" != "$HEAD_REPO" ]; then
              echo "PR is closed, superseded, or repository identity differs; refusing retry"
              exit 0
            fi
          else
            if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ] || [ -z "$HEAD_BRANCH" ]; then
              echo "Push repository/branch identity is unavailable; refusing retry"
              exit 0
            fi
            current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_BRANCH}" --jq .sha)"
            if [ "$current_sha" != "$HEAD_SHA" ]; then
              echo "Push has been superseded; refusing retry"
              exit 0
            fi
          fi
          # On pushes, this workflow shares HEAD_SHA with CI and would otherwise be newest.
          # Filter to CI only; PR rerun heads are on default branch, not the PR.
          newest_run_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&per_page=100" \
              --jq '[.workflow_runs[] | select(.name == "CI") | .id] | max'
          )"
          if [ "$RUN_ID" != "$newest_run_id" ]; then
            echo "CI run ${RUN_ID} is not the newest run (${newest_run_id}) for ${HEAD_SHA}"
            exit 0
          fi

          # The first job-level rerun starts a new attempt, making later calls fail with 403.
          # Rerun all failed jobs and their dependents atomically at the run level instead.
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/rerun-failed-jobs"
          echo "reran=true" >> "$GITHUB_OUTPUT"

      - name: Remind maintainers after a PR rerun
        if: ${{ steps.rerun.outputs.reran == 'true' && env.RUN_EVENT == 'pull_request' && env.PR_NUMBER != '' }}
        shell: bash
        run: |
          set -euo pipefail
          marker="<!-- ci-rerun-reminder:${HEAD_SHA} -->"
          if gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
            --jq '.[].body' | grep -Fq "$marker"; then
            echo "PR ${PR_NUMBER} already has the rerun reminder for ${HEAD_SHA}"
            exit 0
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            -f body="$marker
          Failed CI jobs were re-run once. If this run is still red, this PR was removed from the merge queue (if it was queued); a maintainer must run @mergifyio queue once CI is green."
