name: Normal release continuation contracts
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  contracts:
    if: github.head_ref == 'ava-codex-normal-continuation'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AVA_DB_URL: postgresql://unused@127.0.0.1:1/unused
      AVA_REDIS_URL: redis://127.0.0.1:1/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.10.2
      - uses: ./.github/actions/install-pg-redis
      - run: uv sync --frozen
      - name: Existing updater and real publication contracts
        run: |
          mkdir -p proof
          timeout --kill-after=15 900 uv run pytest tests/cli/test_release_normal.py tests/cli/test_update_agent_runner.py tests/shared/test_updater_handoff.py tests/shared/test_managed_writer_publication.py -vv -o faulthandler_timeout=120 --junitxml=proof/normal.xml
      - run: uv run pyright cli/commands/_release_selector.py cli/commands/_release_services.py cli/commands/_update_normal_release.py shared/runtime_service_identity.py tests/cli/test_release_normal.py
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: normal-release-contracts-${{ github.event.pull_request.head.sha }}
          path: proof/
          if-no-files-found: error
