# CI — the repo's only gate. GitHub-hosted ubuntu runners.
#
# Hosted minutes are free and unmetered for public repos and public forks, so one
# lane runs everywhere with no canonical-vs-fork gating — and the same economics
# make SHARDING the speed lever: the pytest suite dominates wall clock, so it
# fans out over pytest-split shards (duration-balanced via the committed
# .test_durations — slow tests only, >=0.2s, 87% of total runtime; tests
# absent from it are costed at the file average. Refresh occasionally with
# `pytest --store-durations` + trimming to >=0.2s).
# There is no self-hosted fleet and no runner provisioner: a hosted runner
# starts bare, so each job installs its own toolchain inline — uv, Node 22,
# Postgres 17 + Redis server binaries on PATH (the suite self-provisions
# throwaway native clusters via tests/_containers.py), and Playwright chromium
# for e2e (browser dir cached; system deps installed per run).
#
# CHANGE-CLASS GATING (the CI pyramid's top): the `classify` job maps the PR
# diff through shared/repo_change.py — the same classifier `ava cluster update`
# uses for selective restart — and suites skip when their side is untouched:
# docs-only skips everything, frontend-only skips the backend suite,
# backend-only skips the frontend suite. e2e runs whenever EITHER side changed
# (it is the integration net). Draft PRs skip CI entirely until
# ready_for_review. Skipped required checks satisfy branch protection; the
# Mergify conditions accept success-or-skipped for the same reason.
#
# Branch protection and the Mergify queue key on exactly three check names —
# "backend (pytest + pyright)", "frontend (eslint + tsc + vitest)",
# "e2e (Playwright happy path)". The backend and e2e names are AGGREGATOR jobs
# that fan in their shards (and, for backend, combine coverage and apply the
# gate), so sharding never touches the protection/queue configuration.
#
# AVA_DB_URL / AVA_REDIS_URL are pointed at unreachable sentinel ports on
# purpose. The suite must provision its own throwaway cluster; a sentinel turns
# "a test quietly reached a real data plane" into a connection error rather than
# a silent pass.
#
# `uses:` is pinned to a commit SHA with the version in a trailing comment — a
# floating tag (@v6) is a mutable pointer the action's owner can repoint, i.e. a
# supply-chain write into every run. .github/dependabot.yml keeps the pins fresh
# via reviewable PRs.

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'ava_builtins/skills/**'
      - '**/*.md'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    # Which sides does this diff touch? Runs shared/repo_change.py (stdlib-only,
    # exec'd directly — no venv) over the PR's changed paths. push/dispatch
    # events always report both sides changed: main must always verify fully.
    name: classify change
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Draft PRs skip CI — EXCEPT Mergify's speculative batch drafts
    # (mergify/merge-queue/*), which are exactly the runs that must verify.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false || startsWith(github.head_ref, 'mergify/merge-queue') }}
    outputs:
      frontend: ${{ steps.decide.outputs.frontend }}
      backend: ${{ steps.decide.outputs.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "backend=true"  >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$(git merge-base "$BASE_SHA" HEAD)"...HEAD > /tmp/changed.txt
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          ns: dict[str, object] = {}
          exec(Path("shared/repo_change.py").read_text(), ns)
          paths = Path("/tmp/changed.txt").read_text().splitlines()
          frontend, backend = ns["classify_change"](paths)
          print(f"frontend={str(frontend).lower()}")
          print(f"backend={str(backend).lower()}")
          EOF
          cat "$GITHUB_OUTPUT"

  backend-static:
    name: backend static (ruff + pyright + migration smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [classify]
    if: ${{ needs.classify.outputs.backend == 'true' }}
    env:
      AVA_DB_URL: postgresql://unused@127.0.0.1:1/unused
      AVA_REDIS_URL: redis://127.0.0.1:1/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install Postgres 17 + Redis (server binaries on PATH)
        uses: ./.github/actions/install-pg-redis

      - name: Install Python deps
        run: uv sync --frozen

      - name: Run ruff check
        run: uv run ruff check
      - name: Run ruff format check
        run: uv run ruff format --check
      - name: Lint migrations
        run: uv run python scripts/lint_migrations.py
      - name: Lint clock lattice
        run: uv run python scripts/lint_clock_lattice.py
      - name: Apply migrations to fresh DB + trigger smoke
        run: uv run python scripts/migration_smoke.py
      - name: Run pyright
        run: uv run pyright

  backend-shard:
    name: backend shard (${{ matrix.group }}/8)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [classify]
    if: ${{ needs.classify.outputs.backend == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      AVA_DB_URL: postgresql://unused@127.0.0.1:1/unused
      AVA_REDIS_URL: redis://127.0.0.1:1/0
      # One data file per shard so the aggregator can `coverage combine` them.
      COVERAGE_FILE: coverage-data-${{ matrix.group }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install Postgres 17 + Redis (server binaries on PATH)
        uses: ./.github/actions/install-pg-redis

      - name: Install Python deps
        run: uv sync --frozen

      - name: Run pytest shard
        run: >
          uv run pytest tests/ -q --ignore=tests/e2e -n 4
          --splits 8 --group ${{ matrix.group }}
          --cov=agent --cov=ava --cov=gateway --cov=shared --cov=ui

      - name: Upload coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-shard-${{ matrix.group }}
          path: coverage-data-${{ matrix.group }}

      - name: Upload pg fixture logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pg-fixture-logs-shard-${{ matrix.group }}
          # The fixture only writes logs when it fails to bring pg up, so an
          # empty dir is the normal case and must not fail the upload.
          if-no-files-found: ignore
          path: tmp/pg-fixture-logs/

  backend:
    # The aggregator carrying the branch-protection / Mergify check name:
    # skipped (= satisfied) when the diff has no backend side; otherwise green
    # iff the static job and every pytest shard are green AND the combined
    # coverage clears the gate.
    name: backend (pytest + pyright)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [classify, backend-static, backend-shard]
    if: ${{ always() && needs.classify.result == 'success' && needs.classify.outputs.backend == 'true' }}
    steps:
      - name: Verify shard results
        if: ${{ needs.backend-static.result != 'success' || needs.backend-shard.result != 'success' }}
        run: |
          echo "a backend job did not succeed: static=${{ needs.backend-static.result }} shards=${{ needs.backend-shard.result }}"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install Python deps
        run: uv sync --frozen

      - name: Download shard coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-shard-*
          merge-multiple: true

      - name: Combine coverage + gate
        env:
          BACKEND_COVERAGE_THRESHOLD: "80"
        run: |
          uv run coverage combine coverage-data-*
          uv run coverage xml
          uv run python -c "
          import sys, xml.etree.ElementTree as ET, os
          pct = round(float(ET.parse('coverage.xml').getroot().attrib['line-rate']) * 100, 1)
          threshold = float(os.environ.get('BACKEND_COVERAGE_THRESHOLD', 75))
          print(f'Backend line coverage: {pct}% (threshold: {threshold}%)')
          sys.exit(1) if pct < threshold else None
          "

  frontend:
    name: frontend (eslint + tsc + vitest)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [classify]
    if: ${{ needs.classify.outputs.frontend == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/web/package-lock.json

      - name: Install frontend deps
        working-directory: ui/web
        run: npm ci
      - name: TypeScript typecheck (tsc --noEmit)
        working-directory: ui/web
        run: npx tsc --noEmit
      - name: ESLint
        working-directory: ui/web
        run: npx eslint . --max-warnings 0
      - name: Unit tests (vitest run)
        working-directory: ui/web
        run: npx vitest run --coverage
      # Quarantined timing-sensitive tests (src/**/flaky/**) run serially in
      # their own vitest process — see ui/web/vitest.flaky.config.ts.
      - name: Flaky unit tests (vitest run, serial)
        working-directory: ui/web
        run: npx vitest run --config vitest.flaky.config.ts

  e2e-shard:
    name: e2e shard (${{ matrix.group }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [classify]
    # e2e is the integration net: it runs whenever EITHER side changed.
    if: ${{ needs.classify.outputs.frontend == 'true' || needs.classify.outputs.backend == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    env:
      AVA_DB_URL: postgresql://unused@127.0.0.1:1/unused
      AVA_REDIS_URL: redis://127.0.0.1:1/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/web/package-lock.json

      - name: Install Postgres 17 + Redis (server binaries on PATH)
        uses: ./.github/actions/install-pg-redis

      - name: Install Python deps
        run: uv sync --frozen
      - name: Install frontend deps
        working-directory: ui/web
        run: npm ci

      - name: Cache Playwright chromium
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Install Playwright chromium
        # Cached browser -> only the system deps apt pass runs.
        run: uv run playwright install --with-deps chromium

      - name: Run e2e tests
        # tests/e2e has no entries in .test_durations (it is generated from the
        # backend suite), so pytest-split estimates them at the file average —
        # effectively an even split by count.
        run: >
          uv run pytest tests/e2e/ -v -n 2
          --splits 4 --group ${{ matrix.group }}

      - name: Upload e2e logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs-shard-${{ matrix.group }}
          path: tmp/e2e-logs/

  e2e:
    # Aggregator carrying the branch-protection / Mergify check name; skipped
    # (= satisfied) on docs-only diffs.
    name: e2e (Playwright happy path)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [classify, e2e-shard]
    if: ${{ always() && needs.classify.result == 'success' && (needs.classify.outputs.frontend == 'true' || needs.classify.outputs.backend == 'true') }}
    steps:
      - name: Verify shard results
        run: |
          result="${{ needs.e2e-shard.result }}"
          echo "e2e shards: $result"
          [ "$result" = "success" ] || exit 1
