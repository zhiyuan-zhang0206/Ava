# Public-repo CI — GitHub-hosted ubuntu runners.
#
# NOT active here: this lives under deploy/, not .github/workflows/, so the
# private repo's CI (the self-hosted native lane in .github/workflows/ci.yml) is
# untouched. The publish recipe (future/going-public.md) swaps THIS file in
# as .github/workflows/ci.yml when the repo goes public.
#
# Why the swap: GitHub-hosted runners are free and unmetered for PUBLIC repos and
# for public forks, with no per-minute billing. The self-hosted native runners
# exist only because the private repo would otherwise burn metered minutes; once
# public that reason is gone, forks get CI for free on GitHub's runners, and the
# Hetzner CI runners can be retired. No canonical-vs-fork gating is needed — one
# lane runs everywhere.
#
# Same three jobs and commands as the private ci.yml, but each provisions inline
# what the self-hosted runner supplied out-of-band: uv, Node 22, Postgres 17 +
# Redis server binaries on PATH (the suite self-provisions throwaway native
# clusters via tests/_containers.py), and Playwright chromium for e2e.
#
# NOT validated until the repo is public and a real run exercises the ubuntu
# provisioning (PGDG pg17, setup-uv, playwright install).

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'ava_builtins/skills/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend (pytest + pyright)
    runs-on: ubuntu-24.04
    env:
      AVA_DB_URL: postgresql://unused@127.0.0.1:1/unused
      AVA_REDIS_URL: redis://127.0.0.1:1/0
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Postgres 17 + Redis (server binaries on PATH)
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-17 redis-server
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Install Python deps
        run: uv sync --frozen

      - name: Run ruff check
        run: uv run ruff check
      - name: Run ruff format check
        run: uv run ruff format --check
      - name: Lint migrations
        run: uv run python scripts/lint_migrations.py
      - name: Lint clock lattice
        run: uv run python scripts/lint_clock_lattice.py
      - name: Apply migrations to fresh DB + trigger smoke
        run: uv run python scripts/migration_smoke.py
      - name: Run pyright
        run: uv run pyright
      - name: Run pytest
        run: uv run pytest tests/ -q --ignore=tests/e2e -n 4 --cov=agent --cov=ava --cov=gateway --cov=shared --cov=ui --cov-report=xml

      - name: Upload pg fixture logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pg-fixture-logs
          # Mirror of the private CI step — see .github/workflows/ci.yml.
          if-no-files-found: ignore
          path: tmp/pg-fixture-logs/

      - name: Coverage gate
        env:
          BACKEND_COVERAGE_THRESHOLD: "80"
        run: |
          uv run python -c "
          import sys, xml.etree.ElementTree as ET, os
          pct = round(float(ET.parse('coverage.xml').getroot().attrib['line-rate']) * 100, 1)
          threshold = float(os.environ.get('BACKEND_COVERAGE_THRESHOLD', 75))
          print(f'Backend line coverage: {pct}% (threshold: {threshold}%)')
          sys.exit(1) if pct < threshold else None
          "

  frontend:
    name: frontend (eslint + tsc + vitest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: TypeScript typecheck (tsc --noEmit)
        working-directory: frontend
        run: npx tsc --noEmit
      - name: ESLint
        working-directory: frontend
        run: npx eslint . --max-warnings 0
      - name: Unit tests (vitest run)
        working-directory: frontend
        run: npx vitest run --coverage

  e2e:
    name: e2e (Playwright happy path)
    runs-on: ubuntu-24.04
    env:
      AVA_DB_URL: postgresql://unused@127.0.0.1:1/unused
      AVA_REDIS_URL: redis://127.0.0.1:1/0
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Postgres 17 + Redis (server binaries on PATH)
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-17 redis-server
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Install Python deps
        run: uv sync --frozen
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install Playwright chromium
        run: uv run playwright install --with-deps chromium
      - name: Run e2e tests
        run: uv run pytest tests/e2e/ -v -n 2

      - name: Upload e2e logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs
          path: tmp/e2e-logs/
