# CI — the repo's only gate. GitHub-hosted ubuntu runners.
#
# Hosted minutes are free and unmetered for public repos and public forks, so one
# lane runs everywhere with no canonical-vs-fork gating. There is no self-hosted
# fleet and no runner provisioner: a hosted runner starts bare, so each job
# installs its own toolchain inline — uv, Node 22, Postgres 17 + Redis server
# binaries on PATH (the suite self-provisions throwaway native clusters via
# tests/_containers.py), and Playwright chromium for e2e.
#
# AVA_DB_URL / AVA_REDIS_URL are pointed at unreachable sentinel ports on
# purpose. The suite must provision its own throwaway cluster; a sentinel turns
# "a test quietly reached a real data plane" into a connection error rather than
# a silent pass.
#
# `uses:` is pinned to a commit SHA with the version in a trailing comment — a
# floating tag (@v6) is a mutable pointer the action's owner can repoint, i.e. a
# supply-chain write into every run. .github/dependabot.yml keeps the pins fresh
# via reviewable PRs.

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'ava_builtins/skills/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend (pytest + pyright)
    runs-on: ubuntu-24.04
    # Generous vs. the observed run, tight vs. GitHub's 6h default: a job that
    # blows past this is hung, not slow.
    timeout-minutes: 45
    env:
      AVA_DB_URL: postgresql://unused@127.0.0.1:1/unused
      AVA_REDIS_URL: redis://127.0.0.1:1/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0

      - name: Install Postgres 17 + Redis (server binaries on PATH)
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-17 redis-server
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Install Python deps
        run: uv sync --frozen

      - name: Run ruff check
        run: uv run ruff check
      - name: Run ruff format check
        run: uv run ruff format --check
      - name: Lint migrations
        run: uv run python scripts/lint_migrations.py
      - name: Lint clock lattice
        run: uv run python scripts/lint_clock_lattice.py
      - name: Apply migrations to fresh DB + trigger smoke
        run: uv run python scripts/migration_smoke.py
      - name: Run pyright
        run: uv run pyright
      - name: Run pytest
        run: uv run pytest tests/ -q --ignore=tests/e2e -n 4 --cov=agent --cov=ava --cov=gateway --cov=shared --cov=ui --cov-report=xml

      - name: Upload pg fixture logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pg-fixture-logs
          # The fixture only writes logs when it fails to bring pg up, so an
          # empty dir is the normal case and must not fail the upload.
          if-no-files-found: ignore
          path: tmp/pg-fixture-logs/

      - name: Coverage gate
        env:
          BACKEND_COVERAGE_THRESHOLD: "80"
        run: |
          uv run python -c "
          import sys, xml.etree.ElementTree as ET, os
          pct = round(float(ET.parse('coverage.xml').getroot().attrib['line-rate']) * 100, 1)
          threshold = float(os.environ.get('BACKEND_COVERAGE_THRESHOLD', 75))
          print(f'Backend line coverage: {pct}% (threshold: {threshold}%)')
          sys.exit(1) if pct < threshold else None
          "

  frontend:
    name: frontend (eslint + tsc + vitest)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: TypeScript typecheck (tsc --noEmit)
        working-directory: frontend
        run: npx tsc --noEmit
      - name: ESLint
        working-directory: frontend
        run: npx eslint . --max-warnings 0
      - name: Unit tests (vitest run)
        working-directory: frontend
        run: npx vitest run --coverage

  e2e:
    name: e2e (Playwright happy path)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AVA_DB_URL: postgresql://unused@127.0.0.1:1/unused
      AVA_REDIS_URL: redis://127.0.0.1:1/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0

      - name: Install Postgres 17 + Redis (server binaries on PATH)
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-17 redis-server
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Install Python deps
        run: uv sync --frozen
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install Playwright chromium
        run: uv run playwright install --with-deps chromium
      - name: Run e2e tests
        run: uv run pytest tests/e2e/ -v -n 2

      - name: Upload e2e logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs
          path: tmp/e2e-logs/
