# One-off check: confirm the repository's Android release signing secrets hold the
# Meiva release key. Never builds, publishes or uploads anything.
#
# Lifecycle: this file exists only long enough to run once — delete it in a
# follow-up PR immediately after the check passes. It decodes a secret, so it
# must not stay on main.
#
# Discipline: the keystore and its password never reach stdout, the log, an
# argument list or an artifact. The password reaches keytool through an
# environment variable (`-storepass:env`); the decoded file is removed before
# the step ends. Only the alias and the certificate fingerprint are printed —
# both are public.
name: Verify Android signing secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Compare the release keystore with the expected certificate
    # Only the canonical branch may run this: a branch that edits this file
    # should never be the one that reads the secrets.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Compare alias and certificate fingerprint
        shell: bash
        # The secrets are scoped to this step on purpose: the Java setup step
        # above must not receive them at all.
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_ALIAS: meiva
          # Colon form from `keytool -list -v`; keeping the separators also keeps
          # the value out of generic high-entropy secret scans.
          EXPECTED_SHA256: '24:37:85:2F:5D:20:F2:0E:E9:76:35:61:47:3C:CF:37:5A:C5:42:BD:1E:BE:7F:D5:7A:0C:50:3E:08:24:14:A2'
        run: |
          set -euo pipefail
          umask 077
          ks="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$ks"' EXIT

          printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > "$ks"

          if ! listing=$(keytool -list -v -keystore "$ks" \
                          -alias "$ANDROID_KEY_ALIAS" \
                          -storepass:env ANDROID_KEY_PASSWORD 2>/dev/null); then
            echo "keytool rejected the keystore, the alias or the password" >&2
            exit 1
          fi

          alias_name=$(printf '%s\n' "$listing" | sed -n 's/^Alias name: //p')
          # A rotation chain can list several certificates; the first SHA256
          # line is the leaf — the one that actually signs the APK.
          fingerprint=$(printf '%s\n' "$listing" | sed -n 's/^[[:space:]]*SHA256: //p' | head -1)

          rm -f "$ks"
          trap - EXIT

          echo "alias=${alias_name}"
          echo "sha256=${fingerprint}"

          test "$alias_name" = "$EXPECTED_ALIAS" || {
            echo "alias mismatch: expected $EXPECTED_ALIAS" >&2; exit 1; }
          test "$fingerprint" = "$EXPECTED_SHA256" || {
            echo "certificate mismatch: the secrets do not hold the Meiva release key" >&2; exit 1; }

          echo "OK: the signing secrets hold the Meiva release key"
