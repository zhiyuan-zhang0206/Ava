name: Reparent incident evidence
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['tests/shared/process_evidence.py', 'tests/shared/test_posixproc.py', '.github/workflows/reparent-evidence.yml']
permissions:
  contents: read
jobs:
  capture-reparent-evidence:
    if: github.head_ref == 'ava-stability-reparent-evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AVA_DB_URL: postgresql://unused@127.0.0.1:1/unused
      AVA_REDIS_URL: redis://127.0.0.1:1/0
      AVA_RUNNER_MODE: process
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.10.2
      - uses: ./.github/actions/install-pg-redis
      - run: uv sync --frozen
      - name: Capture strict detach and late-child assertions
        run: |
          mkdir -p proof
          timeout 180 uv run pytest tests/shared/test_posixproc.py -k 'new_session_reparents_to_init_no_zombie or kill_session_group_kill_reaps_late_spawned_child' -q --junitxml=proof/reparent.xml
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reparent-evidence-${{ github.event.pull_request.head.sha }}
          path: proof/
          if-no-files-found: error
