name: Native launcher observation proof
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native platform proof to run from the selected revision
        type: choice
        options: [windows, linux, macos, all]
        default: windows
        required: true
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'base/host/system/boot_unit.py'
      - 'cli/commands/lifecycle/root_driver.py'
      - 'cli/commands/lifecycle/start.py'
      - 'services/ava_root/**'
      - 'services/ava_root_glue/**'
      - 'base/winjob*.py'
      - 'base/sessions/windows/winproc.py'
      - 'base/native_process/ownership.py'
      - 'base/sessions/backend.py'
      - 'base/sessions/windows/terminal/**'
      - 'base/native_process/root_control/**'
      - 'cli/commands/lifecycle/_temporary_stop.py'
      - 'cli/commands/lifecycle/service_stop.py'
      - 'cli/commands/lifecycle/stop.py'
      - 'tests/lifecycle/native_root/**'
      - 'tests/services/test_ava_root_daemon.py'
      - 'base/host/system/job_observation.py'
      - 'base/deploy/writers/observation.py'
      - 'base/deploy/writers/barrier.py'
      - 'base/daemon/http_transport.py'
      - 'base/cluster/transport_encryption.py'
      - 'scripts/release_proofs/prove_native_launcher_reads.py'
      - 'tests/base/test_job_observation.py'
      - 'tests/base/test_observation.py'
      - 'tests/conftest.py'
      - 'tests/_*.py'
      - '.github/actions/install-pg-redis/**'
      - '.github/actions/uv-sync/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/native-launcher-proof.yml'
permissions:
  contents: read
jobs:
  native-read:
    if: github.head_ref == 'ava-5344-native-launcher-observer' || (github.event_name == 'workflow_dispatch' && inputs.platform != 'windows')
    strategy:
      matrix:
        os: ${{ fromJSON(inputs.platform == 'linux' && '["ubuntu-24.04"]' || inputs.platform == 'macos' && '["macos-14"]' || '["ubuntu-24.04","macos-14"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      AVA_DB_URL: postgresql://unused@127.0.0.1:1/unused
      AVA_REDIS_URL: redis://127.0.0.1:1/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: 0.10.2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cron
      - if: runner.os == 'Linux'
        uses: ./.github/actions/install-pg-redis
      - uses: ./.github/actions/uv-sync
      - if: runner.os == 'Linux'
        run: uv run pytest tests/base/test_job_observation.py tests/base/test_observation.py -q
      - if: runner.os == 'Linux'
        run: uv run pyright base/host/system/job_observation.py base/deploy/writers/observation.py scripts/release_proofs/prove_native_launcher_reads.py tests/base/test_job_observation.py
      - name: Actual read-only OS query (no job registration)
        run: uv run python scripts/release_proofs/prove_native_launcher_reads.py

  root-lifetime:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'linux' || inputs.platform == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: 0.10.2
      - uses: ./.github/actions/uv-sync
      - name: Require native manager (absence is not a passing skip)
        run: |
          test -d /run/systemd/system
          sudo -n true
          systemctl --version
      - name: Root lifetime and independent data sibling
        run: uv run pytest --noconftest tests/services/test_ava_root_daemon.py::test_native_systemd_root_lifetime -q --junitxml=root-lifetime.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-root-lifetime
          path: root-lifetime.xml

  native-windows-root:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'windows' || inputs.platform == 'all'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: 0.10.2
          python-version: '3.12'
      - name: Record the exact proof revision
        shell: bash
        run: |
          mkdir -p proof
          git rev-parse HEAD > proof/head-sha.txt
      - run: uv sync --frozen
      - name: Native pipe, singleton, Job closure and durable terminal survival
        shell: bash
        run: |
          uv run pyright --pythonplatform Windows services/ava_root/windows base/native_process/root_control services/ava_root_glue/windows_terminal.py services/ava_root_glue/windows_terminal_owner.py base/sessions/windows/terminal base/native_process/winjob.py base/native_process/winjob_spawn.py
          uv run pytest --confcutdir=tests/lifecycle/native_root tests/lifecycle/native_root -q --basetemp=proof/native --junitxml=proof/windows-root.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: windows-root-${{ github.event.pull_request.head.sha || github.sha }}
          path: proof/
          if-no-files-found: error
