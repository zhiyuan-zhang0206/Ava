name: Native launcher observation proof
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'shared/os_boot_unit.py'
      - 'cli/commands/_root_driver.py'
      - 'cli/commands/start.py'
      - 'services/ava_root/**'
      - 'tests/services/test_ava_root_daemon.py'
      - 'shared/native_job_observation.py'
      - 'shared/managed_writer_observation.py'
      - 'shared/managed_writer_barrier.py'
      - 'shared/daemon_http.py'
      - 'shared/transport_encryption.py'
      - 'services/agent_ops/bootstrap.py'
      - 'scripts/prove_native_launcher_reads.py'
      - 'tests/shared/test_native_job_observation.py'
      - 'tests/shared/test_managed_writer_observation.py'
      - 'tests/conftest.py'
      - 'tests/_*.py'
      - '.github/actions/install-pg-redis/**'
      - '.github/actions/uv-sync/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/native-launcher-proof.yml'
permissions:
  contents: read
jobs:
  native-read:
    if: github.head_ref == 'ava-5344-native-launcher-observer'
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      AVA_DB_URL: postgresql://unused@127.0.0.1:1/unused
      AVA_REDIS_URL: redis://127.0.0.1:1/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: 0.10.2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cron
      - if: runner.os == 'Linux'
        uses: ./.github/actions/install-pg-redis
      - uses: ./.github/actions/uv-sync
      - if: runner.os == 'Linux'
        run: uv run pytest tests/shared/test_native_job_observation.py tests/shared/test_managed_writer_observation.py -q
      - if: runner.os == 'Linux'
        run: uv run pyright shared/native_job_observation.py shared/managed_writer_observation.py scripts/prove_native_launcher_reads.py tests/shared/test_native_job_observation.py
      - name: Actual read-only OS query (no job registration)
        run: uv run python scripts/prove_native_launcher_reads.py

  root-lifetime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: 0.10.2
      - uses: ./.github/actions/uv-sync
      - name: Require native manager (absence is not a passing skip)
        run: |
          test -d /run/systemd/system
          sudo -n true
          systemctl --version
      - name: Root lifetime and independent data sibling
        run: uv run pytest --noconftest tests/services/test_ava_root_daemon.py::test_native_systemd_root_lifetime -q --junitxml=root-lifetime.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-root-lifetime
          path: root-lifetime.xml
