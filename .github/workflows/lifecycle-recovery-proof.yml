name: Durable lifecycle controller proof
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  prove-controller-recovery:
    if: github.head_ref == 'ava-stability-command-recovery'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AVA_DB_URL: postgresql://unused@127.0.0.1:1/unused
      AVA_REDIS_URL: redis://127.0.0.1:1/0
      AVA_RUNNER_MODE: process
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.10.2
      - uses: ./.github/actions/install-pg-redis
      - uses: ./.github/actions/uv-sync
      - name: Verify actual controller, durable attempts, and admitted record protection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          git rev-parse HEAD > proof/head-sha.txt
          timeout 300 uv run pytest tests/ops/test_lifecycle_recovery.py tests/agent/test_restart_admission.py tests/agent/test_lifecycle_apply.py tests/agent/test_restart_process_crash.py -q --junitxml=proof/head.xml
          git show 77c8c889c:ops/agent_wake.py > ops/agent_wake.py
          set +e
          timeout 120 uv run pytest tests/ops/test_lifecycle_recovery.py::test_existing_respawn_entry_uses_owned_command_recovery -q --junitxml=proof/baseline.xml
          result=$?
          set -e
          test "$result" -eq 1
          python - <<'PY'
          import xml.etree.ElementTree as ET
          head = ET.parse('proof/head.xml')
          assert len(head.findall('.//testcase')) >= 28
          assert not head.findall('.//failure') and not head.findall('.//error')
          old = ET.parse('proof/baseline.xml')
          assert len(old.findall('.//testcase')) == 1 and not old.findall('.//error')
          failures = old.findall('.//failure')
          assert len(failures) == 1 and 'Called 0 times' in failures[0].text
          PY
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: durable-controller-${{ github.event.pull_request.head.sha }}
          path: proof/
          if-no-files-found: error
