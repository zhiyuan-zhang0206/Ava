# The Rust shell has a separate, path-filtered lane: backend/frontend changes
# do not pay for a Tauri toolchain, while every shell or shell-release change
# checks both the desktop crate and the Android Rust target.

name: Shell CI

on:
  push:
    branches: [main]
    paths:
      - 'ui/app/**'
      - 'tests/ui/**'
      - 'tests/scripts/test_build_shell_update_manifest.py'
      - 'scripts/build_shell_update_manifest.py'
      - '.github/workflows/ci-shell.yml'
      - '.github/workflows/release-shell.yml'
  pull_request:
    paths:
      - 'ui/app/**'
      - 'tests/ui/**'
      - 'tests/scripts/test_build_shell_update_manifest.py'
      - 'scripts/build_shell_update_manifest.py'
      - '.github/workflows/ci-shell.yml'
      - '.github/workflows/release-shell.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shell-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shell:
    name: shell (rust + android overlay)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install desktop build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          workspaces: ui/app/src-tauri

      - name: Rust format
        working-directory: ui/app/src-tauri
        run: cargo fmt --all --check

      - name: Desktop clippy
        working-directory: ui/app/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Android Rust check
        working-directory: ui/app/src-tauri
        run: cargo check --target aarch64-linux-android

      - name: Overlay and updater-manifest tests
        run: |
          python3 -m pip install pytest==9.0.3
          python3 -m pytest tests/ui/test_android_overlay.py \
            tests/scripts/test_build_shell_update_manifest.py -q
