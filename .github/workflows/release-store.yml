name: Release store contract
on:
  pull_request:
    paths:
      - 'shared/runtime_release.py'
      - 'shared/runtime_prepare.py'
      - 'shared/platform.py'
      - 'tests/lifecycle/images/**'
      - '.github/workflows/release-store.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  filesystem-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: '3.12'
      - name: Real filesystem transitions without a cluster or project environment
        run: uv run --no-project --python 3.12 python -m unittest discover -s tests/lifecycle/images -v
      - name: Copied dynamic Mac Python retains its loader dependency
        if: runner.os == 'macOS'
        # This is the deployed standalone build that exposed the missing dylib.
        run: uv run --no-project --managed-python --python 3.12.12 python -m unittest tests.lifecycle.images.test_mac_python -v
