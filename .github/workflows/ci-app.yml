# The Rust app has a separate, path-filtered lane: backend/frontend changes
# do not pay for a Tauri toolchain, while every app or app-release change
# compiles the desktop crate on every supported host and builds an Android APK.

name: App CI

on:
  push:
    branches: [main]
    paths:
      - 'ui/app/**'
      - 'tests/ui/**'
      - 'tests/scripts/test_build_app_update_manifest.py'
      - 'scripts/build_app_update_manifest.py'
      - '.github/workflows/ci-app.yml'
      - '.github/workflows/release-app.yml'
  pull_request:
    paths:
      - 'ui/app/**'
      - 'tests/ui/**'
      - 'tests/scripts/test_build_app_update_manifest.py'
      - 'scripts/build_app_update_manifest.py'
      - '.github/workflows/ci-app.yml'
      - '.github/workflows/release-app.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Exact pin: generated Android templates are build inputs.
  TAURI_CLI_VERSION: '2.11.4'

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop:
    name: desktop (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install desktop build libraries
        if: matrix.runner == 'ubuntu-24.04'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ui/app/src-tauri

      - name: Rust format
        working-directory: ui/app/src-tauri
        shell: bash
        run: cargo fmt --all --check

      - name: Desktop clippy
        working-directory: ui/app/src-tauri
        shell: bash
        run: cargo clippy --all-targets -- -D warnings

  android:
    name: android (APK smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install the Android NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018" "platforms;android-36" "build-tools;36.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ui/app/src-tauri

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "$TAURI_CLI_VERSION" --locked

      # Tauri owns the generated tree; the repo keeps only deterministic edits.
      - name: Generate the Android project
        working-directory: ui/app
        run: cargo tauri android init --skip-targets-install

      - name: Apply the Android overlay
        run: python3 ui/app/android/apply_overlay.py

      - name: Build the debug APK
        working-directory: ui/app
        run: cargo tauri android build --apk --debug --target aarch64 --ci

      - name: Verify the APK is installable
        run: |
          find ui/app/src-tauri/gen/android -name '*.apk' -print
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          apks = list(Path("ui/app/src-tauri/gen/android").rglob("*.apk"))
          assert apks, "Android build produced no APK"
          required = {"AndroidManifest.xml", "classes.dex"}
          for apk in apks:
              with ZipFile(apk) as archive:
                  missing = required - set(archive.namelist())
              assert not missing, f"{apk} is missing {sorted(missing)}"
          PY

  overlay:
    name: overlay and updater tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Overlay and updater-manifest tests
        run: |
          python3 -m pip install pytest==9.0.3
          python3 -m pytest --noconftest tests/ui/test_android_overlay.py \
            tests/ui/test_android_update_check.py \
            tests/ui/test_app_release_workflow.py \
            tests/scripts/test_build_app_update_manifest.py -q
