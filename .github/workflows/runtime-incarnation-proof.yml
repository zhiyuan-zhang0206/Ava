name: Runtime incarnation regression proof
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['agent/**', 'ops/ops_exit.py', 'ops/rpc_schemas.py', 'shared/runtime_incarnation.py', 'tests/agent/test_runtime_incarnation.py', 'tests/gateway/test_exit_wire_incarnation.py', '.github/workflows/runtime-incarnation-proof.yml']
permissions:
  contents: read
jobs:
  prove-incarnation:
    if: github.head_ref == 'ava-stability-runtime-incarnation'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AVA_DB_URL: postgresql://unused@127.0.0.1:1/unused
      AVA_REDIS_URL: redis://127.0.0.1:1/0
      AVA_RUNNER_MODE: process
      BASELINE_SHA: eecab0bab7aea636e1d6fc8b195177daa52482f7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.10.2
      - uses: ./.github/actions/install-pg-redis
      - run: uv sync --frozen
      - name: Verify current transitions and old missing-token failure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          git rev-parse HEAD > proof/head-sha.txt
          printf '%s\n' "$BASELINE_SHA" > proof/baseline-sha.txt
          timeout 180 uv run pytest tests/gateway/test_exit_wire_incarnation.py -q --junitxml=proof/wire.xml
          git show 462073205:ops/rpc_schemas.py > ops/rpc_schemas.py
          set +e
          timeout 180 uv run pytest tests/gateway/test_exit_wire_incarnation.py -k legacy_sdk -q --junitxml=proof/wire-baseline.xml
          wire_result=$?
          set -e
          test "$wire_result" -eq 1
          git show HEAD:ops/rpc_schemas.py > ops/rpc_schemas.py
          timeout 180 uv run pytest tests/agent/test_runtime_incarnation.py -q --junitxml=proof/head.xml
          timeout 180 uv run pytest tests/agent/test_runtime_incarnation_migration.py -q --junitxml=proof/migration.xml
          git show "$BASELINE_SHA:ops/ops_exit.py" > ops/ops_exit.py
          git show "$BASELINE_SHA:agent/db.py" > agent/db.py
          set +e
          timeout 180 uv run pytest tests/agent/test_runtime_incarnation.py -q -k 'legacy_exit_cannot or (lease_matches and missing)' --junitxml=proof/baseline.xml
          result=$?
          set -e
          test "$result" -eq 1
          python - <<'PY'
          import xml.etree.ElementTree as ET
          head = ET.parse('proof/head.xml')
          wire = ET.parse('proof/wire.xml')
          assert len(wire.findall('.//testcase')) == 4
          assert not wire.findall('.//failure') and not wire.findall('.//error')
          wire_old = ET.parse('proof/wire-baseline.xml')
          assert len(wire_old.findall('.//testcase')) == 2 and not wire_old.findall('.//error')
          wire_failures = wire_old.findall('.//failure')
          assert len(wire_failures) == 2
          assert all('422' in failure.text for failure in wire_failures)
          old = ET.parse('proof/baseline.xml')
          assert len(head.findall('.//testcase')) == 12
          assert not head.findall('.//failure') and not head.findall('.//error')
          assert len(old.findall('.//testcase')) == 2
          assert not old.findall('.//error')
          failures = {c.attrib['name'] for c in old.findall('.//testcase') if c.find('failure') is not None}
          assert failures == {'test_legacy_exit_cannot_finalize_owned_row', 'test_lease_matches_original_incarnation[missing]'}
          PY
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runtime-incarnation-proof-${{ github.event.pull_request.head.sha }}
          path: proof/
          if-no-files-found: error
