name: Durable lifecycle intent proof
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['agent/lifecycle_intent.py', 'tests/agent/test_lifecycle_intent.py', 'migrations/**', 'db/schema.sql', '.github/workflows/lifecycle-intent-proof.yml']
permissions:
  contents: read
jobs:
  prove-lifecycle-intent:
    if: github.head_ref == 'ava-stability-durable-lifecycle'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AVA_DB_URL: postgresql://unused@127.0.0.1:1/unused
      AVA_REDIS_URL: redis://127.0.0.1:1/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.10.2
      - uses: ./.github/actions/install-pg-redis
      - run: uv sync --frozen
      - name: Verify durable acceptance without process or production effects
        run: |
          mkdir -p proof
          git rev-parse HEAD > proof/head-sha.txt
          timeout 240 uv run pytest tests/agent/test_lifecycle_intent.py tests/agent/test_lifecycle_intent_migration.py -q --junitxml=proof/head.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          tree = ET.parse('proof/head.xml')
          assert len(tree.findall('.//testcase')) >= 6
          assert not tree.findall('.//failure') and not tree.findall('.//error')
          PY
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lifecycle-intent-proof-${{ github.event.pull_request.head.sha }}
          path: proof/
          if-no-files-found: error
