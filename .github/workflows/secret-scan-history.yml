name: Secret scan (full history)

# The nightly half of the secret scan. ci.yml's `secret scan (Gitleaks)` check
# scans only the commits a change adds, which keeps it to about a minute; this
# workflow re-proves every ref's whole history once a day, so a secret that
# reached a ref without passing that check (a force-push, a branch that never
# opened a PR) is still found within a day. It runs against main's checkout and
# fetches all refs.

on:
  schedule:
    - cron: '17 20 * * *'  # UTC — GitHub Actions schedule cron is always UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-history
  cancel-in-progress: false

jobs:
  secret-scan-history:
    name: secret scan (Gitleaks, full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          export GOBIN="$RUNNER_TEMP/gitleaks-bin"
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$GOBIN" >> "$GITHUB_PATH"

      - name: Scan every ref's history
        run: gitleaks git --config .gitleaks.toml --redact --no-banner .
