name: Managed writer evidence proof
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'shared/managed_writer_barrier.py'
      - 'shared/managed_writer_publication.py'
      - 'tests/shared/test_managed_writer_barrier.py'
      - 'tests/shared/test_managed_writer_publication.py'
      - 'tests/shared/test_publication_admission.py'
      - '.github/workflows/managed-writer-barrier-proof.yml'
permissions:
  contents: read
jobs:
  prove-operation-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AVA_DB_URL: postgresql://unused@127.0.0.1:1/unused
      AVA_REDIS_URL: redis://127.0.0.1:1/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.10.2
      - uses: ./.github/actions/install-pg-redis
      - run: uv sync --frozen
      - run: uv run pytest tests/shared/test_managed_writer_barrier.py tests/shared/test_managed_writer_publication.py tests/shared/test_publication_admission.py -q
      - run: uv run pyright shared/managed_writer_barrier.py shared/managed_writer_publication.py tests/shared/test_managed_writer_barrier.py tests/shared/test_managed_writer_publication.py tests/shared/test_publication_admission.py
