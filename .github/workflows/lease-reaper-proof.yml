name: Lease reaper ownership regression proof
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'ops/controllers/respawn.py'
      - 'tests/services/test_restarter_reaper.py'
      - '.github/workflows/lease-reaper-proof.yml'
permissions:
  contents: read
jobs:
  prove-ownership:
    if: github.head_ref == 'ava-stability-lease-reap-cas'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AVA_DB_URL: postgresql://unused@127.0.0.1:1/unused
      AVA_REDIS_URL: redis://127.0.0.1:1/0
      AVA_RUNNER_MODE: process
      BASELINE_SHA: 612326d130fdc5322e40cb8e688e8ba623d9bc5d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.10.2
      - uses: ./.github/actions/install-pg-redis
      - run: uv sync --frozen
      - name: Prove exact stale-owner regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          git rev-parse HEAD > proof/head-sha.txt
          printf '%s\n' "$BASELINE_SHA" > proof/baseline-sha.txt
          timeout 180 uv run pytest tests/services/test_restarter_reaper.py -k lease_reaper -q --junitxml=proof/head.xml
          git show "$BASELINE_SHA:ops/controllers/respawn.py" > ops/controllers/respawn.py
          set +e
          timeout 180 uv run pytest tests/services/test_restarter_reaper.py -k lease_reaper -q --junitxml=proof/baseline.xml
          result=$?
          set -e
          test "$result" -eq 1
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          expected = {
              *(f'test_lease_reaper_rechecks_candidate_under_row_lock[{case}]'
                for case in ('renewed', 'replacement', 'terminated', 'moved')),
              *(f'test_lease_reaper_never_signals_unreadable_identity[{case}]'
                for case in (1, 2)),
          }
          head = ET.parse('proof/head.xml')
          baseline = ET.parse('proof/baseline.xml')
          assert len(head.findall('.//testcase')) == 6
          assert not head.findall('.//failure') and not head.findall('.//error')
          assert len(baseline.findall('.//testcase')) == 6
          assert not baseline.findall('.//error'), 'setup errors are not proof'
          failed = {case.attrib['name'] for case in baseline.findall('.//testcase')
                    if case.find('failure') is not None}
          assert failed == expected, (failed, expected)
          Path('proof/verdict.txt').write_text('HEAD: 6 passed; baseline: exact 6 ownership failures\n')
          PY
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lease-reaper-proof-${{ github.event.pull_request.head.sha }}
          path: proof/
          if-no-files-found: error
