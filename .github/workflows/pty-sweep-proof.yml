name: PTY terminal sweep proof
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['shared/pty_sessions/**', 'tests/shared/test_pty_zombie_sweep.py', '.github/workflows/pty-sweep-proof.yml']
permissions:
  contents: read
jobs:
  prove-terminal-sweep:
    if: github.head_ref == 'ava-stability-pty-zombie-sweep'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AVA_DB_URL: postgresql://unused@127.0.0.1:1/unused
      AVA_REDIS_URL: redis://127.0.0.1:1/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.10.2
      - uses: ./.github/actions/install-pg-redis
      - run: uv sync --frozen
      - name: Verify zombie cleanup and live/unreadable retention
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          git rev-parse HEAD > proof/head-sha.txt
          timeout 240 uv run pytest tests/shared/test_pty_zombie_sweep.py tests/shared/test_pty_sessions_cli.py -k 'lazy_sweep_requires or crashed_host_is_swept or live_sessions_keeps_live_legacy' -q --junitxml=proof/head.xml
          git show bd6b15ed0:shared/pty_sessions/cli.py > shared/pty_sessions/cli.py
          set +e
          timeout 180 uv run pytest tests/shared/test_pty_zombie_sweep.py -q --junitxml=proof/baseline.xml
          result=$?
          set -e
          test "$result" -eq 1
          python - <<'PY'
          import xml.etree.ElementTree as ET
          head = ET.parse('proof/head.xml')
          assert len(head.findall('.//testcase')) == 8
          assert not head.findall('.//failure') and not head.findall('.//error')
          old = ET.parse('proof/baseline.xml')
          assert len(old.findall('.//testcase')) == 6 and not old.findall('.//error')
          failed = [c for c in old.findall('.//testcase') if c.find('failure') is not None]
          assert len(failed) == 2
          for case in failed:
              assert 'zombie-' in case.attrib['name']
              assert 'zombie record must be swept' in case.find('failure').text
          PY
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pty-terminal-sweep-${{ github.event.pull_request.head.sha }}
          path: proof/
          if-no-files-found: error
