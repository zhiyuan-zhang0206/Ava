name: Hosted lifecycle command proof
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['agent/**', 'services/agent_host/**', 'tests/agent/test_hosted_lifecycle.py', '.github/workflows/hosted-lifecycle-proof.yml']
permissions:
  contents: read
jobs:
  prove-hosted-lifecycle:
    if: github.head_ref == 'ava-stability-hosted-lifecycle'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AVA_DB_URL: postgresql://unused@127.0.0.1:1/unused
      AVA_REDIS_URL: redis://127.0.0.1:1/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.10.2
      - uses: ./.github/actions/install-pg-redis
      - run: uv sync --frozen
      - name: Prove deferred application and legacy early acknowledgement failure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          git rev-parse HEAD > proof/head-sha.txt
          timeout 240 uv run pytest tests/agent/test_hosted_lifecycle.py tests/agent/test_hosted_ownership.py -q --junitxml=proof/head.xml
          git show c146b3dde:agent/db.py > agent/db.py
          set +e
          timeout 180 uv run pytest tests/agent/test_hosted_lifecycle.py -k applies_only -q --junitxml=proof/baseline.xml
          result=$?
          set -e
          test "$result" -eq 1
          python - <<'PY'
          import xml.etree.ElementTree as ET
          head = ET.parse('proof/head.xml')
          assert len(head.findall('.//testcase')) >= 4
          assert not head.findall('.//failure') and not head.findall('.//error')
          old = ET.parse('proof/baseline.xml')
          assert len(old.findall('.//testcase')) == 2 and not old.findall('.//error')
          assert len(old.findall('.//failure')) == 2
          for failure in old.findall('.//failure'):
              assert "('done',) == ('claimed',)" in failure.text
          PY
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hosted-lifecycle-proof-${{ github.event.pull_request.head.sha }}
          path: proof/
          if-no-files-found: error
