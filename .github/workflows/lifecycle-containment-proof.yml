name: Lifecycle containment regression proof

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'services/restarter/daemon.py'
      - 'ops/controllers/resurrect.py'
      - 'ops/controllers/wedged.py'
      - 'tests/services/test_restarter_disabled.py'
      - '.github/workflows/lifecycle-containment-proof.yml'

permissions:
  contents: read

jobs:
  prove-containment:
    # This incident proof compares the exact pre-fix implementation, not an
    # arbitrary future merge base. It is not a general mutation framework.
    if: github.head_ref == 'ava-stability-lifecycle-fences'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AVA_DB_URL: postgresql://unused@127.0.0.1:1/unused
      AVA_REDIS_URL: redis://127.0.0.1:1/0
      BASELINE_SHA: 612326d130fdc5322e40cb8e688e8ba623d9bc5d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.10.2
      - uses: ./.github/actions/install-pg-redis
      - run: uv sync --frozen
      - name: Prove head success and exact old-code failures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          git rev-parse HEAD > proof/head-sha.txt
          printf '%s\n' "$BASELINE_SHA" > proof/baseline-sha.txt
          timeout 180 uv run pytest tests/services/test_restarter_disabled.py -q --junitxml=proof/head.xml
          for path in services/restarter/daemon.py ops/controllers/resurrect.py ops/controllers/wedged.py; do
            git show "$BASELINE_SHA:$path" > "$path"
          done
          set +e
          timeout 180 uv run pytest tests/services/test_restarter_disabled.py -q --junitxml=proof/baseline.xml
          result=$?
          set -e
          test "$result" -eq 1
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          head = ET.parse('proof/head.xml')
          baseline = ET.parse('proof/baseline.xml')
          expected = {
              'test_hosted_restarter_refuses_before_any_startup_io',
              'test_hosted_dispatch_loop_never_runs_process_controllers',
              'test_hosted_process_controller_is_inert[resurrect]',
              'test_hosted_process_controller_is_inert[wedged]',
          }
          assert len(head.findall('.//testcase')) == 7
          assert not head.findall('.//failure') and not head.findall('.//error')
          assert len(baseline.findall('.//testcase')) == 7
          assert not baseline.findall('.//error'), 'collection/setup error is not regression proof'
          failed = {case.attrib['name'] for case in baseline.findall('.//testcase')
                    if case.find('failure') is not None}
          assert failed == expected, (failed, expected)
          Path('proof/verdict.txt').write_text('HEAD: 7 passed; baseline: exact 4 regression failures\n')
          PY
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lifecycle-containment-proof-${{ github.event.pull_request.head.sha }}
          path: proof/
          if-no-files-found: error
