# QA approval label gate: runs on all PRs, including drafts, so label changes flip this check.
# Trunk test PRs are exempt by head-ref prefix; P0 is not branch-protection required until P2.
name: QA Approved Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read

jobs:
  qa-approved-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check QA approval label
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ "$HEAD_REF" == trunk-merge/* || "$HEAD_REF" == trunk-temp/* ]]; then
            echo "Trunk Merge Queue test PRs are exempt from the QA approval label gate."
            exit 0
          fi

          if jq -e 'any(.pull_request.labels[]?; .name == "qa-approved")' "$GITHUB_EVENT_PATH" > /dev/null; then
            echo "The PR has the qa-approved label."
            exit 0
          fi

          echo "The PR needs the qa-approved label before it can merge."
          exit 1
