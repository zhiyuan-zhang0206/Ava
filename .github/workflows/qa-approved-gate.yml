name: QA Approved Gate
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  workflow_run:
    workflows: [QA Review Signal]
    types: [completed]
  issue_comment:
    types: [created, edited, deleted]
permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write
concurrency:
  group: qa-evidence-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number }}
  cancel-in-progress: true
jobs:
  evaluate-qa-evidence:
    if: github.event.pull_request || github.event.issue.pull_request || github.event.workflow_run.pull_requests[0].number
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Never execute a PR's evaluator with a write token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Publish target-head QA result
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number }}
        run: python scripts/qa_gate.py "$PR_NUMBER"
