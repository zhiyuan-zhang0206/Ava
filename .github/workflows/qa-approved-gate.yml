# QA approval gate — two eras share one file.
# Transition (this PR not yet on main): the plain `pull_request` trigger runs
# from the merge ref, so the required branch-protection check exists and the
# label (still the authority until the receipt infra lands) gates the PR.
# Steady state (file on main): the label job stays pull_request-only, the
# receipt evaluator reacts to pull_request_target / workflow_run /
# issue_comment from the default-branch copy — never executing PR code.
# Concurrency is job-scoped so the two event paths never cancel each other.
# The issue_comment face is filtered at job level: only comment deletion or a
# body carrying the receipt literal (ava_qa_version) evaluates; other comment
# traffic skips the job with no runner spend (approval evaluation #4628).
# Trunk test PRs are exempt by head-ref prefix.
name: QA Approved Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  workflow_run:
    workflows: [QA Review Signal]
    types: [completed]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write

jobs:
  # Transition label gate — required-check presence while the receipt
  # evaluator's script is not yet on the default branch.
  qa-approved-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check QA approval label
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$HEAD_REF" == trunk-merge/* || "$HEAD_REF" == trunk-temp/* ]]; then
            echo "Trunk Merge Queue test PRs are exempt from the QA approval label gate."
            exit 0
          fi

          # The verdict is the label set at evaluation time, read live — never
          # the event payload: a run queued by an older event can execute
          # after a newer event's run, and its payload is a snapshot, not
          # current state. 2026-09-14 (#2444): a run created before `labeled`
          # executed late and its failure became the newest same-named
          # check-run, after the labeled run had passed.
          if ! labels="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" \
            --jq 'any(.[]; .name == "qa-approved")')"; then
            echo "Could not read the PR's labels from GitHub; failing the gate."
            exit 1
          fi

          if [[ "$labels" == "true" ]]; then
            echo "The PR has the qa-approved label."
            exit 0
          fi

          echo "The PR needs the qa-approved label before it can merge."
          exit 1

  # Receipt evaluator — steady-state authority, base-file runs only.
  evaluate-qa-evidence:
    if: |
      github.event_name != 'pull_request' &&
      (github.event_name != 'issue_comment' ||
       github.event.action == 'deleted' ||
       contains(github.event.comment.body, 'ava_qa_version'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: qa-evidence-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number }}
      cancel-in-progress: true
    steps:
      # Never execute a PR's evaluator with a write token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Publish target-head QA result
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number }}
        run: python scripts/qa_gate.py "$PR_NUMBER"
