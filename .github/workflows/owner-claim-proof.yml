name: Owner claim regression proof
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['agent/**', 'tests/agent/test_inbound_ownership.py', '.github/workflows/owner-claim-proof.yml']
permissions:
  contents: read
jobs:
  prove-owner-claim:
    if: github.head_ref == 'ava-stability-owner-claim'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AVA_DB_URL: postgresql://unused@127.0.0.1:1/unused
      AVA_REDIS_URL: redis://127.0.0.1:1/0
      BASELINE_SHA: 107a4ee77768fd93b00f6006ca16f4be81f9a4eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.10.2
      - uses: ./.github/actions/install-pg-redis
      - run: uv sync --frozen
      - name: Verify existing kernel dispatch and reconciliation contracts
        run: |
          mkdir -p proof
          timeout 360 uv run pytest tests/agent/test_claim.py tests/agent/test_compact.py tests/agent/test_circuit_breaker.py tests/agent/test_db.py tests/agent/test_fork_notes.py tests/agent/test_history_dump.py tests/services/test_turn_dispatcher.py -q --junitxml=proof/kernel-contracts.xml
      - name: Prove owner-bound durable claim
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          git rev-parse HEAD > proof/head-sha.txt
          printf '%s\n' "$BASELINE_SHA" > proof/baseline-sha.txt
          timeout 240 uv run pytest tests/agent/test_inbound_ownership.py -q --junitxml=proof/head.xml
          git show "$BASELINE_SHA:agent/db.py" > agent/db.py
          set +e
          timeout 180 uv run pytest tests/agent/test_inbound_ownership.py -k stale_or_missing_owner -q --junitxml=proof/baseline.xml
          result=$?
          set -e
          test "$result" -eq 1
          python - <<'PY'
          import xml.etree.ElementTree as ET
          head = ET.parse('proof/head.xml')
          assert len(head.findall('.//testcase')) >= 6
          assert not head.findall('.//failure') and not head.findall('.//error')
          old = ET.parse('proof/baseline.xml')
          assert len(old.findall('.//testcase')) == 2 and not old.findall('.//error')
          failed = {c.attrib['name'] for c in old.findall('.//testcase') if c.find('failure') is not None}
          assert failed == {f'test_stale_or_missing_owner_cannot_claim[{value}]' for value in ('False', 'True')}
          PY
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: owner-claim-proof-${{ github.event.pull_request.head.sha }}
          path: proof/
          if-no-files-found: error
