name: Lifecycle cleanup writer proof
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  prove-fenced-cleanup:
    if: github.head_ref == 'ava-stability-lifecycle-finalizers'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AVA_DB_URL: postgresql://unused@127.0.0.1:1/unused
      AVA_REDIS_URL: redis://127.0.0.1:1/0
      AVA_RUNNER_MODE: process
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.10.2
      - uses: ./.github/actions/install-pg-redis
      - run: uv sync --frozen
      - name: Reject stale cleanup writers and retain legacy behavior
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          git rev-parse HEAD > proof/head-sha.txt
          timeout 240 uv run pytest tests/agent/test_lifecycle_finalizers.py tests/ops/test_cold_lifecycle.py -q --junitxml=proof/head.xml
          git show ee1dc850f:agent/_starting.py > agent/_starting.py
          git show ee1dc850f:services/delivery_watchdog/daemon.py > services/delivery_watchdog/daemon.py
          set +e
          timeout 120 uv run pytest tests/agent/test_lifecycle_finalizers.py -q --junitxml=proof/baseline.xml
          result=$?
          set -e
          test "$result" -eq 1
          python - <<'PY'
          import xml.etree.ElementTree as ET
          head = ET.parse('proof/head.xml')
          assert len(head.findall('.//testcase')) == 12
          assert not head.findall('.//failure') and not head.findall('.//error')
          old = ET.parse('proof/baseline.xml')
          assert len(old.findall('.//testcase')) == 4 and not old.findall('.//error')
          failures = old.findall('.//failure')
          assert len(failures) == 3
          assert all('AssertionError' in failure.text for failure in failures)
          PY
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lifecycle-cleanup-writers-${{ github.event.pull_request.head.sha }}
          path: proof/
          if-no-files-found: error
