name: Update model pricing

on:
  schedule:
    - cron: '17 0 * * *'  # UTC — GitHub Actions schedule cron is always UTC
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: update-model-pricing
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    name: Check official pricing sources
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.10.2'
          enable-cache: true

      - name: Install locked Python environment
        run: uv sync --frozen

      - name: Prepare an isolated candidate worktree
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ava-bot/model-pricing
        run: |
          CANDIDATE="$RUNNER_TEMP/model-pricing-candidate"
          OPEN_PR="$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')"
          if [ "$OPEN_PR" -gt 1 ]; then
            echo "Expected at most one open pricing PR, found $OPEN_PR" >&2
            exit 1
          fi
          REMOTE_EXISTS=0
          if git ls-remote --exit-code --heads origin "refs/heads/$BRANCH"; then
            git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            REMOTE_EXISTS=1
          fi
          if [ "$OPEN_PR" -eq 1 ]; then
            if [ "$REMOTE_EXISTS" -ne 1 ]; then
              echo "Open pricing PR has no remote head branch" >&2
              exit 1
            fi
            git worktree add -B "$BRANCH" "$CANDIDATE" "origin/$BRANCH"
          else
            git worktree add -B "$BRANCH" "$CANDIDATE" origin/main
          fi
          echo "path=$CANDIDATE" >> "$GITHUB_OUTPUT"

      - name: Reconcile official pricing
        env:
          CANDIDATE: ${{ steps.candidate.outputs.path }}
          ARCHIVE: ${{ steps.candidate.outputs.path }}/shared/lm/pricing_catalog_archive.json
        run: |
          if [ ! -f "$ARCHIVE" ] || [ -L "$ARCHIVE" ]; then
            echo "Candidate archive must be a regular, non-symlink file" >&2
            exit 1
          fi
          CANDIDATE_REAL="$(realpath "$CANDIDATE")"
          ARCHIVE_REAL="$(realpath "$ARCHIVE")"
          case "$ARCHIVE_REAL" in
            "$CANDIDATE_REAL"/*) ;;
            *)
              echo "Candidate archive resolves outside its isolated worktree" >&2
              exit 1
              ;;
          esac
          uv run python scripts/update_model_pricing.py --catalog "$ARCHIVE" --write

      - name: Sync plugin runtime prices
        env:
          CANDIDATE: ${{ steps.candidate.outputs.path }}
        run: |
          uv run python scripts/update_model_pricing.py --sync-plugins --write --repo-root "$CANDIDATE" \
            2> >(tee "$RUNNER_TEMP/model-pricing-future-windows.md" >&2)

      - name: Detect a pricing change
        id: diff
        env:
          CANDIDATE: ${{ steps.candidate.outputs.path }}
        run: |
          if git -C "$CANDIDATE" diff --quiet -- \
            shared/lm/pricing_catalog_archive.json \
            ':(glob)ava_builtins/plugins/lm_*/provider.py'; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Push a review branch
        if: steps.diff.outputs.changed == 'true'
        env:
          BRANCH: ava-bot/model-pricing
          CANDIDATE: ${{ steps.candidate.outputs.path }}
        run: |
          git -C "$CANDIDATE" config user.name 'ava-pricing-bot'
          git -C "$CANDIDATE" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$CANDIDATE" add \
            shared/lm/pricing_catalog_archive.json \
            ':(glob)ava_builtins/plugins/lm_*/provider.py'
          git -C "$CANDIDATE" commit -m 'fix: update model pricing'
          git -C "$CANDIDATE" push --force-with-lease origin "HEAD:refs/heads/$BRANCH"

      - name: Open or update the pricing PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ava-bot/model-pricing
        run: |
          PR_NUMBER="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          PR_BODY="$RUNNER_TEMP/model-pricing-pr.md"
          FUTURE_WINDOWS="$RUNNER_TEMP/model-pricing-future-windows.md"
          cat > "$PR_BODY" <<'EOF'
          ## Summary

          Ava’s reviewed archive or runtime plugin rates differ from the current
          checked-in pricing state. A source adapter may have appended a provisional
          period, or a previously reviewed scheduled period may now be active.
          Runtime plugin rates are synchronized to the archive period covering the
          workflow run.

          ## File tree

          ```text
          shared/lm/pricing_catalog_archive.json      (M when changed) ★ effective-dated rates and provenance
          ava_builtins/plugins/lm_*/provider.py       (M when changed) ★ synchronized runtime PriceRates
          ```

          ## Data flow

          Official source → strict provider adapter → normalized rate invariants
          → append-only archive period → bot sync → human review of the PR.

          ## Upcoming effective windows

          EOF
          if [ -s "$FUTURE_WINDOWS" ]; then
            cat "$FUTURE_WINDOWS" >> "$PR_BODY"
          else
            echo 'No future rate window differs from the current flat plugin rates.' >> "$PR_BODY"
          fi
          cat >> "$PR_BODY" <<'EOF'

          ## Not tested automatically

          For a newly detected source change, the provider announcement’s exact
          effective instant still requires human verification; detection time is
          deliberately only provisional. Scheduled archive windows already carry
          their reviewed boundary.

          This PR is never auto-merged.
          EOF
          if [ -z "$PR_NUMBER" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title 'fix: update model pricing' \
              --body-file "$PR_BODY"
          else
            gh pr edit "$PR_NUMBER" --body-file "$PR_BODY"
          fi
          gh workflow run ci.yml --ref "$BRANCH"
