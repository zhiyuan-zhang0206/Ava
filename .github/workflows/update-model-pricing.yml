name: Update model pricing

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: update-model-pricing
  cancel-in-progress: false

jobs:
  update:
    name: Check official pricing sources
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@20cfd1b3b70a6148e8223a91374b462653c1511c # v10.0.1
        with:
          version: '0.10.12'
          enable-cache: true

      - name: Install locked Python environment
        run: uv sync --frozen

      - name: Check out the updater branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ava-bot/model-pricing
        run: |
          OPEN_PR="$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')"
          if [ "$OPEN_PR" -gt 1 ]; then
            echo "Expected at most one open pricing PR, found $OPEN_PR" >&2
            exit 1
          fi
          REMOTE_EXISTS=0
          if git ls-remote --exit-code --heads origin "refs/heads/$BRANCH"; then
            git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            REMOTE_EXISTS=1
          fi
          if [ "$OPEN_PR" -eq 1 ]; then
            if [ "$REMOTE_EXISTS" -ne 1 ]; then
              echo "Open pricing PR has no remote head branch" >&2
              exit 1
            fi
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -B "$BRANCH" origin/main
          fi

      - name: Reconcile official pricing
        run: uv run python scripts/update_model_pricing.py --write

      - name: Detect a catalog change
        id: diff
        run: |
          if git diff --quiet -- shared/lm/pricing_catalog.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Push a review branch
        if: steps.diff.outputs.changed == 'true'
        env:
          BRANCH: ava-bot/model-pricing
        run: |
          git config user.name 'ava-pricing-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shared/lm/pricing_catalog.json
          git commit -m 'fix: update model pricing catalog'
          git push --force-with-lease origin "HEAD:refs/heads/$BRANCH"

      - name: Open or update the pricing PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ava-bot/model-pricing
        run: |
          PR_NUMBER="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$PR_NUMBER" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title 'fix: update model pricing catalog' \
              --body '## Summary

          An official provider pricing source differs from Ava’s reviewed catalog.
          The source adapter appended a new period; its provisional
          `effective_from` is the detection time and must be checked against the
          provider announcement before merge.

          ## File tree

          ```text
          shared/lm/pricing_catalog.json  (M) ★ effective-dated rates and provenance
          ```

          ## Data flow

          Official source → strict provider adapter → normalized rate invariants
          → append-only catalog period → CI + human review → runtime `quote()`.

          ## Not tested automatically

          The provider announcement’s exact effective instant still requires
          human verification; detection time is deliberately only provisional.

          This PR is never auto-merged.'
          fi
          gh workflow run ci.yml --ref "$BRANCH"
