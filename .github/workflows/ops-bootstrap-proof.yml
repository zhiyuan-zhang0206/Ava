name: Ops bootstrap observation proof
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'services/agent_ops/bootstrap.py'
      - 'services/agent_ops/daemon.py'
      - 'shared/daemon_http.py'
      - 'shared/daemon_health.py'
      - 'shared/transport_encryption.py'
      - 'shared/managed_writer_barrier.py'
      - 'shared/managed_writer_observation.py'
      - 'shared/native_job_observation.py'
      - 'shared/db.py'
      - 'ops/agent_spawn.py'
      - 'tests/e2e/fakes/scenarios/lifecycle_restart.py'
      - 'tests/ops/test_restart_fallback_scenario.py'
      - 'tests/shared/test_daemon_http.py'
      - 'tests/shared/test_daemon_health.py'
      - 'tests/shared/test_managed_writer_barrier.py'
      - 'tests/shared/test_managed_writer_observation.py'
      - 'tests/conftest.py'
      - 'tests/_*.py'
      - 'db/schema.sql'
      - 'migrations/**'
      - '.github/actions/install-pg-redis/**'
      - '.github/actions/uv-sync/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/ops-bootstrap-proof.yml'
permissions:
  contents: read
jobs:
  prove-bootstrap-boundary:
    if: github.head_ref == 'ava-5344-ops-bootstrap-observer'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AVA_DB_URL: postgresql://unused@127.0.0.1:1/unused
      AVA_REDIS_URL: redis://127.0.0.1:1/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: 0.10.2
      - uses: ./.github/actions/install-pg-redis
      - uses: ./.github/actions/uv-sync
      - run: uv run pytest tests/shared/test_daemon_http.py tests/shared/test_daemon_health.py tests/shared/test_managed_writer_barrier.py tests/shared/test_managed_writer_observation.py -q
      - name: Verify consumed restart does not claim completion
        run: uv run pytest tests/ops/test_restart_fallback_scenario.py -q -s
      - run: uv run pyright tests/ops/test_restart_fallback_scenario.py
