# Build and publish the Ava App Android APK.
#
# Every build injects versionCode = 1_000_000 + github.run_number through the
# Tauri `--config` overlay (scripts/codegen/build_android_release.py owns the
# rule and the manifest). The run number is unique and increasing per workflow,
# so the code strictly increases across builds even when versionName does not;
# it also stays above 4002, the highest code Tauri's old semver derivation
# produced (0.4.2). Tauri's `autoIncrementVersionCode` stays off: it reads a
# file the generated tree never keeps between CI builds.
#
# An `android-v*` tag publishes one immutable release. Every other run replaces
# the APK and `android-latest.json` in the mutable `android-latest` prerelease;
# the manifest's fields (versionCode, versionName, apkUrl, sha256, commit,
# builtAt) are the client update contract.
#
# This workflow is deliberately independent of release-app.yml: Android signing
# is sufficient for an APK release and must not depend on desktop credentials.

name: Release Android APK

on:
  push:
    tags:
      - 'android-v[0-9]+.[0-9]+.[0-9]+'
    branches:
      - main
    paths:
      # Only app code rebuilds the mutable android-latest channel: docs and
      # unrelated trees (backend/, ui/web/) must not trigger a signed APK
      # build. The filter also applies to tag pushes, which is safe: the
      # version-alignment check in prepare (#900) means a release tag's
      # commit always bumps Cargo.toml under src-tauri/**, so every
      # legitimate android-v* tag still matches.
      - 'ui/app/src-tauri/**'
      - 'ui/app/app-ui/**'
      - 'ui/app/android/**'
      - '.github/workflows/release-android.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build the APK without publishing to the android-latest channel'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Serialize builds feeding the mutable android-latest release: concurrent
  # runs would race on the same asset (one 422, or an older build overwriting
  # a newer one). Tag releases queue behind branch builds and vice versa.
  group: android-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Exact pin: generated Android templates and release outputs are CLI inputs.
  TAURI_CLI_VERSION: '2.11.4'

jobs:
  prepare:
    name: Resolve app version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.build.outputs.build_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve and validate version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, tomllib

          cargo = tomllib.loads(pathlib.Path("ui/app/src-tauri/Cargo.toml").read_text())
          cargo_version = cargo["package"]["version"]
          if os.environ["REF_TYPE"] == "tag":
              match = re.fullmatch(r"android-v(\d+\.\d+\.\d+)", os.environ["REF_NAME"])
              if match is None:
                  raise SystemExit(f"invalid Android release tag: {os.environ['REF_NAME']}")
              version = match.group(1)
              # The tag and Cargo.toml are both version sources; a release tag
              # that lags the crate version would ship a downgraded package, so
              # they must agree exactly.
              if version != cargo_version:
                  raise SystemExit(
                      f"tag version {version} != Cargo.toml version {cargo_version}; "
                      "bump ui/app/src-tauri/Cargo.toml to match the tag before releasing"
                  )
          else:
              # main-branch build or manual dispatch: version comes from Cargo.
              version = cargo_version
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          PY

      - name: Compute the build number
        id: build
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          build_number="$(python3 scripts/codegen/build_android_release.py version-code \
            --run-number "$RUN_NUMBER")"
          echo "versionCode = 1_000_000 + run $RUN_NUMBER = $build_number"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

  android:
    name: Android (APK)
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      EVENT_NAME: ${{ github.event_name }}
      NDK_VERSION: 27.2.12479018
      BUILD_TOOLS_VERSION: '36.0.0'
      APP_VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # The action's default `packages` is 'tools platform-tools'; the
          # deprecated 'tools' package is gone from the SDK repository, so the
          # step dies with `Failed to find package 'tools'`. Install only what
          # still exists — the SDK and cmdline-tools ship on the runner image.
          packages: 'platform-tools'

      - name: Install the Android NDK
        run: |
          sdkmanager --install "ndk;$NDK_VERSION" "platforms;android-36" "build-tools;$BUILD_TOOLS_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ui/app/src-tauri
          # Only the main push saves. A cache written on an android-v* tag ref
          # is readable only by that tag, so no later release ever reuses it,
          # and each copy counts against the repository's 10 GB cache cap. Tag
          # runs still restore main's entry (the key family shared with App CI).
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "$TAURI_CLI_VERSION" --locked

      # `gen/android` is a build output (see ui/app/android/apply_overlay.py):
      # generated from the current Tauri version's templates, then patched with
      # the app's manifest edits, network security config and Kotlin service.
      - name: Generate the Android project
        working-directory: ui/app
        run: cargo tauri android init --skip-targets-install

      - name: Apply the Android overlay
        run: python3 ui/app/android/apply_overlay.py

      - name: Validate optional Android signing secrets
        run: |
          present=0
          missing=0
          for value in "$ANDROID_KEYSTORE" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD"; do
            if [ -n "$value" ]; then present=$((present + 1)); else missing=$((missing + 1)); fi
          done
          if [ "$present" -gt 0 ] && [ "$missing" -gt 0 ]; then
            echo "Android signing secrets are only partially configured" >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = "push" ] && [ "$missing" -gt 0 ]; then
            echo "Release tags require Android signing" >&2
            exit 1
          fi

      - name: Import the Android keystore
        if: env.ANDROID_KEYSTORE != ''
        run: |
          echo "$ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          cat > ui/app/src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.jks
          keyAlias=$ANDROID_KEY_ALIAS
          password=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build the APK
        working-directory: ui/app
        run: |
          # The overlay pins both identity fields: versionName is the milestone
          # version, versionCode the injected build number.
          config="$(python3 "$GITHUB_WORKSPACE/scripts/codegen/build_android_release.py" tauri-config \
            --version-name "$APP_VERSION" --version-code "$BUILD_NUMBER")"
          echo "Tauri config overlay: $config"
          cargo tauri android build --apk --config "$config"

      # The whole update chain compares versionCode, so a config overlay that
      # Tauri silently ignored would ship an APK the phone never installs over
      # an older build. Read the number back out of the built APK instead of
      # trusting the build log.
      - name: Verify the injected build number
        run: |
          mapfile -t apks < <(find ui/app/src-tauri/gen/android -name '*.apk')
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "expected exactly one APK, found ${#apks[@]}" >&2
            exit 1
          fi
          aapt2="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt2"
          "$aapt2" dump badging "${apks[0]}" > "$RUNNER_TEMP/badging.txt"
          head -n 1 "$RUNNER_TEMP/badging.txt"
          if ! grep -Fq "versionCode='$BUILD_NUMBER'" "$RUNNER_TEMP/badging.txt"; then
            echo "APK versionCode does not match the injected $BUILD_NUMBER" >&2
            exit 1
          fi

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find ui/app/src-tauri/gen/android -name '*.apk' -exec cp {} dist/ \;
          ls -l dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-android
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish the Android release
    needs: [prepare, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload its assets
    # A manual dispatch may build and inspect the APK without touching the
    # channel phones update from; push and tag runs always publish.
    if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Stage the release APK
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          shopt -s nullglob
          apks=(artifacts/*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "expected exactly one APK artifact, found ${#apks[@]}" >&2
            exit 1
          fi
          mkdir -p release-assets
          cp "${apks[0]}" "release-assets/ava-app-$APP_VERSION.apk"

      - name: Build the update manifest
        # Only the mutable channel carries the manifest; a tag release is an
        # immutable milestone the app does not consult.
        if: github.ref_type != 'tag'
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
        run: |
          python3 scripts/codegen/build_android_release.py manifest \
            --version-code "$BUILD_NUMBER" \
            --version-name "$APP_VERSION" \
            --apk "release-assets/ava-app-$APP_VERSION.apk" \
            --commit "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY" \
            --out release-assets/android-latest.json

      - name: Create the release and upload its assets
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            # Formal release: one tag, one release, history preserved.
            TAG="$REF_NAME"
          else
            # main-branch build (or manual dispatch): keep a single mutable
            # android-latest prerelease asset; users always download the newest.
            TAG="android-latest"
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$REF_TYPE" = "tag" ]; then
              gh release create "$TAG" --title "Ava App Android $TAG" \
                --notes "Ava App Android APK release."
            else
              gh release create "$TAG" --title "Ava App Android latest" \
                --notes "Latest APK built from main." --prerelease
            fi
          fi
          # Upload the APK before the manifest: while the APK is being
          # replaced, the old manifest's sha256 no longer matches, so a client
          # refuses the half-updated channel instead of installing it. A tag
          # release has no manifest to upload.
          assets=(release-assets/*.apk)
          if [ -f release-assets/android-latest.json ]; then
            assets+=(release-assets/android-latest.json)
          fi
          gh release upload "$TAG" "${assets[@]}" --clobber
