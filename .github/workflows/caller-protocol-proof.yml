name: Caller protocol integration proof
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  prove-caller-path:
    if: github.head_ref == 'ava-5344-caller-target-gate'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AVA_DB_URL: postgresql://unused@127.0.0.1:1/unused
      AVA_REDIS_URL: redis://127.0.0.1:1/0
      AVA_RUNNER_MODE: process
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.10.2
      - uses: ./.github/actions/install-pg-redis
      - run: uv sync --frozen
      - name: Verify the real source path and fail-closed target states
        run: |
          mkdir -p proof
          git rev-parse HEAD > proof/head-sha.txt
          timeout 180 uv run pytest tests/gateway/test_caller_protocol_path.py tests/gateway/test_caller_write_fence.py tests/shared/test_caller_persistence.py tests/agent/test_hosted_ownership.py -q --junitxml=proof/caller-path.xml
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: caller-protocol-proof-${{ github.event.pull_request.head.sha }}
          path: proof/
          if-no-files-found: error
