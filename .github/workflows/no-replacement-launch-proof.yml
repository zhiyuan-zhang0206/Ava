name: Agent launch no-replacement proof
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  native-records:
    if: github.head_ref == 'ava-stability-no-replacement-launch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      AVA_HOME_OVERRIDE: '1'
      AVA_DB_URL: postgresql://unused@127.0.0.1:1/unused
      AVA_REDIS_URL: redis://127.0.0.1:1/0
      AVA_RUNNER_MODE: process
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.10.2
      - run: uv sync --frozen
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          uv run python -m unittest tests.native_agent_record_probe tests.windows_job_hypothesis_probe -v 2>&1 | tee proof/native.log
        env:
          AVA_HOME: ${{ runner.temp }}/ava-native-record-probe
      - name: Verify composed complete wheel without source or PYTHONPATH
        if: runner.os == 'Windows'
        shell: bash
        env:
          AVA_HOME: ${{ runner.temp }}/ava-native-wheel-probe
        run: |
          set -euo pipefail
          git fetch origin f3e92d17fe3b3d9626096db1848fd138ffab8d77
          git show f3e92d17fe3b3d9626096db1848fd138ffab8d77:pyproject.toml > pyproject.toml
          # Composition with reviewed #1482, not a second packaging policy.
          uv build --wheel --out-dir "$RUNNER_TEMP/native-wheel"
          uv venv "$RUNNER_TEMP/native-runtime"
          task_python="$RUNNER_TEMP/native-runtime/Scripts/python.exe"
          uv pip install --python "$task_python" "$RUNNER_TEMP/native-wheel/"*.whl
          cp tests/native_agent_record_probe.py "$RUNNER_TEMP/native_agent_record_probe.py"
          mkdir -p "$RUNNER_TEMP/poison/shared"
          printf 'raise RuntimeError("PYTHONPATH poison imported")\n' > "$RUNNER_TEMP/poison/shared/__init__.py"
          cd "$RUNNER_TEMP"
          # The Actions runner holds the checkout root open on Windows. Hide
          # every runtime package instead; exact original source paths vanish.
          restore_source() {
            for package in ava cli agent gateway services shared ops ava_builtins; do
              if test -d "$GITHUB_WORKSPACE/$package-hidden"; then
                mv "$GITHUB_WORKSPACE/$package-hidden" "$GITHUB_WORKSPACE/$package"
              fi
            done
          }
          trap restore_source EXIT
          for package in ava cli agent gateway services shared ops ava_builtins; do
            mv "$GITHUB_WORKSPACE/$package" "$GITHUB_WORKSPACE/$package-hidden"
          done
          PYTHONPATH="$RUNNER_TEMP/poison" "$task_python" -I "$RUNNER_TEMP/native_agent_record_probe.py" -v 2>&1 | tee "$GITHUB_WORKSPACE/proof/wheel-native.log"
      - name: Require original detached transport to fail the cooperative handler probe
        if: runner.os == 'Windows'
        shell: bash
        env:
          AVA_HOME: ${{ runner.temp }}/ava-native-baseline-probe
        run: |
          set -euo pipefail
          git restore pyproject.toml
          git fetch origin e3033d3b2b13c1b0565c2b49d411879b36d887e8
          for file in shared/winproc.py agent/session_admission.py tests/native_agent_record_probe.py; do
            git show "e3033d3b2b13c1b0565c2b49d411879b36d887e8:$file" > "$file"
          done
          sed -i 's/time.sleep(30)/[time.sleep(0.05) for _ in range(600)]/g' tests/native_agent_record_probe.py
          set +e
          uv run python -m unittest tests.native_agent_record_probe.NativeAgentRecordOrdering.test_ctrl_break_reaches_child_without_stopping_other_session -v > proof/baseline-native.log 2>&1
          result=$?
          set -e
          cat proof/baseline-native.log
          test "$result" -eq 1
          grep -F 'FAILED (failures=1)' proof/baseline-native.log
          grep -F 'Ctrl-Break did not reach the actual child handler' proof/baseline-native.log
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-records-${{ matrix.os }}-${{ github.event.pull_request.head.sha }}
          path: proof/
          if-no-files-found: error
  owner-and-launch:
    if: github.head_ref == 'ava-stability-no-replacement-launch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AVA_DB_URL: postgresql://unused@127.0.0.1:1/unused
      AVA_REDIS_URL: redis://127.0.0.1:1/0
      AVA_RUNNER_MODE: process
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.10.2
      - uses: ./.github/actions/install-pg-redis
      - run: uv sync --frozen
      - name: Verify actual admission and real launch consumers
        run: |
          mkdir -p proof
          git rev-parse HEAD > proof/head-sha.txt
          uv run pyright shared/windows_console_signal.py shared/winproc.py agent/session_admission.py tests/native_agent_record_probe.py
          uv run pyright --pythonplatform Windows shared/windows_console_signal.py shared/winproc.py agent/session_admission.py tests/native_agent_record_probe.py
          timeout 360 uv run pytest tests/ops/test_no_replacement_launch.py tests/ops/test_lifecycle_recovery.py tests/agent/test_restart_process_crash.py tests/agent/test_lifecycle_finalizers.py tests/ava/test_shell.py tests/shared/test_winproc_launch.py tests/shared/test_winproc_kill_boundaries.py -q --junitxml=proof/head.xml
      - name: Require exact old canonical-launch regression
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin 22e0062f78ce9b17a4196cb1a1d10e3c114343cc
          git show 22e0062f78ce9b17a4196cb1a1d10e3c114343cc:ops/agent_launch.py > ops/agent_launch.py
          set +e
          timeout 120 uv run pytest tests/ops/test_no_replacement_launch.py::test_normal_launch_allocates_unique_attempt_records -q --junitxml=proof/baseline.xml
          result=$?
          set -e
          test "$result" -eq 1
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('proof/baseline.xml')
          assert len(root.findall('.//testcase')) == 1 and not root.findall('.//error')
          failures = root.findall('.//failure')
          assert len(failures) == 1 and 'AssertionError' in failures[0].text
          PY
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: no-replacement-launch-${{ github.event.pull_request.head.sha }}
          path: proof/
          if-no-files-found: error
