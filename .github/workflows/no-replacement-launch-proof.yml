name: Agent launch no-replacement proof
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  actual-restart-e2e:
    if: github.head_ref == 'ava-stability-no-replacement-launch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AVA_RUNNER_MODE: process
      AVA_DB_URL: postgresql://unused@127.0.0.1:1/unused
      AVA_REDIS_URL: redis://127.0.0.1:1/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.10.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - uses: ./.github/actions/install-pg-redis
      - run: uv sync --frozen
      - run: npm ci
        working-directory: ui/web
      - name: Verify termination acceptance consumers
        run: |
          mkdir -p proof
          timeout 180 uv run pytest tests/cli/test_agents_cmd.py tests/ava/test_gateway_client.py -v --junitxml=proof/termination-consumers.xml
          cd ui/web
          timeout 180 npx vitest run src/lib/use-agents.test.ts --reporter=default --reporter=junit --outputFile=../../proof/termination-ui.xml
      - run: uv run playwright install --with-deps chromium
        timeout-minutes: 10
      - name: Prove actual successor completion and next message
        run: |
          mkdir -p proof
          timeout 600 uv run pytest tests/e2e/test_self_restart.py tests/e2e/test_self_resurrect.py -v --junitxml=proof/actual-restart.xml
      - name: Old wake owner must strand the deterministic delayed-exit request
        run: |
          git fetch --no-tags origin 22122ae8aa183382bae82bc8b07c74be12d98dba
          cp ops/agent_wake.py /tmp/current-agent-wake.py
          trap 'cp /tmp/current-agent-wake.py ops/agent_wake.py' EXIT
          git show 22122ae8aa183382bae82bc8b07c74be12d98dba:ops/agent_wake.py > ops/agent_wake.py
          set +e
          timeout 240 uv run pytest tests/e2e/test_self_resurrect.py::test_resurrect_brings_back_terminated_agent -v --junitxml=proof/old-wake-owner.xml
          result=$?
          set -e
          test "$result" = 1
          uv run python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('proof/old-wake-owner.xml').getroot()
          cases = list(root.iter('testcase'))
          assert len(cases) == 1 and cases[0].find('error') is None
          failure = cases[0].find('failure')
          assert failure is not None
          assert 'did not complete resurrect cycle' in failure.get('message', '')
          PY
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: actual-restart-${{ github.event.pull_request.head.sha }}
          path: |
            proof/
            tmp/e2e-logs/
          if-no-files-found: error
  native-records:
    if: github.head_ref == 'ava-stability-no-replacement-launch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      AVA_HOME_OVERRIDE: '1'
      AVA_DB_URL: postgresql://unused@127.0.0.1:1/unused
      AVA_REDIS_URL: redis://127.0.0.1:1/0
      AVA_RUNNER_MODE: process
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.10.2
      - run: uv sync --frozen
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          uv run python -m unittest tests.native_agent_record_probe tests.windows_job_hypothesis_probe -v 2>&1 | tee proof/native.log
        env:
          AVA_HOME: ${{ runner.temp }}/ava-native-record-probe
      - name: Verify composed complete wheel without source or PYTHONPATH
        if: runner.os == 'Windows'
        shell: bash
        env:
          AVA_HOME: ${{ runner.temp }}/ava-native-wheel-probe
        run: |
          set -euo pipefail
          git fetch origin f3e92d17fe3b3d9626096db1848fd138ffab8d77
          git show f3e92d17fe3b3d9626096db1848fd138ffab8d77:pyproject.toml > pyproject.toml
          # Composition with reviewed #1482, not a second packaging policy.
          uv build --wheel --out-dir "$RUNNER_TEMP/native-wheel"
          uv venv "$RUNNER_TEMP/native-runtime"
          task_python="$RUNNER_TEMP/native-runtime/Scripts/python.exe"
          uv pip install --python "$task_python" "$RUNNER_TEMP/native-wheel/"*.whl
          cp tests/native_agent_record_probe.py "$RUNNER_TEMP/native_agent_record_probe.py"
          mkdir -p "$RUNNER_TEMP/poison/shared"
          printf 'raise RuntimeError("PYTHONPATH poison imported")\n' > "$RUNNER_TEMP/poison/shared/__init__.py"
          cd "$RUNNER_TEMP"
          # The Actions runner holds the checkout root open on Windows. Hide
          # every runtime package instead; exact original source paths vanish.
          restore_source() {
            for package in ava cli agent gateway services shared ops ava_builtins; do
              if test -d "$GITHUB_WORKSPACE/$package-hidden"; then
                mv "$GITHUB_WORKSPACE/$package-hidden" "$GITHUB_WORKSPACE/$package"
              fi
            done
          }
          trap restore_source EXIT
          for package in ava cli agent gateway services shared ops ava_builtins; do
            mv "$GITHUB_WORKSPACE/$package" "$GITHUB_WORKSPACE/$package-hidden"
          done
          PYTHONPATH="$RUNNER_TEMP/poison" "$task_python" -I "$RUNNER_TEMP/native_agent_record_probe.py" -v 2>&1 | tee "$GITHUB_WORKSPACE/proof/wheel-native.log"
      - name: Require original detached transport to fail the cooperative handler probe
        if: runner.os == 'Windows'
        shell: bash
        env:
          AVA_HOME: ${{ runner.temp }}/ava-native-baseline-probe
        run: |
          set -euo pipefail
          git restore pyproject.toml
          git fetch origin e3033d3b2b13c1b0565c2b49d411879b36d887e8
          for file in shared/winproc.py agent/session_admission.py tests/native_agent_record_probe.py; do
            git show "e3033d3b2b13c1b0565c2b49d411879b36d887e8:$file" > "$file"
          done
          sed -i 's/time.sleep(30)/[time.sleep(0.05) for _ in range(600)]/g' tests/native_agent_record_probe.py
          set +e
          uv run python -m unittest tests.native_agent_record_probe.NativeAgentRecordOrdering.test_ctrl_break_reaches_child_without_stopping_other_session -v > proof/baseline-native.log 2>&1
          result=$?
          set -e
          cat proof/baseline-native.log
          test "$result" -eq 1
          grep -F 'FAILED (failures=1)' proof/baseline-native.log
          grep -F 'Ctrl-Break did not reach the actual child handler' proof/baseline-native.log
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-records-${{ matrix.os }}-${{ github.event.pull_request.head.sha }}
          path: proof/
          if-no-files-found: error
  owner-and-launch:
    if: github.head_ref == 'ava-stability-no-replacement-launch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AVA_DB_URL: postgresql://unused@127.0.0.1:1/unused
      AVA_REDIS_URL: redis://127.0.0.1:1/0
      AVA_RUNNER_MODE: process
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.10.2
      - uses: ./.github/actions/install-pg-redis
      - run: uv sync --frozen
      - name: Verify actual admission and real launch consumers
        run: |
          mkdir -p proof
          git rev-parse HEAD > proof/head-sha.txt
          uv run pyright shared/windows_console_signal.py shared/winjob_spawn.py shared/winproc.py agent/session_admission.py tests/native_agent_record_probe.py
          uv run pyright --pythonplatform Windows shared/windows_console_signal.py shared/winjob_spawn.py shared/winproc.py agent/session_admission.py tests/native_agent_record_probe.py
          uv run pyright ops/agent_wake.py services/delivery_watchdog/daemon.py tests/agent/_restart_boot_probe.py tests/agent/test_claim.py tests/agent/test_hosted_lifecycle.py tests/agent/test_lifecycle_finalizers.py tests/shared/test_winproc_kill_boundaries.py
          timeout 360 uv run pytest tests/ops/test_no_replacement_launch.py tests/ops/test_lifecycle_recovery.py tests/agent/test_restart_process_crash.py tests/agent/test_lifecycle_finalizers.py tests/ava/test_shell.py tests/shared/test_winproc_launch.py tests/shared/test_winproc_kill_boundaries.py -q --junitxml=proof/head.xml
          timeout 360 uv run pytest tests/agent/test_claim.py tests/agent/test_hosted_lifecycle.py tests/agent/test_hosted_force_quiescence.py tests/agent/test_exec_process.py tests/agent/test_lifecycle_apply.py tests/agent/test_resurrection_launch.py -q --junitxml=proof/claim-compatibility.xml
          timeout 360 uv run pytest tests/ops/test_cold_lifecycle.py tests/agent/test_inbound_ownership.py tests/agent/test_compact.py -q --junitxml=proof/completion-boundaries.xml
          timeout 180 uv run pytest tests/shared/test_bootstrap_values.py tests/shared/test_gateway_consumer_guard.py tests/shared/test_pty_sessions_cli.py::test_terminal_observation_never_accepts_live_or_unreadable tests/shared/test_pty_sessions_cli.py::test_has_defeats_pid_reuse tests/shared/test_pty_sessions_cli.py::test_new_reaps_a_recordless_host_before_replacement -q --junitxml=proof/boot-observation.xml
          uv run pyright ops/resurrection_retry.py tests/gateway/test_agents_internals.py tests/agent/test_lifecycle_apply.py
          timeout 360 uv run pytest tests/gateway/test_agents_internals.py tests/gateway/test_operations.py tests/ops/test_agent_wake_hosted.py tests/cli/test_update_dispatch_guard.py tests/shared/test_event_contract.py -q --junitxml=proof/backend-compatibility.xml
          timeout 120 uv run pytest tests/shared/test_config.py -k 'skip_auth_alias or skip_security_scan_alias or skip_alias_test' -q --junitxml=proof/config-alias-isolation.xml
          timeout 120 uv run pytest tests/services/test_turn_dispatcher.py -v --junitxml=proof/turn-dispatcher.xml
          uv run pyright tests/services/test_agent_host.py tests/shared/test_timing_topology.py
          timeout 240 uv run pytest tests/services/test_agent_host.py tests/shared/test_timing_topology.py tests/test_lint_event_kinds.py -q --junitxml=proof/controller-compatibility.xml
      - name: Require old routing to strand the accepted termination
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin 9c5194d74136d1b0f18016be0223609dd96750be
          git show 9c5194d74136d1b0f18016be0223609dd96750be:agent/graph/_claim_routing.py > agent/graph/_claim_routing.py
          set +e
          timeout 120 uv run pytest tests/agent/test_lifecycle_apply.py::test_accepted_termination_ignores_pending_veto_but_retains_apply_fence -q --junitxml=proof/baseline-routing.xml
          result=$?
          set -e
          git restore agent/graph/_claim_routing.py
          test "$result" -eq 1
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('proof/baseline-routing.xml')
          assert len(root.findall('.//testcase')) == 3 and not root.findall('.//error')
          failures = root.findall('.//failure')
          assert len(failures) == 3
          assert all('routing.exit_kind' in f.text and 'None' in f.text for f in failures)
          PY
      - name: Require exact old canonical-launch regression
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin 22e0062f78ce9b17a4196cb1a1d10e3c114343cc
          git show 22e0062f78ce9b17a4196cb1a1d10e3c114343cc:ops/agent_launch.py > ops/agent_launch.py
          set +e
          timeout 120 uv run pytest tests/ops/test_no_replacement_launch.py::test_normal_launch_allocates_unique_attempt_records -q --junitxml=proof/baseline.xml
          result=$?
          set -e
          test "$result" -eq 1
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('proof/baseline.xml')
          assert len(root.findall('.//testcase')) == 1 and not root.findall('.//error')
          failures = root.findall('.//failure')
          assert len(failures) == 1 and 'AssertionError' in failures[0].text
          PY
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: no-replacement-launch-${{ github.event.pull_request.head.sha }}
          path: proof/
          if-no-files-found: error
