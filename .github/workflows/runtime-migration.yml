name: Verified release migration authority
on:
  pull_request:
    paths:
      - 'shared/runtime_migration.py'
      - 'shared/migrations.py'
      - 'shared/migration_layout.py'
      - 'shared/runtime_release.py'
      - 'cli/start_runtime.py'
      - 'cli/start_identity.py'
      - 'cli/start_intent.py'
      - 'cli/commands/start.py'
      - 'cli/commands/migrations.py'
      - 'scripts/prove_runtime_migration.py'
      - 'tests/shared/test_runtime_migration.py'
      - 'tests/shared/test_migration_authority.py'
      - 'tests/cli/test_start_runtime.py'
      - '.github/workflows/runtime-migration.yml'
permissions:
  contents: read
jobs:
  authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AVA_DB_URL: postgresql://unused@127.0.0.1:1/unused
      AVA_REDIS_URL: redis://127.0.0.1:1/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: '3.12'
      - uses: ./.github/actions/install-pg-redis
      - run: uv sync --locked
      - name: Type-check migration authority and separate start admission
        run: uv run pyright shared/runtime_migration.py cli/start_runtime.py cli/commands/migrations.py scripts/prove_runtime_migration.py tests/shared/test_runtime_migration.py tests/cli/test_start_runtime.py
      - name: Real native PG authority and checkout regression cases
        run: uv run pytest -q tests/shared/test_runtime_migration.py tests/shared/test_migration_authority.py tests/cli/test_start_runtime.py --junitxml=runtime-migration.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: runtime-migration-${{ github.event.pull_request.head.sha }}
          path: runtime-migration.xml
          if-no-files-found: error
