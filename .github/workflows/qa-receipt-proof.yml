name: QA receipt regression proof
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['scripts/qa_*', 'tests/test_qa_receipt.py', '.github/workflows/qa-*.yml']
permissions:
  contents: read
jobs:
  prove-qa-receipt:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Run isolated gate fixtures without cluster or credentials
        run: |
          python -m pip install pytest==8.4.2
          mkdir -p proof
          task_scratch=$(mktemp -d)
          mkdir -p "$task_scratch/scripts"
          cp scripts/qa_receipt.py "$task_scratch/scripts/"
          cp tests/test_qa_receipt.py "$task_scratch/"
          cd "$task_scratch"
          timeout 60 python -m pytest -c /dev/null test_qa_receipt.py -q --junitxml="$GITHUB_WORKSPACE/proof/head.xml"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qa-receipt-proof-${{ github.event.pull_request.head.sha }}
          path: proof/
          if-no-files-found: error
