name: Exec domain ownership proof
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'shared/incarnation_resources.py'
      - 'tests/agent/test_incarnation_resources*.py'
      - 'migrations/*incarnation-resources*'
      - '.github/workflows/exec-domain-owner.yml'
      - 'agent/graph/_exec_process.py'
      - 'shared/winjob.py'
      - 'tests/agent/test_exec_domain_confirmation.py'
      - 'agent/exec*owner*.py'
      - 'agent/graph/_exec_owned_run.py'
      - 'shared/exec_owner*.py'
      - 'shared/resource_admission.py'
      - 'tests/agent/test_exec_owner_entry.py'
      - 'tests/agent/test_resource_admission.py'
permissions:
  contents: read
jobs:
  resource-fences:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AVA_DB_URL: postgresql://unused@127.0.0.1:1/unused
      AVA_REDIS_URL: redis://127.0.0.1:1/0
      AVA_RUNNER_MODE: process
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.10.2
      - uses: ./.github/actions/install-pg-redis
      - run: uv sync --frozen
      - name: Exact schema and registration fences
        run: |
          mkdir -p proof
          git rev-parse HEAD > proof/head-sha.txt
          uv run pyright shared/incarnation_resources.py shared/resource_admission.py shared/exec_owner_protocol.py shared/exec_owner_recovery.py agent/graph/_exec_owned_run.py agent/exec_domain_owner.py agent/exec_owner_child.py tests/agent/test_incarnation_resources.py tests/agent/test_incarnation_resources_migration.py tests/agent/test_resource_admission.py
          timeout 240 uv run pytest tests/agent/test_incarnation_resources.py tests/agent/test_incarnation_resources_migration.py tests/agent/test_resource_admission.py -q --junitxml=proof/resource-fences.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: exec-resource-fences-${{ github.event.pull_request.head.sha }}
          path: proof/
          if-no-files-found: error
  native-domain:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      AVA_DB_URL: postgresql://unused@127.0.0.1:1/unused
      AVA_REDIS_URL: redis://127.0.0.1:1/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.10.2
      - run: uv sync --frozen
      - name: Real native domain member closure
        shell: bash
        run: |
          mkdir -p proof
          git rev-parse HEAD > proof/head-sha.txt
          # The existing cross-platform domain uses IS_WINDOWS, which pyright
          # cannot narrow; type its POSIX API surface explicitly, and check the
          # native Job implementation against Windows separately on every lane.
          uv run pyright --pythonplatform Linux shared/winjob.py agent/graph/_exec_process.py tests/agent/test_exec_domain_confirmation.py
          uv run pyright --pythonplatform Windows shared/winjob.py
          uv run pytest --confcutdir=tests/agent tests/agent/test_exec_domain_confirmation.py tests/agent/test_exec_owner_entry.py -q --junitxml=proof/native-domain.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: exec-native-domain-${{ matrix.os }}-${{ github.event.pull_request.head.sha }}
          path: proof/
          if-no-files-found: error
