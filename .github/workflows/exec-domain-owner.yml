name: Exec domain ownership proof
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'base/agents/incarnation/resources.py'
      - 'base/agents/incarnation/tests/test_resources*.py'
      - '.github/workflows/exec-domain-owner.yml'
      - 'agent/graph/exec/_process.py'
      - 'base/native_process/tests/test_exec_domain_confirmation.py'
      - 'agent/execution/*.py'
      - 'agent/graph/exec/_owned_run.py'
      - 'base/agents/incarnation/exec_owner*.py'
      - 'base/agents/incarnation/resource_admission.py'
      - 'base/native_process/exec_domain.py'
      - 'agent/tests/execution/test_exec_owner_entry.py'
      - 'agent/tests/test_resource_admission.py'
      - 'agent/tests/path_scopes.toml'
      - 'agent/graph/exec/tests/admission_fixture.py'
      - 'agent/graph/exec/tests/test_resource_admission_exec.py'
      - 'base/agents/incarnation/tests/test_resource_admission.py'
permissions:
  contents: read
env:
  UV_FROZEN: "1"
jobs:
  resource-fences:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AVA_DB_URL: postgresql://unused@127.0.0.1:1/unused
      AVA_REDIS_URL: redis://127.0.0.1:1/0
      AVA_GATEWAY_URL: http://127.0.0.1:1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: 0.10.2
      - uses: ./.github/actions/install-pg-redis
      - run: uv sync --frozen
      - name: Vendored Postgres runtime (production's server build)
        uses: ./.github/actions/vendor-pg-runtime
      - name: Exact schema and registration fences
        run: |
          mkdir -p proof
          git rev-parse HEAD > proof/head-sha.txt
          uv run pyright agent/graph/exec/tests/admission_fixture.py base/agents/incarnation/resources.py base/agents/incarnation/resource_admission.py base/agents/incarnation/exec_owner_protocol.py base/agents/incarnation/exec_owner_recovery.py agent/graph/exec/_owned_run.py agent/execution/domain_owner.py agent/execution/owner_child.py base/agents/incarnation/tests/test_resources.py tests/components/ava/test_migration_baseline.py agent/tests/test_resource_admission.py agent/graph/exec/tests/test_resource_admission_exec.py base/agents/incarnation/tests/test_resource_admission.py
          timeout 240 uv run pytest base/agents/incarnation/tests/test_resources.py tests/components/ava/test_migration_baseline.py agent/tests/test_resource_admission.py agent/graph/exec/tests/test_resource_admission_exec.py base/agents/incarnation/tests/test_resource_admission.py -q --junitxml=proof/resource-fences.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: exec-resource-fences-${{ github.event.pull_request.head.sha }}
          path: proof/
          if-no-files-found: error
  native-domain:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      AVA_DB_URL: postgresql://unused@127.0.0.1:1/unused
      AVA_REDIS_URL: redis://127.0.0.1:1/0
      AVA_GATEWAY_URL: http://127.0.0.1:1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: 0.10.2
      - run: uv sync --frozen
      - name: Real native domain member closure
        shell: bash
        run: |
          mkdir -p proof
          git rev-parse HEAD > proof/head-sha.txt
          uv run pyright base/native_process/exec_domain.py agent/graph/exec/_process.py base/native_process/tests/test_exec_domain_confirmation.py
          uv run pytest --confcutdir=tests/components/agent base/native_process/tests/test_exec_domain_confirmation.py agent/tests/execution/test_exec_owner_entry.py -q --junitxml=proof/native-domain.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: exec-native-domain-${{ matrix.os }}-${{ github.event.pull_request.head.sha }}
          path: proof/
          if-no-files-found: error
