name: Process lifecycle dispatch proof
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['agent/**', 'tests/agent/test_lifecycle_apply.py', '.github/workflows/lifecycle-dispatch-proof.yml']
permissions:
  contents: read
jobs:
  prove-process-lifecycle:
    if: github.head_ref == 'ava-stability-lifecycle-dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AVA_DB_URL: postgresql://unused@127.0.0.1:1/unused
      AVA_REDIS_URL: redis://127.0.0.1:1/0
      AVA_RUNNER_MODE: process
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.10.2
      - uses: ./.github/actions/install-pg-redis
      - run: uv sync --frozen
      - name: Prove serialized dispatch and old early acknowledgement failure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          git rev-parse HEAD > proof/head-sha.txt
          uv run pyright agent/db.py agent/graph/_claim_routing.py tests/agent/test_claim.py tests/agent/test_lifecycle_apply.py
          timeout 360 uv run pytest tests/agent/test_claim.py -q --junitxml=proof/claim-compatibility.xml
          timeout 240 uv run pytest tests/agent/test_lifecycle_apply.py -q --junitxml=proof/head.xml
          git show 0027bb9528b39d2ca08a66a35768589dc29d5456:agent/graph/_claim_routing.py > agent/graph/_claim_routing.py
          set +e
          timeout 120 uv run pytest tests/agent/test_lifecycle_apply.py::test_accepted_termination_ignores_pending_veto_but_retains_apply_fence -q --junitxml=proof/baseline-routing.xml
          route_result=$?
          set -e
          git restore agent/graph/_claim_routing.py
          test "$route_result" -eq 1
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('proof/baseline-routing.xml')
          assert len(root.findall('.//testcase')) == 3 and not root.findall('.//error')
          failures = root.findall('.//failure')
          assert len(failures) == 3
          assert all('routing.exit_kind' in f.text and 'None' in f.text for f in failures)
          PY
          git show 40ad47ca3:agent/db.py > agent/db.py
          set +e
          timeout 180 uv run pytest tests/agent/test_lifecycle_apply.py -k actual_process_dispatch -q --junitxml=proof/baseline.xml
          result=$?
          set -e
          test "$result" -eq 1
          python - <<'PY'
          import xml.etree.ElementTree as ET
          head = ET.parse('proof/head.xml')
          assert len(head.findall('.//testcase')) >= 3
          assert not head.findall('.//failure') and not head.findall('.//error')
          old = ET.parse('proof/baseline.xml')
          assert len(old.findall('.//testcase')) == 2 and not old.findall('.//error')
          assert len(old.findall('.//failure')) == 2
          for failure in old.findall('.//failure'):
              assert 'assert [item.id for item in batch] == [first]' in failure.text
          PY
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lifecycle-dispatch-proof-${{ github.event.pull_request.head.sha }}
          path: proof/
          if-no-files-found: error
