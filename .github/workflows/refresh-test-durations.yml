name: Refresh test durations

# Daily, measure every CI-shaped shard on its own runner, merge the timings and save
# them as an Actions cache (`test-durations-<date>-<run id>-<attempt>`) on main.
# ci.yml's `classify` resolves the newest such cache once per run and every shard
# restores that exact key into `.test_durations`; caches written on main are readable
# by every pull request, and the daily writes keep the entry from ever going unused for
# the seven days after which Actions evicts it. Nothing is committed and no pull
# request is opened, so no workflow needs a maintainer's approval. See
# scripts/ci/docs/duration-refresh.md.

on:
  schedule:
    - cron: '30 19 * * *'  # UTC — GitHub Actions schedule cron is always UTC
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  UV_FROZEN: "1"

concurrency:
  group: refresh-test-durations
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    name: Resolve the current test durations
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      key: ${{ steps.durations.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The measured shards split with the current model, as CI does; the first run
      # has none and splits by test count.
      - name: Resolve the test durations
        id: durations
        uses: ./.github/actions/resolve-test-durations

  measure-backend:
    needs: plan
    name: Measure backend durations (${{ matrix.group }}/8)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      # Sentinel data planes: the suite must provision its own throwaway
      # cluster; a sentinel turns a leaked real-data-plane access into a
      # connection error rather than a silent write. Same as ci.yml.
      AVA_DB_URL: postgresql://unused@127.0.0.1:1/unused
      AVA_REDIS_URL: redis://127.0.0.1:1/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore the test durations
        uses: ./.github/actions/restore-test-durations
        with:
          key: ${{ needs.plan.outputs.key }}

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.23'
          enable-cache: true

      - name: Install Postgres 17 + Redis (server binaries on PATH)
        uses: ./.github/actions/install-pg-redis

      - name: Install locked Python environment
        run: uv sync --frozen

      - name: Vendored Postgres runtime (production's server build)
        uses: ./.github/actions/vendor-pg-runtime

      - name: Measure backend shard
        run: >
          uv run python scripts/ci/refresh_test_durations.py measure backend
          --group ${{ matrix.group }}
          --output "$RUNNER_TEMP/durations/backend-${{ matrix.group }}.json"

      - name: Upload backend duration measurement
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-durations-backend-${{ matrix.group }}
          path: ${{ runner.temp }}/durations/backend-${{ matrix.group }}.json
          if-no-files-found: error

  measure-e2e:
    needs: plan
    name: Measure e2e durations (${{ matrix.group }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    env:
      AVA_DB_URL: postgresql://unused@127.0.0.1:1/unused
      AVA_REDIS_URL: redis://127.0.0.1:1/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore the test durations
        uses: ./.github/actions/restore-test-durations
        with:
          key: ${{ needs.plan.outputs.key }}

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.23'
          enable-cache: true

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/web/package-lock.json

      - name: Install Postgres 17 + Redis (server binaries on PATH)
        uses: ./.github/actions/install-pg-redis

      - name: Install locked Python environment
        run: uv sync --frozen

      - name: Vendored Postgres runtime (production's server build)
        uses: ./.github/actions/vendor-pg-runtime

      - name: Install frontend deps
        working-directory: ui/web
        run: npm ci

      # Same restore/save split as the e2e-shard job's browser cache (see ci.yml).
      - name: Restore Playwright chromium cache
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install Playwright chromium
        # Same split + hardened apt pass as the e2e-shard job (see ci.yml).
        timeout-minutes: 10
        run: timeout 300 uv run playwright install chromium
      - name: Save Playwright chromium cache
        if: success() && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Install Playwright system deps
        uses: ./.github/actions/install-playwright-deps
        timeout-minutes: 15

      - name: Measure e2e shard
        run: >
          uv run python scripts/ci/refresh_test_durations.py measure e2e
          --group ${{ matrix.group }}
          --output "$RUNNER_TEMP/durations/e2e-${{ matrix.group }}.json"

      - name: Upload e2e duration measurement
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-durations-e2e-${{ matrix.group }}
          path: ${{ runner.temp }}/durations/e2e-${{ matrix.group }}.json
          if-no-files-found: error

  publish:
    needs: [plan, measure-backend, measure-e2e]
    if: >-
      !cancelled() && needs.measure-backend.result == 'success' &&
      needs.measure-e2e.result == 'success'
    name: Merge and save the test durations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      key: ${{ steps.stamp.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.23'
          enable-cache: true

      - name: Install locked Python environment
        run: uv sync --frozen

      - name: Download shard measurements
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-durations-*
          path: ${{ runner.temp }}/durations
          merge-multiple: true

      # Fails unless all 12 shard artifacts arrived and none is empty or overlaps another,
      # so a partial timing model is never saved.
      - name: Merge complete shard measurements
        run: >
          uv run python scripts/ci/refresh_test_durations.py merge
          --durations-dir "$RUNNER_TEMP/durations"

      - name: Name the cache entry
        id: stamp
        run: |
          echo "key=test-durations-$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Save .test_durations
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .test_durations
          key: ${{ steps.stamp.outputs.key }}

  verify:
    needs: publish
    name: Verify the saved test durations restore
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The cache listing can trail a save by a few seconds; wait (bounded) until it names
      # the entry just saved, so the checks below test restoring and not listing latency.
      - name: Wait for the saved cache to be listed
        env:
          GH_TOKEN: ${{ github.token }}
          SAVED_KEY: ${{ needs.publish.outputs.key }}
        run: |
          for attempt in $(seq 1 20); do
            listed="$(gh api "repos/${GITHUB_REPOSITORY}/actions/caches?ref=refs/heads/main&key=${SAVED_KEY}&per_page=1" --jq '.actions_caches[0].key // ""')"
            [ "$listed" = "$SAVED_KEY" ] && exit 0
            sleep 10
          done
          echo "::error::${SAVED_KEY} was not listed within 200 seconds of being saved"
          exit 1

      # The same two actions a CI run uses: the newest cache must be the one just saved,
      # restore from its exact key and hold the merged timings.
      - name: Resolve the test durations
        id: durations
        uses: ./.github/actions/resolve-test-durations

      - name: Restore the test durations
        uses: ./.github/actions/restore-test-durations
        with:
          key: ${{ steps.durations.outputs.key }}

      - name: Check what was restored
        env:
          SAVED_KEY: ${{ needs.publish.outputs.key }}
          RESOLVED_KEY: ${{ steps.durations.outputs.key }}
        run: |
          if [ "$RESOLVED_KEY" != "$SAVED_KEY" ]; then
            echo "::error::the newest test-durations cache is '${RESOLVED_KEY}', not the one just saved ('${SAVED_KEY}')"
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path

          timings = json.loads(Path(".test_durations").read_text())
          assert isinstance(timings, dict) and len(timings) > 1000, f"only {len(timings)} entries"
          assert all(isinstance(v, (int, float)) for v in timings.values())
          print(f"restored {len(timings)} timings from the saved cache")
          PY
