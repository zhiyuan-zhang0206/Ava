name: CI retry safety proof
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/ci-rerun.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/runtime-prepare.yml'
      - 'tests/test_ci_rerun_workflow.py'
      - '.github/actions/uv-sync/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/ci-rerun-proof.yml'
permissions:
  contents: read
jobs:
  prove-retry-guard:
    if: github.head_ref == 'ava-5344-ci-rerun-fence'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: 0.10.2
      - uses: ./.github/actions/uv-sync
      - run: uv run pytest --noconftest tests/test_ci_rerun_workflow.py -q
