name: Inactive runtime preparation
on:
  pull_request:
    paths:
      - 'shared/runtime_prepare.py'
      - 'shared/runtime_release.py'
      - 'shared/runtime_interpreter.py'
      - 'shared/dotenv_boot.py'
      - 'shared/platform_backend.py'
      - 'shared/session_env.py'
      - 'ops/spec.py'
      - 'ops/agent_launch.py'
      - 'agent/graph/_exec_subprocess.py'
      - 'scripts/prove_runtime_consumer.py'
      - 'scripts/prove_runtime_prepare.py'
      - 'scripts/verify_runtime_wheel.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/runtime-prepare.yml'
permissions:
  contents: read
jobs:
  cold-offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: '3.12'
      - name: Fetch immutable build inputs before offline preparation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prepare/wheels"
          uv build --wheel --out-dir "$RUNNER_TEMP/prepare/wheels"
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/prepare/source-requirements.txt"
          uv run --no-project --with pip python -m pip wheel --require-hashes -r "$RUNNER_TEMP/prepare/source-requirements.txt" --wheel-dir "$RUNNER_TEMP/prepare/wheels"
          python3 - <<'PY'
          import email, hashlib, os, pathlib, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'prepare'
          locked = []
          for wheel in sorted((root / 'wheels').glob('*.whl')):
              with zipfile.ZipFile(wheel) as archive:
                  metadata, = [name for name in archive.namelist() if name.endswith('.dist-info/METADATA') and name.count('/') == 1]
                  package = email.message_from_bytes(archive.read(metadata))
              if package['Name'].lower() == 'ava':
                  continue
              locked.append(f"{package['Name']}=={package['Version']} --hash=sha256:{hashlib.sha256(wheel.read_bytes()).hexdigest()}")
          (root / 'requirements.txt').write_text('\n'.join(locked) + '\n')
          PY
      - name: Real offline prepare, retained interpreter and failure isolation
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.12
          python3 scripts/prove_runtime_prepare.py --root "$RUNNER_TEMP/prepare" --python "$(uv python find --managed-python 3.12)" --uv "$(command -v uv)"
          test -s "$RUNNER_TEMP/prepare/proof.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: inactive-prepare-${{ matrix.os }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/prepare/proof.json
          if-no-files-found: error
