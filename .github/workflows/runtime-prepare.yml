name: Inactive runtime preparation
on:
  pull_request:
    paths:
      - 'shared/runtime_prepare.py'
      - 'shared/runtime_release.py'
      - 'shared/runtime_interpreter.py'
      - 'shared/runtime_publication_input.py'
      - 'shared/verified_file.py'
      - 'shared/migration_layout.py'
      - 'cli/release_build.py'
      - 'tests/integration/test_release_build.py'
      - 'scripts/prove_runtime_publication_input.py'
      - 'scripts/prove_exec_owner_installed.py'
      - 'scripts/runtime-node-version'
      - 'shared/dotenv_boot.py'
      - 'shared/platform_backend.py'
      - 'shared/session_env.py'
      - 'ops/spec.py'
      - 'ops/agent_launch.py'
      - 'agent/graph/_exec_subprocess.py'
      - 'scripts/prove_runtime_consumer.py'
      - 'scripts/prove_runtime_prepare.py'
      - 'scripts/prepare_otel_release.py'
      - 'scripts/prove_runtime_otel.py'
      - 'cli/commands/_otel_collector.py'
      - 'shared/paths.py'
      - 'shared/runtime_plugins.py'
      - 'cli/commands/_release_plugin_probe.py'
      - 'shared/plugins_config.py'
      - 'ava/_extend.py'
      - 'scripts/prove_runtime_plugins.py'
      - 'scripts/prove_release_inventory.py'
      - 'cli/commands/_release_inventory.py'
      - 'scripts/prepare_plugin_fixture.py'
      - 'scripts/prove_ops_bootstrap.py'
      - 'scripts/prove_normal_release.py'
      - 'scripts/prove_updater_bootstrap.py'
      - 'cli/commands/_update_bootstrap/**'
      - 'cli/commands/_update_agent_runner.py'
      - 'shared/updater_handoff.py'
      - 'services/agent_ops/bootstrap.py'
      - 'services/agent_ops/daemon.py'
      - 'cli/commands/_update_normal_release.py'
      - 'cli/commands/_release_services.py'
      - 'cli/commands/_release_selector.py'
      - 'shared/spawn_receipt.py'
      - 'shared/updater_recovery.py'
      - 'shared/managed_writer_activation.py'
      - 'shared/managed_writer_publication.py'
      - 'shared/managed_writer_barrier.py'
      - 'shared/managed_writer_observation.py'
      - 'shared/managed_writer_closure.py'
      - 'shared/native_job_observation.py'
      - 'cli/commands/_update_publication.py'
      - 'scripts/prove_managed_writer_chain.py'
      - 'scripts/prove_runtime_migration.py'
      - 'shared/runtime_migration.py'
      - 'cli/commands/_release_candidate.py'
      - 'scripts/verify_runtime_wheel.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/runtime-prepare.yml'
permissions:
  contents: read
jobs:
  cold-offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    # The ubuntu leg runs the offline prepare plus the full proof suites
    # (~75 min on round-3 attempt 1's shape); 45 clipped mid-suite.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: scripts/runtime-node-version
      - uses: ./.github/actions/install-pg-redis
        if: runner.os == 'Linux'
      - name: Start isolated native PG for wheel admission proof
        if: runner.os == 'Linux'
        shell: bash
        run: |
          initdb -D "$RUNNER_TEMP/runtime-pg" --auth=trust --username=runtimeproof
          mkdir -m 700 "$RUNNER_TEMP/runtime-pg-socket"
          pg_ctl -D "$RUNNER_TEMP/runtime-pg" -l "$RUNNER_TEMP/runtime-pg.log" -o "-h 127.0.0.1 -p 55439 -k $RUNNER_TEMP/runtime-pg-socket" -w start || { tail -80 "$RUNNER_TEMP/runtime-pg.log"; exit 1; }
          echo 'AVA_RUNTIME_PROOF_PG=postgresql://runtimeproof@127.0.0.1:55439/postgres' >> "$GITHUB_ENV"
      - name: Fetch immutable build inputs before offline preparation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prepare/wheels"
          uv build --wheel --out-dir "$RUNNER_TEMP/prepare/wheels"
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/prepare/source-requirements.txt"
          uv run --no-project --with pip python -m pip wheel --require-hashes -r "$RUNNER_TEMP/prepare/source-requirements.txt" --wheel-dir "$RUNNER_TEMP/prepare/wheels"
          python3 - <<'PY'
          import email, hashlib, os, pathlib, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'prepare'
          locked = []
          for wheel in sorted((root / 'wheels').glob('*.whl')):
              with zipfile.ZipFile(wheel) as archive:
                  metadata, = [name for name in archive.namelist() if name.endswith('.dist-info/METADATA') and name.count('/') == 1]
                  package = email.message_from_bytes(archive.read(metadata))
              if package['Name'].lower() == 'ava':
                  continue
              locked.append(f"{package['Name']}=={package['Version']} --hash=sha256:{hashlib.sha256(wheel.read_bytes()).hexdigest()}")
          (root / 'requirements.txt').write_text('\n'.join(locked) + '\n')
          PY
      - name: Prepare standalone frontend outside maintenance
        shell: bash
        env:
          AVA_FRONTEND_RELEASE: '1'
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_GATEWAY_PORT: '8000'
          NEXT_PUBLIC_API_BASE: ''
        run: |
          npm --prefix ui/web ci
          npm --prefix ui/web run build
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import { frontendInputs, prepareFrontend, recordFrontendBuildConfig } from './scripts/prepare_frontend_release.mjs';
          const source = path.resolve('ui/web');
          const node = fs.realpathSync(process.execPath);
          recordFrontendBuildConfig(source, process.env.NEXT_PUBLIC_GATEWAY_PORT, process.env.NEXT_PUBLIC_API_BASE);
          prepareFrontend(source, node, path.join(process.env.RUNNER_TEMP, 'prepare/frontend-input'), frontendInputs(source, node));
          JS
      - name: Download the existing pinned collector outside maintenance
        shell: bash
        run: uv run --locked --no-dev python scripts/prepare_otel_release.py "$RUNNER_TEMP/prepare/otel-input"
      - name: Build the committed application input offline
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --no-dev python -m cli.release_build \
            --repo "$GITHUB_WORKSPACE" --commit "$(git rev-parse HEAD)" \
            --output "$RUNNER_TEMP/prepare/application-build" \
            --uv "$(command -v uv)" --python "$GITHUB_WORKSPACE/.venv/bin/python" --cache-dir "$(uv cache dir)"
          python3 - <<'PY'
          import json, os, pathlib, shutil
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'prepare'
          receipt = json.loads((root / 'application-build/build-receipt.json').read_bytes())
          previous, = (root / 'wheels').glob('ava-*.whl')
          assert previous.name == receipt['wheel']
          shutil.copyfile(root / 'application-build/wheels' / receipt['wheel'], previous)
          PY
      - name: Type-check retained collector integration
        shell: bash
        run: uv run --locked pyright scripts/prepare_otel_release.py scripts/prove_runtime_otel.py scripts/prove_runtime_plugins.py scripts/prove_release_inventory.py scripts/prepare_plugin_fixture.py scripts/prove_updater_bootstrap.py scripts/prove_normal_release.py shared/runtime_plugins.py shared/runtime_prepare.py shared/runtime_interpreter.py shared/paths.py shared/updater_handoff.py cli/commands/_otel_collector.py cli/commands/_release_inventory.py cli/commands/_update_bootstrap cli/commands/_update_agent_runner.py
      - name: Type-check publication input reader
        run: uv run --locked pyright shared/runtime_publication_input.py shared/verified_file.py scripts/prove_runtime_publication_input.py
      - name: Type-check managed-writer activation chain proof
        run: uv run --locked pyright scripts/prove_managed_writer_chain.py
      - name: Publication selector compatibility
        if: runner.os == 'Linux'
        run: uv run --locked pytest tests/shared/test_runtime_publication_input.py -q
      - name: Real offline prepare, retained interpreter and failure isolation
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.12
          # The proof retires the checkout, including .venv. Resolve its base
          # interpreter outside that tree, using the same Python as validation.
          proof_python=$(uv run --locked --no-dev python -c 'import pathlib, sys; p = pathlib.Path(sys.executable).resolve(strict=True); assert not p.is_relative_to(pathlib.Path.cwd()); print(p)')
          "$proof_python" scripts/prepare_plugin_fixture.py "$RUNNER_TEMP/prepare/plugin-input"
          "$proof_python" scripts/prove_runtime_prepare.py --root "$RUNNER_TEMP/prepare" --python "$proof_python" --uv "$(command -v uv)"
          test -s "$RUNNER_TEMP/prepare/proof.json"
          if [[ "$RUNNER_OS" == Linux ]]; then test -s "$RUNNER_TEMP/prepare/ops-bootstrap-proof.json"; fi
          if [[ "$RUNNER_OS" == Linux ]]; then test -s "$RUNNER_TEMP/prepare/inventory-proof.json"; fi
          if [[ "$RUNNER_OS" == Linux ]]; then test -s "$RUNNER_TEMP/prepare/updater-bootstrap-proof.json"; fi
          if [[ "$RUNNER_OS" == Linux ]]; then test -s "$RUNNER_TEMP/prepare/managed-writer-chain-proof.json"; fi
          if [[ "$RUNNER_OS" == Linux ]]; then test -s "$RUNNER_TEMP/prepare/normal-release-proof.json"; fi
      - name: Verify committed source identity survived runtime preparation
        shell: bash
        run: |
          uv run --locked --no-dev python - <<'PY'
          import json, os, pathlib, platform
          from cli.release_build import read_application_identity
          from shared.runtime_release import verify_release
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'prepare'
          build = json.loads((root / 'application-build/build-receipt.json').read_bytes())
          proof = json.loads((root / 'proof.json').read_bytes())
          assert proof['platform'] == platform.platform(), (proof['platform'], platform.platform())
          image = verify_release(root / 'unit/releases', proof['artifact_digest'],
              manifest_digest=proof['manifest_digest'], platform_tag=platform.platform(),
              schema_digest=build['schema_digest'])
          identity = read_application_identity(image, build['source_commit']).model_dump(mode='json')
          assert all(build[key] == value for key, value in identity.items())
          (root / 'application-identity-proof.json').write_text(json.dumps(identity) + '\n')
          PY
      - name: Updater bootstrap regression cases
        if: runner.os == 'Linux'
        shell: bash
        run: uv run --locked pytest tests/cli/test_update_bootstrap.py tests/cli/test_update_agent_runner.py tests/shared/test_updater_handoff.py tests/shared/test_posixproc_expected_signal.py -q
      - name: Retain independent resolver proof even when inherited hop fails
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runtime-publication-input-${{ github.sha }}
          path: ${{ runner.temp }}/prepare/runtime-publication-input-proof.json
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: inactive-prepare-${{ matrix.os }}-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/prepare/proof.json
            ${{ runner.temp }}/prepare/application-build/build-receipt.json
            ${{ runner.temp }}/prepare/application-identity-proof.json
            ${{ runner.temp }}/prepare/migration-proof.json
            ${{ runner.temp }}/prepare/otel-proof.json
            ${{ runner.temp }}/prepare/plugin-proof.json
            ${{ runner.temp }}/prepare/inventory-proof.json
            ${{ runner.temp }}/frontend-proof.json
            ${{ runner.temp }}/prepare/ops-bootstrap-proof.json
            ${{ runner.temp }}/prepare/updater-bootstrap-proof.json
            ${{ runner.temp }}/prepare/managed-writer-chain-proof.json
            ${{ runner.temp }}/prepare/normal-release-proof.json
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && runner.os == 'Linux'
        with:
          name: updater-hop-observations-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/prepare/hop-observation-*.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && runner.os == 'Linux'
        with:
          name: normal-release-observations-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/prepare/normal-release-observation-*.json
            ${{ runner.temp }}/prepare/normal-release-cases/**
            ${{ runner.temp }}/prepare/unit/logs/**
          if-no-files-found: ignore
      - name: Stop isolated native PG
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/runtime-pg/postmaster.pid"; then
            pg_ctl -D "$RUNNER_TEMP/runtime-pg" -m fast -w stop
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && runner.os == 'Linux'
        with:
          name: migration-pg-log-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/runtime-pg.log
          if-no-files-found: error
