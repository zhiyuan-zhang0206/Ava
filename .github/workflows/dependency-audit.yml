# The PR-time dependency audit in ci.yml is informational and nobody reads it. This weekly run
# turns the same checks (plus the version constants Ava downloads outside the lockfiles) into
# one tracked issue: opened or updated while a high/critical advisory or a behind pin exists,
# closed when a run comes back clean. It never changes a pin.

name: Dependency Audit

on:
  schedule:
    - cron: '41 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: dependency-audit
  cancel-in-progress: false

jobs:
  audit:
    name: weekly dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `uvx` runs the audit-capable uv the script pins; the script itself is stdlib-only.
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.23
          enable-cache: false

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/web/package-lock.json

      - name: Audit dependencies and pinned binaries
        env:
          GH_TOKEN: ${{ github.token }}
          AVA_HOME: ${{ runner.temp }}/ava-home
        run: |
          mkdir -p "$AVA_HOME"
          python3 scripts/ci/dependency_audit.py \
            --out "$RUNNER_TEMP/dependency-audit.md" --sync-issue "$GITHUB_REPOSITORY"
          cat "$RUNNER_TEMP/dependency-audit.md" >> "$GITHUB_STEP_SUMMARY"
