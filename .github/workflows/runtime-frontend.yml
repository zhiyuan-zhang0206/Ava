name: Standalone frontend release closure
on:
  pull_request:
    paths:
      - 'ui/web/next.config.ts'
      - 'ui/web/package-lock.json'
      - 'scripts/prepare_frontend_release.mjs'
      - 'scripts/prove_frontend_release.mjs'
      - 'scripts/runtime-node-version'
      - '.github/workflows/runtime-frontend.yml'
permissions:
  contents: read
jobs:
  source-absent-http:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: scripts/runtime-node-version
      - name: Build traced artifact before runtime preparation
        working-directory: ui/web
        env:
          AVA_FRONTEND_RELEASE: '1'
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_GATEWAY_PORT: '8000'
          NEXT_PUBLIC_API_BASE: ''
        run: |
          npm ci && npm run build
          node --input-type=module - <<'JS'
          import { recordFrontendBuildConfig } from '../../scripts/prepare_frontend_release.mjs';
          recordFrontendBuildConfig(process.cwd(), process.env.NEXT_PUBLIC_GATEWAY_PORT, process.env.NEXT_PUBLIC_API_BASE);
          JS
      - name: Private retained Node and source-absent HTTP proof
        run: node scripts/prove_frontend_release.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frontend-closure-${{ matrix.os }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/frontend-proof.json
          if-no-files-found: error
