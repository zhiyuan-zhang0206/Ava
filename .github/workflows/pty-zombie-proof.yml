name: PTY zombie observation regression proof
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['shared/pty_sessions/**', 'tests/shared/test_pty_sessions_cli.py', 'tests/shared/test_posixproc.py', '.github/workflows/pty-zombie-proof.yml']
permissions:
  contents: read
jobs:
  prove-zombie-observation:
    if: github.head_ref == 'ava-stability-pty-zombie-observation'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AVA_DB_URL: postgresql://unused@127.0.0.1:1/unused
      AVA_REDIS_URL: redis://127.0.0.1:1/0
      BASELINE_SHA: eecab0bab7aea636e1d6fc8b195177daa52482f7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.10.2
      - uses: ./.github/actions/install-pg-redis
      - run: uv sync --frozen
      - name: Verify zombie exclusion and real child shutdown
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          git rev-parse HEAD > proof/head-sha.txt
          printf '%s\n' "$BASELINE_SHA" > proof/baseline-sha.txt
          timeout 240 uv run pytest tests/shared/test_pty_sessions_cli.py tests/shared/test_posixproc.py -k 'zombie_is_not or crashed_host_is_swept or kill_session_group_kill_reaps_late_spawned_child' -q --junitxml=proof/head.xml
          git show "$BASELINE_SHA:shared/pty_sessions/cli.py" > shared/pty_sessions/cli.py
          git show "$BASELINE_SHA:shared/pty_sessions/host.py" > shared/pty_sessions/host.py
          set +e
          timeout 180 uv run pytest tests/shared/test_pty_sessions_cli.py -k zombie_is_not -q --junitxml=proof/baseline.xml
          result=$?
          set -e
          test "$result" -eq 1
          python - <<'PY'
          import xml.etree.ElementTree as ET
          head = ET.parse('proof/head.xml')
          old = ET.parse('proof/baseline.xml')
          assert len(head.findall('.//testcase')) == 6
          assert not head.findall('.//failure') and not head.findall('.//error')
          assert len(old.findall('.//testcase')) == 4
          assert not old.findall('.//error')
          failures = {c.attrib['name'] for c in old.findall('.//testcase') if c.find('failure') is not None}
          assert failures == {f'test_zombie_is_not_a_live_pty_session[{observer}-{ticks}]' for observer in ('cli', 'host') for ticks in ('None', '123')}
          PY
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pty-zombie-proof-${{ github.event.pull_request.head.sha }}
          path: proof/
          if-no-files-found: error
