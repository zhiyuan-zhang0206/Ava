name: "Install Python deps (uv sync --frozen with bounded retry)"
description: >
  Runs `uv sync --frozen` against the canonical PyPI lock with bounded backoff
  for transient download failures. Package versions, hashes, and sources stay
  locked; regional mirror selection belongs to explicit host configuration.
runs:
  using: composite
  steps:
    - name: uv sync --frozen
      shell: bash
      run: |
        # Retry the same locked artifacts; never switch indexes or re-resolve.
        for attempt in 1 2 3 4; do
          if uv sync --frozen; then
            exit 0
          fi
          if [ "$attempt" -lt 4 ]; then
            delay=$((attempt * 15))
            echo "uv sync --frozen attempt ${attempt} failed; retrying in ${delay}s"
            sleep "$delay"
          fi
        done
        echo "uv sync --frozen failed after 4 attempts; giving up"
        exit 1
